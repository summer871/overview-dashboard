<script id="cdaRemakeDashboardAdapterControllerV6548">
(function installRemakeDashboardAdapterV6548(){

    const card = cardV6548(component,context);

  function invokeV6548(component,action,context){

    if (!provider || typeof provider.click !== 'function') return false;
    provider.click();

    const id = Array.isArray(component.tableIds) && component.tableIds.length
      ? component.tableIds[0]
      : component.targetId;
    const card = cardV6548(component,context);
    let target = null;
    if (card && id) {
      if (card.id === id) target = card;
      else {
        try { target = card.querySelector('#' + CSS.escape(id)); }
        catch (error) { target = card.querySelector('[id="' + String(id).replace(/"/g,'\\"') + '"]'); }

    }
    if (!target) target = id && document.getElementById(id);
    return target && target.tagName === 'TABLE'
      ? target
      : target && target.closest ? target.closest('table') : null;
  }

  function legacyCompareButtonV6548(component,context){
    return providerV6548(component,'comparePriorYear',context);
  }

  function comparisonActiveV6548(component,context){
    const table = targetTableV6548(component,context);
    const legacy = legacyCompareButtonV6548(component,context);
    return !!((table && table.classList.contains('compareColumnsV6301')) ||

    const match = String(legacy && legacy.textContent || '').match(/\b(20\d{2})\b/);
    return match ? match[1] : String(new Date().getFullYear() - 1);

  }

    const canvas = card && card.querySelector ? card.querySelector('canvas') : null;

  function exportCurrentV6548(context){
    return invokeV6548(context.component,'exportCurrent',context);
  }

  function exportAllV6548(context){

  function collapseV6555(context){
    const key = context.component.collapseKey;
    if (!key || typeof window.toggleRemakeSectionV6402 !== 'function') return false;
    window.toggleRemakeSectionV6402(key);
