<!-- SharedDashboardRendererV6547.html
Version: v6.548
Date: 2026-07-29
Purpose: Replace-mode tab and card renderer. Existing-tab decoration is owned separately.
-->
<style id="cdaSharedDashboardRendererStylesV6547">
  [data-cda-dashboard-tab] .remakeTableWrap { width:100%; min-width:0; overflow:auto; }
  [data-cda-dashboard-tab] table.remakeTable { width:100%; }
</style>
<script id="cdaSharedDashboardRendererControllerV6547">
(function installSharedDashboardRendererV6547(){
  'use strict';

  if (window.cdaDashboardRendererV6547) return;
  const platform = window.cdaDashboardPlatformV6547;
  const toolbar = window.cdaDashboardToolbarV6548;
  if (!platform || !toolbar) throw new Error('Registry and toolbar must load before renderer.');

  function componentFor(tab, componentKey){
    return tab && tab.components.find(function(item){ return item.key === componentKey; }) || null;
  }

  function cardMarkup(tab, component){
    const body = component.renderBody({ tab:tab, component:component, platform:platform });
    const title = typeof component.renderTitle === 'function'
      ? component.renderTitle({ tab:tab, component:component, platform:platform })
      : '<div class="tatCardTitleV6509 remakeCardTitle">' + platform.util.escapeHtml(component.title) + '</div>';
    return '<article' + (component.cardId ? ' id="' + platform.util.escapeHtml(component.cardId) + '"' : '') +
      ' class="tatCardV6509 remakeCard cdaDashboardCardV6547' + (component.wide ? ' tatWideV6509' : '') + '"' +
      ' data-cda-dashboard-component="' + platform.util.escapeHtml(component.key) + '">' +
      '<div class="tatCardHeadV6509 remakeCardHeader cdaDashboardCardHeaderV6547"><div>' + title + '</div>' +
      toolbar.markup(tab, component) + '</div>' + body + '</article>';
  }

  function renderComponent(tab, componentKey){
    const component = componentFor(tab, componentKey);
    if (!component) throw new Error('Unknown component: ' + componentKey);
    return cardMarkup(tab, component);
  }

  function rebuild(tabKey){
    const validation = platform.validateTab(tabKey);
    if (!validation.ok) throw new Error(validation.errors.join('\n'));
    const tab = platform.getTab(tabKey);
    if (tab.mountMode !== 'replace') throw new Error('Tab is not replace-mode: ' + tabKey);
    const oldPage = document.getElementById(tab.pageId);
    if (!oldPage) return null;
    if (oldPage.getAttribute('data-cda-dashboard-version') === platform.version) return oldPage;
    const wasActive = oldPage.classList.contains('active') || getComputedStyle(oldPage).display !== 'none';
    if (typeof tab.beforeReplace === 'function') tab.beforeReplace({ oldPage:oldPage, tab:tab });
    const page = document.createElement(oldPage.tagName.toLowerCase());
    page.id = tab.pageId;
    page.className = tab.pageClass || 'tabContent cleanRemakeV6230';
    page.setAttribute('data-cda-dashboard-tab', tab.key);
    page.setAttribute('data-cda-dashboard-version', platform.version);
    page.innerHTML = tab.renderLayout({
      tab:tab,
      platform:platform,
      renderComponent:function(componentKey){ return renderComponent(tab, componentKey); }
    });
    oldPage.parentNode.replaceChild(page, oldPage);
    page.style.setProperty('display', wasActive ? 'block' : 'none', 'important');
    if (wasActive) {
      page.classList.add('active');
      page.style.setProperty('visibility', 'visible', 'important');
    }
    if (typeof tab.afterReplace === 'function') tab.afterReplace({ page:page, tab:tab, wasActive:wasActive });
    platform.util.emit('cdaDashboardTabRenderedV6547', { tabKey:tab.key });
    return page;
  }

  function duplicateIds(root){
    const seen = new Set();
    const duplicates = new Set();
    if (!root) return [];
    root.querySelectorAll('[id]').forEach(function(node){
      if (seen.has(node.id)) duplicates.add(node.id); else seen.add(node.id);
    });
    return Array.from(duplicates).sort();
  }

  function audit(tabKey){
    const tab = platform.getTab(tabKey);
    const validation = platform.validateTab(tabKey);
    const page = tab ? document.getElementById(tab.pageId) : null;
    const cards = page ? Array.from(page.querySelectorAll('[data-cda-dashboard-component]')) : [];
    const duplicates = duplicateIds(page);
    return {
      version:platform.version,
      tabKey:tabKey,
      mountMode:'replace',
      validation:validation,
      pagePresent:!!page,
      renderedVersion:page && page.getAttribute('data-cda-dashboard-version'),
      cardCount:cards.length,
      expectedCardCount:tab ? tab.components.length : 0,
      noDuplicateIds:duplicates.length === 0,
      duplicateIds:duplicates,
      oneCardPerComponent:!!tab && tab.components.every(function(component){
        return !!page && page.querySelectorAll('[data-cda-dashboard-component="' + component.key + '"]').length === 1;
      })
    };
  }

  window.cdaDashboardRendererV6547 = Object.freeze({
    version:'v6.548',
    rebuild:rebuild,
    renderComponent:renderComponent,
    audit:audit
  });
})();
</script>
