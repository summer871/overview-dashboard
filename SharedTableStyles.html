<!-- SharedTableStyles.html v6.535
Single owner of table appearance for every dashboard tab at EVERY viewport width.
Must be included last among the stylesheets, immediately after SharedTopParityStyles.
-->
<style id="cdaSharedTableStandardV6535">
  /*
   * Version: v6.535 - one table appearance, all widths
   *
   * WHAT CHANGED FROM v6.534
   *
   * v6.533 and v6.534 wrapped everything in @media (min-width: 1280px). That was
   * wrong. Below 1280px the file was completely inert, so the compact and
   * split-screen views still showed the old divergent styling:
   *
   *   Remake headers  #3b556e   from .remakeTable th in DashboardBaseStyles L8589
   *   TAT headers     #263238   from the global th rule, because TAT tables are
   *                             .tatTableV6509 and were never covered by any
   *                             .remakeTable scoped rule
   *   sizes/weights   whatever RemakeResponsiveStyles or the global base supplied
   *
   * Different rule, different hex, different size. Hence still visibly different.
   *
   * v6.535 splits the file in two:
   *
   *   SECTION A - APPEARANCE. No media query. Applies at every width.
   *     font-family, font-size, font-weight, line-height, colour,
   *     header background, border colour.
   *     These are the properties that must be identical everywhere.
   *
   *   SECTION B - PADDING. Scoped to min-width: 981px.
   *     Compact and mobile deliberately use tighter cell padding so wide tables
   *     stay usable on a narrow screen. Forcing desktop padding there would
   *     create horizontal scrolling on every table. 981px is used, not 1280px,
   *     because that is the breakpoint the Remake desktop rules themselves use.
   *
   * Owner:   Shared. This file is the authoritative source for table appearance.
   *
   * Approved standard, identical on every tab at every width:
   *   header  background #172033, colour #ffffff, weight 900, 10.5px/1.2
   *   cell    11px/1.25, weight 400, colour #172033
   *   borders header #2a3a4f, cell #e4e7ec
   *   family  Roboto, Arial, sans-serif
   *   padding 6px 8px at 981px and above; owned elsewhere below that
   *
   * SAFETY NOTES - read before editing:
   *
   * 1. Include position. This file MUST be included last among the stylesheets,
   *    immediately after SharedTopParityStyles. Competing rules are injected at
   *    runtime by scripts inside Index.html, which land after every static
   *    stylesheet, so cascade position alone is not enough. This file must also
   *    win on specificity, which is why the selectors look heavier than needed.
   *
   * 2. Two-ID selectors for the four named Remake tables are required. The
   *    injected block remakeV6317LayoutBalanceStyles targets
   *    #remakeFactorPage #remakeDepartmentTable th with two IDs, specificity
   *    (2,2,1). A one-ID rule loses to it no matter how many classes it carries,
   *    because ID count is compared first.
   *
   * 3. Doubled class selectors (.remakeTable.remakeTable) are intentional. They
   *    raise specificity without changing what is matched. Do not "clean up".
   *
   * 4. .tatTableV6509 is listed separately on purpose. TAT tables do not carry
   *    the .remakeTable class and have no id, so every .remakeTable scoped rule
   *    in the codebase misses them entirely.
   *
   * 5. Deliberately NOT declared here, because other files own them and
   *    overriding them breaks working behaviour:
   *      text-align            per-column alignment
   *      width / min-width     column geometry and table minimum widths
   *      position / top / z-index   sticky headers, frozen first columns
   *      overflow / text-overflow / white-space
   *      row-state background  hover, selected, pinned, dimmed, section rows
   *      td background         row striping
   *
   * 6. Row striping is deliberately untouched. Overview stripes #fafafa and
   *    Remake stripes #f9fafb, one shade apart. Unifying it means excluding
   *    every row-state class and belongs in its own reviewed change.
   */

  /* ==================================================================
     SECTION A - APPEARANCE. Every width. No media query.
     ================================================================== */

  /* ---- A1. Table typography baseline ---- */
  html body #overviewOne table,
  html body #overviewOne .moverArea.moverArea table,
  html body #overviewTwo table,
  html body #remakeFactorPage .remakeTable.remakeTable,
  html body #tatDashboardPageV6509 .remakeTable.remakeTable,
  html body #tatDashboardPageV6509 .tatTableV6509.tatTableV6509,
  html body #remakeFactorPage #remakeCeramistTableV6342,
  html body #remakeFactorPage #remakeCeramistDetailTableV6343,
  html body #tatDashboardPageV6509 #remakeCeramistTableV6342,
  html body #tatDashboardPageV6509 #remakeCeramistDetailTableV6343 {
    font-family: Roboto, Arial, sans-serif !important;
    font-size: 11px !important;
    line-height: 1.25 !important;
  }

  /* ---- A2. Header cells, one ID scope ---- */
  html body #overviewOne th,
  html body #overviewOne .moverArea.moverArea th,
  html body #overviewTwo th,
  html body #remakeFactorPage .remakeTable.remakeTable th,
  html body #tatDashboardPageV6509 .remakeTable.remakeTable th,
  html body #tatDashboardPageV6509 .tatTableV6509.tatTableV6509 th {
    background: #172033 !important;
    color: #ffffff !important;
    font-family: Roboto, Arial, sans-serif !important;
    font-size: 10.5px !important;
    font-weight: 900 !important;
    line-height: 1.2 !important;
    border-color: #2a3a4f !important;
  }

  /* ---- A3. Header cells, two ID scope.
            Beats remakeV6317LayoutBalanceStyles and the sticky first-header
            background overrides in RemakeResponsiveStyles. ---- */
  html body #remakeFactorPage #remakeDepartmentTable.remakeTable.remakeTable th,
  html body #remakeFactorPage #remakeReasonTable.remakeTable.remakeTable th,
  html body #remakeFactorPage #remakeProductTable.remakeTable.remakeTable th,
  html body #remakeFactorPage #remakeCustomerTable.remakeTable.remakeTable th,
  html body #remakeFactorPage #remakeCeramistTableV6342 th,
  html body #remakeFactorPage #remakeCeramistDetailTableV6343 th,
  html body #tatDashboardPageV6509 #remakeCeramistTableV6342 th,
  html body #tatDashboardPageV6509 #remakeCeramistDetailTableV6343 th,
  html body #remakeFactorPage #remakeDepartmentTable.remakeTable.remakeTable thead th:first-child,
  html body #remakeFactorPage #remakeReasonTable.remakeTable.remakeTable thead th:first-child,
  html body #remakeFactorPage #remakeProductTable.remakeTable.remakeTable thead th:first-child,
  html body #remakeFactorPage #remakeCustomerTable.remakeTable.remakeTable thead th:first-child,
  html body #remakeFactorPage #remakeCeramistTableV6342 thead th:first-child,
  html body #remakeFactorPage #remakeCeramistDetailTableV6343 thead th:first-child {
    background: #172033 !important;
    color: #ffffff !important;
    font-family: Roboto, Arial, sans-serif !important;
    font-size: 10.5px !important;
    font-weight: 900 !important;
    line-height: 1.2 !important;
    border-color: #2a3a4f !important;
  }

  /* ---- A4. Data cells, one ID scope. Type and borders only. ---- */
  html body #overviewOne td,
  html body #overviewOne .moverArea.moverArea td,
  html body #overviewTwo td,
  html body #remakeFactorPage .remakeTable.remakeTable td,
  html body #tatDashboardPageV6509 .remakeTable.remakeTable td,
  html body #tatDashboardPageV6509 .tatTableV6509.tatTableV6509 td {
    font-family: Roboto, Arial, sans-serif !important;
    font-size: 11px !important;
    line-height: 1.25 !important;
    border-color: #e4e7ec !important;
  }

  /* ---- A5. Data cells, two ID scope ---- */
  html body #remakeFactorPage #remakeDepartmentTable.remakeTable.remakeTable td,
  html body #remakeFactorPage #remakeReasonTable.remakeTable.remakeTable td,
  html body #remakeFactorPage #remakeProductTable.remakeTable.remakeTable td,
  html body #remakeFactorPage #remakeCustomerTable.remakeTable.remakeTable td,
  html body #remakeFactorPage #remakeCeramistTableV6342 td,
  html body #remakeFactorPage #remakeCeramistDetailTableV6343 td,
  html body #tatDashboardPageV6509 #remakeCeramistTableV6342 td,
  html body #tatDashboardPageV6509 #remakeCeramistDetailTableV6343 td {
    font-family: Roboto, Arial, sans-serif !important;
    font-size: 11px !important;
    line-height: 1.25 !important;
    border-color: #e4e7ec !important;
  }

  /* ---- A6. Data cell colour and weight.
            .negative and .positive excluded so red and green figures keep
            their colour and their heavier weight. ---- */
  html body #overviewOne td:not(.negative):not(.positive),
  html body #overviewOne .moverArea.moverArea td:not(.negative):not(.positive),
  html body #overviewTwo tbody tr:not(.pinned) > td:not(.negative):not(.positive),
  html body #remakeFactorPage .remakeTable.remakeTable td:not(.negative):not(.positive),
  html body #tatDashboardPageV6509 .remakeTable.remakeTable td:not(.negative):not(.positive),
  html body #tatDashboardPageV6509 .tatTableV6509.tatTableV6509 td:not(.negative):not(.positive),
  html body #remakeFactorPage #remakeDepartmentTable.remakeTable.remakeTable td:not(.negative):not(.positive),
  html body #remakeFactorPage #remakeReasonTable.remakeTable.remakeTable td:not(.negative):not(.positive),
  html body #remakeFactorPage #remakeProductTable.remakeTable.remakeTable td:not(.negative):not(.positive),
  html body #remakeFactorPage #remakeCustomerTable.remakeTable.remakeTable td:not(.negative):not(.positive) {
    color: #172033 !important;
    font-weight: 400 !important;
  }

  /* ---- A7. In-cell name text matches the cell scale ---- */
  html body #remakeFactorPage .remakeTable.remakeTable .customerNameText,
  html body #remakeFactorPage .remakeTable.remakeTable .remakeNameText,
  html body #remakeFactorPage .remakeTable.remakeTable .productNameText,
  html body #tatDashboardPageV6509 .remakeTable.remakeTable .customerNameText,
  html body #tatDashboardPageV6509 .remakeTable.remakeTable .remakeNameText,
  html body #tatDashboardPageV6509 .remakeTable.remakeTable .productNameText,
  html body #remakeFactorPage #remakeDepartmentTable.remakeTable.remakeTable .remakeNameText,
  html body #remakeFactorPage #remakeProductTable.remakeTable.remakeTable .productNameText,
  html body #remakeFactorPage #remakeCustomerTable.remakeTable.remakeTable .customerNameText {
    font-size: 11px !important;
    line-height: 1.25 !important;
  }

  /* ---- A8. In-cell badges stay small but consistent ---- */
  html body #remakeFactorPage .remakeTable.remakeTable .inactiveBadge,
  html body #remakeFactorPage .remakeTable.remakeTable .ceramistNoteBadgeV6343,
  html body #tatDashboardPageV6509 .remakeTable.remakeTable .inactiveBadge,
  html body #tatDashboardPageV6509 .remakeTable.remakeTable .ceramistNoteBadgeV6343 {
    font-size: 9px !important;
    line-height: 1 !important;
  }

  /* ==================================================================
     SECTION B - PADDING. 981px and above only.
     Compact and mobile keep their own tighter padding on purpose.
     ================================================================== */

  @media (min-width: 981px) {

    html body #overviewOne th,
    html body #overviewOne .moverArea.moverArea th,
    html body #overviewTwo th,
    html body #remakeFactorPage .remakeTable.remakeTable th,
    html body #tatDashboardPageV6509 .remakeTable.remakeTable th,
    html body #tatDashboardPageV6509 .tatTableV6509.tatTableV6509 th,
    html body #overviewOne td,
    html body #overviewOne .moverArea.moverArea td,
    html body #overviewTwo td,
    html body #remakeFactorPage .remakeTable.remakeTable td,
    html body #tatDashboardPageV6509 .remakeTable.remakeTable td,
    html body #tatDashboardPageV6509 .tatTableV6509.tatTableV6509 td {
      padding: 6px 8px !important;
    }

    html body #remakeFactorPage #remakeDepartmentTable.remakeTable.remakeTable th,
    html body #remakeFactorPage #remakeReasonTable.remakeTable.remakeTable th,
    html body #remakeFactorPage #remakeProductTable.remakeTable.remakeTable th,
    html body #remakeFactorPage #remakeCustomerTable.remakeTable.remakeTable th,
    html body #remakeFactorPage #remakeDepartmentTable.remakeTable.remakeTable td,
    html body #remakeFactorPage #remakeReasonTable.remakeTable.remakeTable td,
    html body #remakeFactorPage #remakeProductTable.remakeTable.remakeTable td,
    html body #remakeFactorPage #remakeCustomerTable.remakeTable.remakeTable td,
    html body #remakeFactorPage #remakeCeramistTableV6342 th,
    html body #remakeFactorPage #remakeCeramistDetailTableV6343 th,
    html body #remakeFactorPage #remakeCeramistTableV6342 td,
    html body #remakeFactorPage #remakeCeramistDetailTableV6343 td,
    html body #tatDashboardPageV6509 #remakeCeramistTableV6342 th,
    html body #tatDashboardPageV6509 #remakeCeramistDetailTableV6343 th,
    html body #tatDashboardPageV6509 #remakeCeramistTableV6342 td,
    html body #tatDashboardPageV6509 #remakeCeramistDetailTableV6343 td {
      padding: 6px 8px !important;
    }

  }

  /* ==================================================================
     SECTION C - PRESERVE RULES.
     Sections A and B are heavier than the rules that used to own these
     elements, so their intended treatment is restated here at higher
     specificity. Without this block the ceramist section bands would
     flatten to normal body text and Overview 2.0 pinned rows would lose
     their weight.
     ================================================================== */

  /* Ceramist grey uppercase section bands */
  html body #remakeFactorPage #remakeCeramistTableV6342 tbody tr.ceramistSectionRowV6348 > td,
  html body #remakeFactorPage #remakeCeramistDetailTableV6343 tbody tr.ceramistSectionRowV6348 > td,
  html body #tatDashboardPageV6509 #remakeCeramistTableV6342 tbody tr.ceramistSectionRowV6348 > td,
  html body #tatDashboardPageV6509 #remakeCeramistDetailTableV6343 tbody tr.ceramistSectionRowV6348 > td {
    color: #475467 !important;
    font-size: 9.5px !important;
    font-weight: 900 !important;
    letter-spacing: .04em !important;
    text-transform: uppercase !important;
  }

  /* Overview 2.0 pinned rows keep their heavier weight */
  html body #overviewTwo tbody tr.pinned.pinned > td {
    font-weight: 850 !important;
  }

  /* Red and green figures keep their weight */
  html body #overviewOne td.negative,
  html body #overviewOne td.positive,
  html body #overviewOne .moverArea.moverArea td.negative,
  html body #overviewOne .moverArea.moverArea td.positive,
  html body #overviewTwo td.negative,
  html body #overviewTwo td.positive,
  html body #remakeFactorPage .remakeTable.remakeTable td.negative,
  html body #remakeFactorPage .remakeTable.remakeTable td.positive,
  html body #tatDashboardPageV6509 .remakeTable.remakeTable td.negative,
  html body #tatDashboardPageV6509 .remakeTable.remakeTable td.positive {
    font-weight: 800 !important;
  }
</style>
