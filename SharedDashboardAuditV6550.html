  if (window.cdaDashboardAuditV6550 && window.cdaDashboardAuditV6550.version === 'v6.681') return;

  function visible(node){
    if (!node || !window.getComputedStyle) return false;
    const style = window.getComputedStyle(node);
    return !node.hidden && style.display !== 'none' && style.visibility !== 'hidden' && style.opacity !== '0';
  }

  function styleSignature(node){
    if (!node || !window.getComputedStyle) return '';
    const style = window.getComputedStyle(node);
    return [style.width,style.height,style.minWidth,style.minHeight,style.paddingLeft,
      style.paddingRight,style.borderWidth,style.borderStyle,style.borderRadius,
      style.backgroundColor,style.color,style.fontFamily,style.fontSize,

  function expectedIconName(button){
    return button && (button.getAttribute('data-cda-dashboard-icon-state') ||
      button.getAttribute('data-cda-dashboard-icon') || '') || '';

  function duplicateIds(root){
    const seen = new Set();
    const duplicates = new Set();
    if (!root) return [];
    root.querySelectorAll('[id]').forEach(function(node){
      if (seen.has(node.id)) duplicates.add(node.id); else seen.add(node.id);

    return Array.from(duplicates).sort();

  function tabAudit(tabKey){
    const platform = window.cdaDashboardPlatformV6547;
    const renderer = window.cdaDashboardRendererV6547;
    const tab = platform && platform.getTab(tabKey);
    const page = tab && document.getElementById(tab.pageId);
    const base = renderer && tab ? renderer.audit(tabKey) : null;
    const toolbars = page ? Array.from(page.querySelectorAll('.cdaDashboardToolbarV6547')) : [];
    const expectedToolbarCount = tab ? tab.components.length : 0;
    const duplicateToolbars = [];
    if (tab && page) {
      tab.components.forEach(function(component){
        const count = page.querySelectorAll('.cdaDashboardToolbarV6547[data-cda-dashboard-toolbar="' + component.key + '"]').length;
        if (count !== 1) duplicateToolbars.push({component:component.key,count:count});
      });

    return {
      tabKey:tabKey,
      registered:!!tab,
      mountMode:tab && tab.mountMode,
      pagePresent:!!page,
      canonicalPage:!!page && page.getAttribute('data-cda-dashboard-tab') === tabKey,
      duplicateIds:duplicateIds(page),

      duplicateToolbars:duplicateToolbars,

        !!base && base.validation && base.validation.ok && base.oneCardPerComponent && base.headerControlsOwned

    const visibleLegacyHeaderActions = [];

      page.querySelectorAll('.remakeCardHeader button,.cdaDashboardCardHeaderV6547 button').forEach(function(button){

        if (button.closest('.remakeProductModeBarV6264')) return;
        visibleLegacyHeaderActions.push({id:button.id || '',text:String(button.textContent || '').trim()});

      decoratedMarkerAbsent:!!page && !page.hasAttribute('data-cda-dashboard-decorated-tab'),
      nativeLegacySectionButtonsAbsent:!!page && page.querySelectorAll('[data-remake-section-toggle-v6402]').length === 0,

      tat:tat,
      remakeLegacy:legacy,
      componentCatalog:catalog,
      bothTabsReplaceMode:remake.mountMode === 'replace' && tat.mountMode === 'replace',
      oneRendererOwner:!!window.cdaDashboardRendererV6547 && !window.cdaDashboardDecoratorV6548,
      ok:remake.ok && tat.ok && legacy.ok && catalog.ok

  }

  window.cdaDashboardAuditV6550 = Object.freeze({
    version:'v6.681',
    visible:visible,
    styleSignature:styleSignature,

    audit:audit,
    tabAudit:tabAudit,
    remakeLegacyAudit:remakeLegacyAudit
