<!-- SharedFilterBar.html
Version: v1.1.0
Date: 2026-08-20
Purpose: Shared config-driven filter bar module with linked inventory auto-deselect.
         Each tab instantiates with its own config + adapter.
         Loads passively; does not replace existing filters until explicitly activated.

Linked inventory behavior:
  When any filter selection changes, other filters auto-deselect options
  that have zero rows in the current population. Options stay visible and
  selectable, they just lose their checkmark.

Adapter contract addition for v1.1.0:
  getPopulationKeys(filterKey) => Set of option keys that exist in the
  population filtered by all OTHER active filters (excluding this filter's own).
  If this method is not provided, linked inventory is disabled.
-->
<script id="cdaSharedFilterBarModule">
(function installSharedFilterBar() {
  'use strict';

  if (window.cdaSharedFilterBar && window.cdaSharedFilterBar.version === 'v1.1.0') return;

  function esc(v) {
    return String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function fuzzyMatch(text, term) {
    if (window.dashboardFuzzySearchV6412 && typeof window.dashboardFuzzySearchV6412.match === 'function') return window.dashboardFuzzySearchV6412.match(text, term);
    var p = String(text || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ');
    return String(term || '').toLowerCase().trim().split(/\s+/).filter(Boolean).every(function(t) { return p.indexOf(t) >= 0; });
  }

  var instances = new Map();

  function FB(config) {
    this.key = config.key;
    this.filters = config.filters || [];
    this.adapter = config.adapter;
    this.features = config.features || {};
    this.mounted = false;
    this.el = {};
    this.openFilter = null;
  }

  FB.prototype.mount = function() {
    if (this.mounted) return;
    var target = typeof this.config_mountTarget === 'string' ? document.querySelector(this.config_mountTarget) : this.config_mountTarget;
    if (!target) return;
    var id = 'cdaFilterBar_' + this.key;
    if (document.getElementById(id)) { this.el.bar = document.getElementById(id); this.mounted = true; return; }
    var bar = document.createElement('div');
    bar.id = id; bar.className = 'cdaFilterBar'; bar.setAttribute('data-filter-bar', this.key);
    bar.innerHTML = this.filters.map(this.markup.bind(this)).join('');
    target.insertBefore(bar, target.firstChild);
    this.el.bar = bar; this.mounted = true; this.bind();
  };
  FB.prototype.config_mountTarget = null;

  FB.prototype.markup = function(f) {
    var k = this.key, fk = f.key;
    return '<div class="cdaFilter" data-filter-bar-key="'+esc(k)+'" data-filter-key="'+esc(fk)+'">'
      +'<button id="cdaFBtn_'+k+'_'+fk+'" class="cdaFilterButton" type="button" aria-haspopup="listbox" aria-expanded="false">'+esc(f.allLabel)+'</button>'
      +'<div id="cdaFPanel_'+k+'_'+fk+'" class="cdaFilterPanel" data-panel-width="'+(f.panelWidth||360)+'" data-position="'+(f.position||'left')+'">'
      +'<div class="cdaFilterHeader">'
      +(this.features.visibleToggle?'<label class="cdaFilterVisibleToggle"><input id="cdaFVis_'+k+'_'+fk+'" type="checkbox"> Visible</label>':'')
      +'<button type="button" data-action="selectAll">All</button>'
      +'<button type="button" data-action="clear">None</button>'
      +'<button type="button" data-action="reset">Reset</button>'
      +'<span id="cdaFCount_'+k+'_'+fk+'" class="cdaFilterCount"></span></div>'
      +'<input id="cdaFSearch_'+k+'_'+fk+'" class="cdaFilterSearch" type="search" placeholder="Search '+esc(f.label.toLowerCase())+'...">'
      +'<div id="cdaFList_'+k+'_'+fk+'" class="cdaFilterList" role="listbox" aria-multiselectable="true"></div></div></div>';
  };

  FB.prototype.bind = function() {
    var self = this, bar = this.el.bar; if (!bar) return;
    bar.addEventListener('click', function(e) {
      var btn = e.target.closest('.cdaFilterButton');
      if (btn) { e.preventDefault(); e.stopPropagation(); var fk = btn.closest('[data-filter-key]').getAttribute('data-filter-key'); if (fk) self.toggle(fk); return; }
      var act = e.target.closest('[data-action]');
      if (act) { e.preventDefault(); e.stopPropagation(); var el = act.closest('[data-filter-key]'); if (el) self.handleAction(el.getAttribute('data-filter-key'), act.getAttribute('data-action')); return; }
      var only = e.target.closest('.cdaFilterOnly');
      if (only) { e.preventDefault(); e.stopPropagation(); var el2 = only.closest('[data-filter-key]'), row = only.closest('.cdaFilterRow'); if (el2 && row) self.exclusive(el2.getAttribute('data-filter-key'), row.getAttribute('data-option-key')); return; }
      var row2 = e.target.closest('.cdaFilterRow');
      if (row2) { e.preventDefault(); e.stopPropagation(); var el3 = row2.closest('[data-filter-key]'); if (el3) self.toggleOpt(el3.getAttribute('data-filter-key'), row2.getAttribute('data-option-key')); return; }
    });
    bar.addEventListener('input', function(e) { var inp = e.target.closest('.cdaFilterSearch'); if (!inp) return; var el = inp.closest('[data-filter-key]'), fk = el && el.getAttribute('data-filter-key'); if (fk) { self.adapter.onSearch(fk, inp.value||''); self.renderFilter(fk); } });
    bar.addEventListener('change', function(e) { var cb = e.target.closest('.cdaFilterVisibleToggle input'); if (!cb) return; var el = cb.closest('[data-filter-key]'), fk = el && el.getAttribute('data-filter-key'); if (fk) self.visTog(fk, cb.checked); });
    document.addEventListener('click', function(e) { if (!e.target.closest('[data-filter-bar="'+self.key+'"]')) self.closeAll(); });
    document.addEventListener('keydown', function(e) { if (e.key === 'Escape') self.closeAll(); });
    window.addEventListener('resize', function() { if (self.openFilter) self.pos(self.openFilter); }, {passive:true});
  };

  FB.prototype.toggle = function(fk) {
    if (this.openFilter === fk) { this.closeAll(); return; }
    this.closeAll(); this.openFilter = fk;
    var p = this.gP(fk), b = this.gB(fk);
    if (p && b) { p.classList.add('open'); b.setAttribute('aria-expanded','true'); b.classList.add('active'); this.renderFilter(fk); this.pos(fk); var s = p.querySelector('.cdaFilterSearch'); if (s) setTimeout(function(){s.focus();},50); }
  };

  FB.prototype.closeAll = function() {
    this.openFilter = null; var self = this;
    this.el.bar.querySelectorAll('.cdaFilterPanel').forEach(function(p){p.classList.remove('open');});
    this.el.bar.querySelectorAll('.cdaFilterButton').forEach(function(b){ b.setAttribute('aria-expanded','false'); var el = b.closest('[data-filter-key]'), fk = el && el.getAttribute('data-filter-key'); if (fk && self.adapter.getMode(fk)==='ALL') b.classList.remove('active'); });
  };

  FB.prototype.pos = function(fk) {
    var b = this.gB(fk), p = this.gP(fk); if (!b||!p) return;
    var r = b.getBoundingClientRect(), vw = window.innerWidth, vh = window.innerHeight;
    var w = Math.max(280, Math.min(parseInt(p.getAttribute('data-panel-width'))||360, vw-16));
    var pos = p.getAttribute('data-position')||'left';
    var left = pos==='right' ? Math.max(8,Math.min(r.right-w,vw-w-8)) : Math.max(8,Math.min(r.left,vw-w-8));
    var below = vh-r.bottom-8;
    p.style.cssText = 'position:fixed!important;width:'+w+'px!important;left:'+left+'px!important;z-index:10040!important;top:'+(r.bottom+5)+'px!important;max-height:'+Math.max(210,Math.min(430,below))+'px!important;display:block!important';
  };

  FB.prototype.renderFilter = function(fk) {
    var list = this.gL(fk), btn = this.gB(fk), cnt = this.gC(fk), vis = this.gV(fk); if (!list) return;
    var opts = this.adapter.getOptions(fk), mode = this.adapter.getMode(fk), sel = this.adapter.getSelected(fk), term = this.adapter.getSearch(fk);
    var visible = term ? opts.filter(function(o){return fuzzyMatch(o.label+' '+o.key,term);}) : opts;
    var fd = this.filters.find(function(f){return f.key===fk;});
    if (btn) {
      if (mode==='ALL') { btn.textContent = fd?fd.allLabel:'All'; btn.classList.remove('active'); }
      else if (sel.size===0) { btn.textContent = 'None'; btn.classList.add('active'); }
      else if (sel.size===1) { var so = opts.find(function(o){return sel.has(o.key);}); btn.textContent = so?so.label:'1 selected'; btn.classList.add('active'); }
      else { btn.textContent = sel.size+' '+(fd?fd.label.toLowerCase():'items'); btn.classList.add('active'); }
    }
    if (visible.length) {
      list.innerHTML = visible.map(function(o){ var c = mode==='ALL'||sel.has(o.key); return '<div class="cdaFilterRow'+(c?' active':'')+'" data-option-key="'+esc(o.key)+'"><input type="checkbox"'+(c?' checked':'')+' tabindex="-1"><span class="cdaFilterLabel">'+esc(o.label)+'</span><button class="cdaFilterOnly" type="button">Only</button></div>'; }).join('');
    } else { list.innerHTML = '<div class="cdaFilterEmpty">No matching options.</div>'; }
    var cc = visible.filter(function(o){return mode==='ALL'||sel.has(o.key);}).length;
    if (cnt) cnt.textContent = cc+' of '+visible.length+' selected';
    if (vis) { vis.checked = visible.length>0&&cc===visible.length; vis.indeterminate = cc>0&&cc<visible.length; }
  };

  FB.prototype.render = function() { var self = this; this.filters.forEach(function(f){self.renderFilter(f.key);}); };

  // --- Linked inventory: auto-deselect options with zero rows in population ---
  FB.prototype.syncLinked = function(changedKey) {
    if (!this.adapter.getPopulationKeys) return;
    var self = this;
    this.filters.forEach(function(f) {
      if (f.key === changedKey) return;
      var mode = self.adapter.getMode(f.key);
      if (mode === 'ALL') return;
      var popKeys = self.adapter.getPopulationKeys(f.key);
      if (!popKeys) return;
      var sel = self.adapter.getSelected(f.key);
      var newSet = new Set();
      sel.forEach(function(k) { if (popKeys.has(k)) newSet.add(k); });
      if (newSet.size !== sel.size) {
        var allOpts = self.adapter.getOptions(f.key);
        var newMode = newSet.size >= allOpts.length ? 'ALL' : (newSet.size === 0 ? 'ALL' : 'CUSTOM');
        if (newMode === 'ALL') newSet = new Set();
        self.adapter.onSelectionChange(f.key, newSet, newMode);
      }
    });
  };

  FB.prototype.toggleOpt = function(fk, key) {
    var mode = this.adapter.getMode(fk), sel = this.adapter.getSelected(fk), ns = new Set(sel), nm = mode;
    if (mode==='ALL') { var opts = this.adapter.getOptions(fk); ns = new Set(opts.map(function(o){return o.key;})); ns.delete(String(key)); nm = 'CUSTOM'; }
    else { if (ns.has(String(key))) ns.delete(String(key)); else ns.add(String(key)); }
    var all = this.adapter.getOptions(fk); if (ns.size>=all.length){ns=new Set();nm='ALL';}
    this.adapter.onSelectionChange(fk, ns, nm);
    this.syncLinked(fk);
    this.render();
  };

  FB.prototype.exclusive = function(fk, key) {
    var mode = this.adapter.getMode(fk), sel = this.adapter.getSelected(fk);
    if (mode==='CUSTOM'&&sel.size===1&&sel.has(String(key))) this.adapter.onSelectionChange(fk, new Set(), 'ALL');
    else this.adapter.onSelectionChange(fk, new Set([String(key)]), 'CUSTOM');
    this.syncLinked(fk);
    this.closeAll(); this.render();
  };

  FB.prototype.handleAction = function(fk, action) {
    if (action==='reset') this.adapter.onReset(fk);
    else if (action==='clear') this.adapter.onSelectionChange(fk, new Set(), 'CUSTOM');
    else if (action==='selectAll') this.adapter.onSelectionChange(fk, new Set(), 'ALL');
    this.syncLinked(fk);
    this.render();
  };

  FB.prototype.visTog = function(fk, checked) {
    var opts = this.adapter.getOptions(fk), term = this.adapter.getSearch(fk);
    var visible = term ? opts.filter(function(o){return fuzzyMatch(o.label+' '+o.key,term);}) : opts;
    var ns = new Set(this.adapter.getSelected(fk));
    if (this.adapter.getMode(fk)==='ALL') ns = new Set(opts.map(function(o){return o.key;}));
    visible.forEach(function(o){if(checked)ns.add(o.key);else ns.delete(o.key);});
    if (ns.size>=opts.length) this.adapter.onSelectionChange(fk,new Set(),'ALL');
    else this.adapter.onSelectionChange(fk, ns, 'CUSTOM');
    this.syncLinked(fk);
    this.render();
  };

  FB.prototype.getPills = function() {
    var self = this, pills = [];
    this.filters.forEach(function(f) {
      var mode = self.adapter.getMode(f.key); if (mode==='ALL') return;
      var sel = self.adapter.getSelected(f.key), opts = self.adapter.getOptions(f.key);
      var matched = opts.filter(function(o){return sel.has(o.key);});
      var label = matched.length===0?'No '+f.label.toLowerCase():matched.length===1?f.label+': '+matched[0].label:f.label+': '+matched.length+' selected';
      pills.push({label:label,filterKey:f.key});
    });
    return pills;
  };

  FB.prototype.destroy = function() { if (this.el.bar&&this.el.bar.parentNode) this.el.bar.parentNode.removeChild(this.el.bar); this.mounted=false; instances.delete(this.key); };
  FB.prototype.gB = function(fk){return document.getElementById('cdaFBtn_'+this.key+'_'+fk);};
  FB.prototype.gP = function(fk){return document.getElementById('cdaFPanel_'+this.key+'_'+fk);};
  FB.prototype.gL = function(fk){return document.getElementById('cdaFList_'+this.key+'_'+fk);};
  FB.prototype.gC = function(fk){return document.getElementById('cdaFCount_'+this.key+'_'+fk);};
  FB.prototype.gV = function(fk){return document.getElementById('cdaFVis_'+this.key+'_'+fk);};

  window.cdaSharedFilterBar = Object.freeze({
    version: 'v1.1.0',
    create: function(config) {
      if (!config||!config.key) throw new Error('SharedFilterBar: config.key required');
      if (instances.has(config.key)) return instances.get(config.key);
      var inst = new FB(config); inst.config_mountTarget = config.mountTarget;
      instances.set(config.key, inst); inst.mount(); return inst;
    },
    destroy: function(key) { var i = instances.get(key); if (i) i.destroy(); },
    get: function(key) { return instances.get(key)||null; },
    test: function(sel) {
      var data = [
        {dept:'Fixed',product:'EMAXF4PCS',customer:'Bay Area Dental'},
        {dept:'Fixed',product:'EMAXF4PCS',customer:'Peninsula Smiles'},
        {dept:'Fixed',product:'ZIRPRF11PC',customer:'Bay Area Dental'},
        {dept:'Fixed',product:'LZF5PC',customer:'SF Dental Group'},
        {dept:'Implant',product:'LZI5PC',customer:'Bay Area Dental'},
        {dept:'Implant',product:'LZI5PC',customer:'Palo Alto Dentistry'},
        {dept:'Implant',product:'ZIRPRIPC',customer:'Peninsula Smiles'},
        {dept:'Removable',product:'REM-RPD',customer:'SF Dental Group'},
        {dept:'Removable',product:'REM-FRAME',customer:'Bay Area Dental'},
        {dept:'Nightguard',product:'NG-HARD',customer:'Palo Alto Dentistry'}
      ];
      var st = {modes:{},selected:{},searches:{}};
      var fks = ['department','product','customer'];
      fks.forEach(function(k){st.modes[k]='ALL';st.selected[k]=new Set();st.searches[k]='';});

      function popKeys(fKey) {
        var filtered = data.filter(function(row) {
          return fks.every(function(ok) {
            if (ok===fKey) return true;
            if (st.modes[ok]==='ALL') return true;
            var field = ok==='department'?'dept':ok;
            return st.selected[ok].has(row[field]);
          });
        });
        var keys = new Set(), field = fKey==='department'?'dept':fKey;
        filtered.forEach(function(r){keys.add(r[field]);});
        return keys;
      }
      function uniq(field) {
        var s = new Set(); data.forEach(function(r){s.add(r[field]);}); return Array.from(s).sort().map(function(v){return {key:v,label:v};});
      }

      return window.cdaSharedFilterBar.create({
        key:'test', mountTarget:sel||'body',
        filters:[{key:'department',label:'Department',allLabel:'All departments'},{key:'product',label:'Product',allLabel:'All products'},{key:'customer',label:'Customer',allLabel:'All customers',position:'right'}],
        adapter:{
          getOptions:function(fk){return uniq(fk==='department'?'dept':fk);},
          getMode:function(fk){return st.modes[fk]||'ALL';},
          getSelected:function(fk){return st.selected[fk]||new Set();},
          onSelectionChange:function(fk,set,mode){st.selected[fk]=set;st.modes[fk]=mode;var pop=data.filter(function(r){return fks.every(function(k){if(st.modes[k]==='ALL')return true;var f=k==='department'?'dept':k;return st.selected[k].has(r[f]);});});console.log('%c[FilterBar] '+fk+' -> '+mode+(set.size?' ('+Array.from(set).join(', ')+')':'')+' | Population: '+pop.length+' rows','color:#2563eb;font-weight:bold');},
          onReset:function(fk){st.selected[fk]=new Set();st.modes[fk]='ALL';st.searches[fk]='';},
          onResetAll:function(){fks.forEach(function(k){st.modes[k]='ALL';st.selected[k]=new Set();st.searches[k]='';});},
          getSearch:function(fk){return st.searches[fk]||'';},
          onSearch:function(fk,t){st.searches[fk]=t;},
          getPopulationKeys:function(fk){return popKeys(fk);}
        },
        features:{visibleToggle:true}
      });
    }
  });
})();

// Auto-run test on ?filterTest=1
(function() {
  if (window.location.search.indexOf('filterTest=1') >= 0) {
    function tryMount() {
      var target = document.getElementById('remakeFactorPage');
      if (target && window.cdaSharedFilterBar) {
        window.cdaSharedFilterBar.test('#remakeFactorPage');
        console.log('[SharedFilterBar] Auto-test mounted via ?filterTest=1');
      } else {
        setTimeout(tryMount, 500);
      }
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', tryMount);
    else setTimeout(tryMount, 1000);
  }
})();
</script>
