<script>
window.CDA_REMAKE_COMPACT_VERSION = 'v6.385-minimal-saved-views-menu';
(function installRemakeResponsiveV6382(){

  function normalizeValuesV6382(value){
    if (Array.isArray(value)) return value.map(String).filter(Boolean);
    if (value == null || value === '') return [];
    try {
      const parsed = JSON.parse(String(value));
      if (Array.isArray(parsed)) return parsed.map(String).filter(Boolean);
    } catch (error) {}
    return [String(value)];
  }

  function readJsonV6382(key, fallback){
    try {
      const raw = window.localStorage ? localStorage.getItem(key) : '';
      return raw ? JSON.parse(raw) : fallback;
    } catch (error) {
      return fallback;
    }
  }

  function writeJsonV6382(key, value){
    try {
      if (window.localStorage) localStorage.setItem(key, JSON.stringify(value));
    } catch (error) {}
  }

  function emptyViewStateV6382(){
    return { version:1, openDefaultId:'', resetDefaultId:'', views:[] };
  }

  function readViewStateV6382(){
    const raw = readJsonV6382(VIEW_STORAGE_KEY_V6382, emptyViewStateV6382());
    const next = raw && typeof raw === 'object' ? raw : emptyViewStateV6382();
    next.version = 1;
    next.openDefaultId = String(next.openDefaultId || '');
    next.resetDefaultId = String(next.resetDefaultId || '');
    next.views = Array.isArray(next.views) ? next.views.filter(function(view){ return view && view.id && view.snapshot; }).map(function(view){
      return {
        id:String(view.id),
        name:String(view.name || 'Saved view'),
        snapshot:{ filters:Object.assign({}, view.snapshot.filters || {}), exclusions:Object.assign({}, view.snapshot.exclusions || {}) },
        createdAt:String(view.createdAt || ''),
        updatedAt:String(view.updatedAt || '')

    }) : [];
    const validIds = new Set(next.views.map(function(view){ return view.id; }));
    if (!validIds.has(next.openDefaultId)) next.openDefaultId = '';
    if (!validIds.has(next.resetDefaultId)) next.resetDefaultId = '';
    return next;
  }

  function writeViewStateV6382(state){
    writeJsonV6382(VIEW_STORAGE_KEY_V6382, state || emptyViewStateV6382());
  }

  function currentSnapshotV6382(){
    const stored = readJsonV6382(FILTER_STORAGE_KEY_V6382, {});
    const filters = {};
    Object.keys(FILTER_INPUTS_V6382).forEach(function(kind){
      const input = idV6382(FILTER_INPUTS_V6382[kind]);
      const source = input ? input.value : stored[kind];
      filters[kind] = normalizeValuesV6382(source);
    });
    const storedExclusions = readJsonV6382(FILTER_EXCLUSIONS_STORAGE_KEY_V6389, {});
    const exclusions = {};
    Object.keys(FILTER_INPUTS_V6382).forEach(function(kind){ exclusions[kind] = normalizeValuesV6382(storedExclusions[kind]); });
    return { filters:filters, exclusions:exclusions };
  }

  function controlsReadyV6382(){
    return Object.keys(FILTER_INPUTS_V6382).every(function(kind){ return !!idV6382(FILTER_INPUTS_V6382[kind]); });
  }

  function setInlineStatusV6382(message, isError){

  function applySnapshotV6382(snapshot, message){

    const normalized = {};
    Object.keys(FILTER_INPUTS_V6382).forEach(function(kind){
      normalized[kind] = normalizeValuesV6382(snapshot.filters[kind]);
    });
    const normalizedExclusions = {};
    Object.keys(FILTER_INPUTS_V6382).forEach(function(kind){ normalizedExclusions[kind] = normalizeValuesV6382(snapshot.exclusions && snapshot.exclusions[kind]); });
    writeJsonV6382(FILTER_STORAGE_KEY_V6382, normalized);
    writeJsonV6382(FILTER_EXCLUSIONS_STORAGE_KEY_V6389, normalizedExclusions);
    if (!controlsReadyV6382()) return false;
    Object.keys(FILTER_INPUTS_V6382).forEach(function(kind){
      const input = idV6382(FILTER_INPUTS_V6382[kind]);
      if (input) input.value = JSON.stringify(normalized[kind]);
    });
    if (typeof window.applyRemakeFilterSnapshotV6389 === 'function') {
      window.applyRemakeFilterSnapshotV6389(normalized, normalizedExclusions);
    } else if (typeof window.applyRemakeFactorFilters === 'function') {
      window.applyRemakeFactorFilters();

      Object.keys(FILTER_INPUTS_V6382).forEach(function(kind){
        const input = idV6382(FILTER_INPUTS_V6382[kind]);

  }

  function applyViewByIdV6382(id, message){
    const view = viewByIdV6382(id);
    return !!(view && applySnapshotV6382(view.snapshot, message || ('Applied ' + view.name)));
  }

  function uniqueIdV6382(){
    return 'view-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,7);
  }

  function saveCurrentViewV6382(){
    const input = idV6382('remakeNewViewNameV6382');
    const name = String(input ? input.value : '').replace(/\s+/g,' ').trim();
    if (!name) {
      setInlineStatusV6382('Enter a view name in the dropdown.', true);
      if (input) input.focus();
      return;

    const state = readViewStateV6382();
    const existing = state.views.find(function(view){ return view.name.toLowerCase() === name.toLowerCase(); });
    const now = new Date().toISOString();
    const statusMessage = existing ? ('Updated ' + name + '.') : ('Saved ' + name + '.');
    if (existing) {
      existing.snapshot = currentSnapshotV6382();
      existing.updatedAt = now;
      existing.name = name;
    } else {
      state.views.push({ id:uniqueIdV6382(), name:name, snapshot:currentSnapshotV6382(), createdAt:now, updatedAt:now });
    }
    writeViewStateV6382(state);
    renderViewsPanelV6382();
    setInlineStatusV6382(statusMessage, false);
    const nextInput = idV6382('remakeNewViewNameV6382');
    if (nextInput) { nextInput.value = ''; nextInput.focus(); }
  }

  function renameViewV6382(id, nextName, input){
    const clean = String(nextName || '').replace(/\s+/g,' ').trim();
    const state = readViewStateV6382();
    const view = state.views.find(function(item){ return item.id === id; });
    if (!view) return;
    if (!clean) {
      if (input) input.value = view.name;
      setInlineStatusV6382('A saved view needs a name.', true);
      return;
    }
    const duplicate = state.views.some(function(item){ return item.id !== id && item.name.toLowerCase() === clean.toLowerCase(); });
    if (duplicate) {
      if (input) input.value = view.name;
      setInlineStatusV6382('That view name is already in use.', true);
      return;
    }
    view.name = clean;
    view.updatedAt = new Date().toISOString();
    writeViewStateV6382(state);
    renderViewsPanelV6382();
    setInlineStatusV6382('Renamed view.', false);
  }

  function updateViewV6382(id){
    const state = readViewStateV6382();
    const view = state.views.find(function(item){ return item.id === id; });
    if (!view) return;
    view.snapshot = currentSnapshotV6382();
    view.updatedAt = new Date().toISOString();
    writeViewStateV6382(state);
    renderViewsPanelV6382();
    setInlineStatusV6382('Updated ' + view.name + '.', false);
  }

  function deleteViewV6382(id){
    const state = readViewStateV6382();
    const view = state.views.find(function(item){ return item.id === id; });
    state.views = state.views.filter(function(item){ return item.id !== id; });
    if (state.openDefaultId === id) state.openDefaultId = '';
    if (state.resetDefaultId === id) state.resetDefaultId = '';
    writeViewStateV6382(state);
    renderViewsPanelV6382();
    setInlineStatusV6382(view ? ('Deleted ' + view.name + '.') : 'Deleted view.', false);
  }

    const state = readViewStateV6382();
    const value = String(id || '');

    if (kind === 'reset') state.resetDefaultId = value;

    renderViewsPanelV6382();
    setInlineStatusV6382(kind === 'open' ? 'Open default updated.' : 'Reset default updated.', false);

  function optionMarkupV6382(views, selectedId, emptyLabel){
    let html = '<option value="">' + escapeHtmlV6382(emptyLabel) + '</option>';

    return html;
  }

  function renderViewsPanelV6382(){

    if (!panel) return;
    const state = readViewStateV6382();

          '<button class="remakeViewUtilityV6382" type="button" data-view-action="historical">Rebuild cache</button>' +
        '</div>' +
        '<div id="remakeViewStatusV6382" class="remakeViewStatusV6382" aria-live="polite"></div>' +
      '</div>';

  function ensureViewsPanelV6382(){
    let panel = idV6382('remakeViewsPanelV6382');
    if (panel) return panel;
    panel = document.createElement('div');
    panel.id = 'remakeViewsPanelV6382';
    panel.setAttribute('role','dialog');
    panel.setAttribute('aria-label','Saved views');
    document.body.appendChild(panel);

    panel.addEventListener('click', function(event){
      const actionButton = event.target.closest('[data-view-action]');
      if (event.target.closest('#remakeViewsCloseV6382')) {
        closeViewsV6382();
        return;
      }
      if (event.target.closest('#remakeSaveCurrentViewV6382')) {
        saveCurrentViewV6382();
        return;

      if (!actionButton) return;
      const action = actionButton.getAttribute('data-view-action');
      const id = actionButton.getAttribute('data-view-id') || '';
      if (action === 'apply') {
        const view = viewByIdV6382(id);
        if (view) applySnapshotV6382(view.snapshot, 'Applied ' + view.name + '.');
      } else if (action === 'update') {

        return;

        event.preventDefault();
        saveCurrentViewV6382();
      }
      if (event.key === 'Enter' && event.target && event.target.matches('[data-view-name]')) {
        event.preventDefault();
        event.target.blur();
      }
    });
    return panel;
  }

    const rect = source && source.getBoundingClientRect ? source.getBoundingClientRect() : { right:window.innerWidth - 12, bottom:52 };
    const width = Math.min(430, window.innerWidth - 16);
    let left = rect.right - width;
    left = Math.max(8, Math.min(left, window.innerWidth - width - 8));
    panel.style.left = left + 'px';
    panel.style.right = 'auto';
    panel.style.top = Math.min(window.innerHeight - 90, rect.bottom + 6) + 'px';
    panel.style.width = width + 'px';
  }

  function clearAllNowV6382(){

      const fn = originalClearFilterV6382 || window.clearRemakeFilterV6230;
      if (typeof fn === 'function') fn.call(window, 'all');

  window.clearRemakeAllNowV6681 = clearAllNowV6382;

  function installResetDefaultV6382(){
    const current = window.clearRemakeFilterV6230;
    if (typeof current !== 'function' || current.__v6382ResetDefault) return;
    originalClearFilterV6382 = current;
    const wrapped = function clearRemakeFilterWithResetDefaultV6382(kind){
      if (String(kind || '') === 'all' && !bypassResetDefaultV6382) {
        const state = readViewStateV6382();
        const view = state.views.find(function(item){ return item.id === state.resetDefaultId; });
        if (view) {

          if (applySnapshotV6382(view.snapshot, 'Reset to ' + view.name + '.')) return;
        }
      }
      return current.apply(this, arguments);
    };
