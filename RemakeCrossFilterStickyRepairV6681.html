<!-- RemakeCrossFilterStickyRepairV6681.html
Version: v6.681 repair
Purpose: Preserve visible click cross-filter state as removable pills, keep source rows highlighted after rerenders, and keep the Remake KPI/filter area sticky.
-->
<style id="cdaRemakeCrossFilterStickyRepairStylesV6681">
  #remakeFactorPage.cleanRemakeV6230 .remakeStickyTopV6245 {
    position: sticky !important;
    top: 34px !important;
    z-index: 90 !important;
    background: #f6f8fb !important;
    isolation: isolate !important;
  }

  #remakeFactorPage.cleanRemakeV6230 .remakeKpis,
  #remakeFactorPage.cleanRemakeV6230 .remakeKpisV6230,
  #remakeFactorPage.cleanRemakeV6230 .remakePillsV6230,
  #cdaRemakeCrossFilterPillsV6681 {
    position: relative !important;
    z-index: 91 !important;
  }

  #cdaRemakeCrossFilterPillsV6681 {
    display: flex !important;
    align-items: center !important;
    flex-wrap: wrap !important;
    gap: 6px !important;
    min-height: 0 !important;
    margin: 4px 0 2px !important;
    padding: 0 !important;
    background: transparent !important;
  }

  #cdaRemakeCrossFilterPillsV6681:empty {
    display: none !important;
  }

  .cdaRemakeCrossFilterPillV6681 {
    display: inline-flex !important;
    align-items: center !important;
    gap: 6px !important;
    min-height: 24px !important;
    max-width: min(360px, 48vw) !important;
    padding: 3px 8px 3px 10px !important;
    border: 1px solid #efc84a !important;
    border-radius: 999px !important;
    background: #fff4b8 !important;
    color: #664300 !important;
    box-shadow: 0 1px 2px rgba(116,83,0,.12) !important;
    font: 800 10px/1.15 Roboto,Arial,sans-serif !important;
  }

  .cdaRemakeCrossFilterPillV6681 .cdaCrossFilterPillTextV6681 {
    min-width: 0 !important;
    overflow: hidden !important;
    text-overflow: ellipsis !important;
    white-space: nowrap !important;
  }

  .cdaRemakeCrossFilterPillV6681 button {
    width: 18px !important;
    height: 18px !important;
    min-width: 18px !important;
    padding: 0 !important;
    border: 0 !important;
    border-radius: 50% !important;
    background: transparent !important;
    color: #7a4a00 !important;
    font: 900 14px/18px Arial,sans-serif !important;

  #remakeFactorPage.cleanRemakeV6230 table tbody tr.cdaCrossFilterSelectedV6681 > td {

  #remakeFactorPage.cleanRemakeV6230 table tbody tr.cdaCrossFilterSelectedV6681 > td:first-child {

  @media (max-width: 980px) {
    #remakeFactorPage.cleanRemakeV6230 .remakeStickyTopV6245 {

      max-width: 82vw !important;
    }
  }
</style>

<script id="cdaRemakeCrossFilterStickyRepairControllerV6681">
(function installRemakeCrossFilterStickyRepairV6681(){
  'use strict';
  if (window.__cdaRemakeCrossFilterStickyRepairV6681) return;
  window.__cdaRemakeCrossFilterStickyRepairV6681 = true;

  const STORAGE_KEY = 'cdaRemakeClickCrossFilters.v6681';
  const SELECTED_CLASS = 'cdaCrossFilterSelectedV6681';
  const PILL_HOST_ID = 'cdaRemakeCrossFilterPillsV6681';
  let suppressClick = false;
  let renderFrame = 0;

  function clean(value){
    return String(value == null ? '' : value).replace(/\s+/g,' ').trim();
  }

  function readState(){
    try {
      const parsed = JSON.parse(sessionStorage.getItem(STORAGE_KEY) || '[]');
      return Array.isArray(parsed) ? parsed.filter(function(item){
        return item && item.source && item.label;
      }) : [];
    } catch (error) {
      return [];
    }
  }

  function writeState(items){
    try { sessionStorage.setItem(STORAGE_KEY, JSON.stringify(items || [])); }
    catch (error) {}
  }

  function rowLabel(row){
    if (!row) return '';
    const cell = row.querySelector('td');
    return clean(cell && cell.textContent);
  }

  function cardTitle(row){
    const card = row && row.closest && row.closest('.remakeCard,.ceramistPanelV6343,[data-cda-dashboard-card]');
    const title = card && card.querySelector &&
      card.querySelector('.remakeCardTitle,.ceramistPanelTitleV6343,.chartTitle,[data-cda-dashboard-title]');
    return clean(title && title.textContent) || clean(row && row.closest('table') && row.closest('table').id) || 'Selection';
  }

  function sourceKey(row){
    const table = row && row.closest && row.closest('table');
    return clean(table && table.id) || cardTitle(row);
  }

  function eligibleRow(row){
    if (!row || !row.closest('#remakeFactorPage')) return false;
    if (row.closest('#remakeCeramistDetailTableV6343')) return false;
    if (row.classList.contains('ceramistSectionRowV6348')) return false;
    if (!row.querySelector('td')) return false;
    const label = rowLabel(row);
    if (!label || /^no\s+/i.test(label)) return false;
    const title = cardTitle(row);
    const table = row.closest('table');
    const id = clean(table && table.id);
    return /product|group|department|customer|reason|technician|ceramist|worker/i.test(title + ' ' + id);
  }

  function ensureHost(){
    let host = document.getElementById(PILL_HOST_ID);
    if (host && host.isConnected) return host;
    const sticky = document.querySelector('#remakeFactorPage .remakeStickyTopV6245');
    if (!sticky) return null;

    host = document.createElement('div');
    host.id = PILL_HOST_ID;
    host.setAttribute('aria-label','Active click cross filters');

    const existingPills = sticky.querySelector('.remakePillsV6230');
    if (existingPills && existingPills.parentNode) {
      existingPills.parentNode.insertBefore(host, existingPills.nextSibling);
    } else {
      sticky.appendChild(host);
    }
    return host;
  }

  function findMatchingRow(item){
    const tables = Array.from(document.querySelectorAll('#remakeFactorPage table'));
    const exact = tables.find(function(table){ return clean(table.id) === item.source; });
    const candidates = exact ? [exact] : tables;
    for (let i = 0; i < candidates.length; i += 1) {
      const rows = Array.from(candidates[i].querySelectorAll('tbody tr'));
      const match = rows.find(function(row){ return rowLabel(row) === item.label; });
      if (match) return match;
    }
    return null;
  }

  function applyHighlights(){
    document.querySelectorAll('#remakeFactorPage table tbody tr.' + SELECTED_CLASS).forEach(function(row){
      row.classList.remove(SELECTED_CLASS);
      row.removeAttribute('aria-selected');
    });
    readState().forEach(function(item){
      const row = findMatchingRow(item);
      if (!row) return;
      row.classList.add(SELECTED_CLASS);
      row.setAttribute('aria-selected','true');
    });
  }

  function removeItem(item){
    const items = readState().filter(function(current){
      return !(current.source === item.source && current.label === item.label);
    });
    writeState(items);

    const row = findMatchingRow(item);
    if (row && typeof row.click === 'function') {
      suppressClick = true;
      try { row.click(); } catch (error) {}
      window.setTimeout(function(){ suppressClick = false; scheduleRender(); }, 0);
    } else {
      scheduleRender();
    }
  }

  function renderPills(){
    renderFrame = 0;
    const host = ensureHost();
    if (!host) return;

    const items = readState();
    host.textContent = '';

    items.forEach(function(item){
      const pill = document.createElement('span');
      pill.className = 'cdaRemakeCrossFilterPillV6681';

      const text = document.createElement('span');
      text.className = 'cdaCrossFilterPillTextV6681';
      text.textContent = item.title + ': ' + item.label;
      text.title = text.textContent;

      const close = document.createElement('button');
      close.type = 'button';
      close.setAttribute('aria-label','Remove ' + text.textContent);
      close.title = 'Remove filter';
      close.textContent = 'x';
      close.addEventListener('click', function(event){
        event.preventDefault();
        event.stopPropagation();
        removeItem(item);
      });

      pill.appendChild(text);
      pill.appendChild(close);
      host.appendChild(pill);
    });

    applyHighlights();
  }

  function scheduleRender(){
    if (renderFrame) return;
    renderFrame = window.requestAnimationFrame(renderPills);
  }

  function rememberRow(row,event){
    const item = {
      source: sourceKey(row),
      title: cardTitle(row),
      label: rowLabel(row)
    };

    let items = readState();
    const index = items.findIndex(function(current){
      return current.source === item.source && current.label === item.label;
    });

    if (index >= 0) {
      items.splice(index,1);
    } else {
      if (!(event && (event.ctrlKey || event.metaKey))) {
        items = items.filter(function(current){ return current.source !== item.source; });
      }
      items.push(item);
    }

    writeState(items);
    window.setTimeout(scheduleRender, 0);
  }

  document.addEventListener('click', function(event){
    if (suppressClick) return;
    if (!event.target || !event.target.closest) return;
    if (event.target.closest('#' + PILL_HOST_ID)) return;

    const row = event.target.closest('#remakeFactorPage table tbody tr');
    if (!eligibleRow(row)) return;
    rememberRow(row,event);
  }, false);

  const observer = new MutationObserver(function(mutations){
    const relevant = mutations.some(function(mutation){
      if (mutation.type !== 'childList') return false;
      return Array.from(mutation.addedNodes || []).concat(Array.from(mutation.removedNodes || [])).some(function(node){
        if (!node || node.nodeType !== 1) return false;
        return node.matches && (
          node.matches('#remakeFactorPage table, #remakeFactorPage tbody, #remakeFactorPage tr, .remakeStickyTopV6245') ||
          (node.querySelector && node.querySelector('#remakeFactorPage table, .remakeStickyTopV6245'))
        );
      });
    });
    if (relevant) scheduleRender();
  });

  function start(){
    const page = document.getElementById('remakeFactorPage');
    if (page) observer.observe(page,{childList:true,subtree:true});
    scheduleRender();
  }

  window.addEventListener('resize',scheduleRender,{passive:true});
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded',start,{once:true});
  else start();

  window.CDA_REMAKE_CROSS_FILTER_STICKY_REPAIR_VERSION = 'v6.681-repair-1';
})();
</script>
