<script id="cdaRemakeCrossFilterStickyRepairControllerV6681">
(function installRemakeCrossFilterStickyRepairV6681(){
  'use strict';

  const VERSION = 'v6.681-repair-2';
  const STORAGE_KEY = 'cdaRemakeClickCrossFilters.v6681';
  const SELECTED_CLASS = 'cdaCrossFilterSelectedV6681';
  const PILL_CLASS = 'cdaRemakeCrossFilterPillV6681';
  const KINDS = ['months','reason','department','product','productGroup','customer'];
  const LABELS = {
    months:'Month',
    reason:'Reason',
    department:'Department',
    product:'Product',
    productGroup:'Group',
    customer:'Customer',
    ceramist:'Technician'
  };

  let renderFrame = 0;
  let suppressClick = false;
  let shellObserver = null;

  function clean(value){
    return String(value == null ? '' : value).replace(/\s+/g,' ').trim();
  }

  function page(){
    return document.getElementById('remakeFactorPage');
  }

  function sticky(){
    const root = page();
    return root && root.querySelector('.remakeShellV6230 > .remakeStickyTopV6245');
  }

  function rail(){
    return document.getElementById('remakePillsV6230');
  }

  function placeNativePillRailInsideSticky(){
    const target = sticky();
    const pills = rail();
    if (!target || !pills) return false;

    if (pills.parentNode !== target) target.appendChild(pills);
    pills.setAttribute('data-placement','inside-sticky-below-kpis-v6681');
    return true;
  }

  function readFallbackState(){
    try {
      const parsed = JSON.parse(sessionStorage.getItem(STORAGE_KEY) || '[]');
      return Array.isArray(parsed) ? parsed.filter(function(item){
        return item && item.source && item.label;
      }) : [];
    } catch (error) {
      return [];
    }
  }

  function writeFallbackState(items){
    try { sessionStorage.setItem(STORAGE_KEY, JSON.stringify(items || [])); }
    catch (error) {}
  }

  function crossValues(kind){
    try {
      if (typeof crossFilterValuesV6634 === 'function') {
        const values = crossFilterValuesV6634(kind);
        return Array.isArray(values) ? values.map(String).filter(Boolean) : [];
      }
    } catch (error) {}
    try {
      if (typeof window.crossFilterValuesV6634 === 'function') {
        const values = window.crossFilterValuesV6634(kind);
        return Array.isArray(values) ? values.map(String).filter(Boolean) : [];
      }
    } catch (error) {}
    return [];
  }

  function rowLabel(row){
    const cell = row && row.querySelector && row.querySelector('td');
    return clean(cell && cell.textContent);
  }

  function cardTitle(row){
    const card = row && row.closest && row.closest('.remakeCard,.ceramistPanelV6343,[data-cda-dashboard-card]');
    const title = card && card.querySelector &&
      card.querySelector('.remakeCardTitle,.ceramistPanelTitleV6343,.chartTitle,[data-cda-dashboard-title]');
    return clean(title && title.textContent) || clean(row && row.closest('table') && row.closest('table').id) || 'Selection';
  }

  function sourceKey(row){
    const table = row && row.closest && row.closest('table');
    return clean(table && table.id) || cardTitle(row);
  }

  function kindFromRow(row){
    const table = row && row.closest && row.closest('table');
    const id = clean(table && table.id);

    if (id === 'remakeReasonTable') return 'reason';
    if (id === 'remakeDepartmentTable') return 'department';
    if (id === 'remakeCustomerTable') return 'customer';
    if (id === 'remakeProductTable') {
      const group = document.getElementById('remakeProductModeGroupBtnV6264');
      return group && group.classList.contains('active') ? 'productGroup' : 'product';
    }
    if (id === 'remakeCeramistTableV6342') return 'ceramist';
    if (id === 'remakeCeramistDetailTableV6343') {
      const active = document.querySelector(
        '#remakeCeramistCardV6342 .active, #remakeCeramistCardV6342 [aria-pressed="true"]'
      );
      const text = clean(active && active.textContent).toLowerCase();
      if (text.indexOf('group') >= 0) return 'productGroup';
      if (text.indexOf('dept') >= 0) return 'department';
      if (text.indexOf('customer') >= 0) return 'customer';
      if (text.indexOf('reason') >= 0) return 'reason';
      return 'product';
    }
    return '';
  }

  function eligibleRow(row){
    if (!row || !row.closest('#remakeFactorPage')) return false;
    if (row.classList.contains('ceramistSectionRowV6348')) return false;
    if (!row.querySelector('td')) return false;
    const label = rowLabel(row);
    if (!label || /^no\s+/i.test(label)) return false;
    return !!kindFromRow(row);
  }

  function selectedLabelsForKind(kind){
    let selectors = [];
    if (kind === 'reason') selectors = ['#remakeReasonTable tbody tr.selectedV6230'];
    if (kind === 'department') selectors = ['#remakeDepartmentTable tbody tr.selectedV6230'];
    if (kind === 'customer') selectors = ['#remakeCustomerTable tbody tr.selectedV6230'];
    if (kind === 'product' || kind === 'productGroup') selectors = ['#remakeProductTable tbody tr.selectedV6230'];
    if (kind === 'ceramist') selectors = ['#remakeCeramistTableV6342 tbody tr.ceramistSelectedV6343'];

    const labels = [];
    selectors.forEach(function(selector){
      document.querySelectorAll(selector).forEach(function(row){
        const label = rowLabel(row);
        if (label && labels.indexOf(label) < 0) labels.push(label);
      });
    });
    return labels;
  }

  function friendlyValues(kind, values){
    const selectedLabels = selectedLabelsForKind(kind);
    if (selectedLabels.length) return selectedLabels;
    return (values || []).map(clean).filter(Boolean);
  }

  function nativePillAlreadyShows(label){
    const pills = rail();
    if (!pills) return false;
    const prefix = label.toLowerCase() + ':';
    return Array.from(pills.children).some(function(node){
      if (node.classList && node.classList.contains(PILL_CLASS)) return false;
      return clean(node.textContent).toLowerCase().indexOf(prefix) === 0;
    });
  }

  function clearKind(kind){
    if (kind === 'ceramist') {
      try {
        if (typeof selectCeramistV6343 === 'function') selectCeramistV6343('');
        else if (typeof window.selectCeramistV6343 === 'function') window.selectCeramistV6343('');
      } catch (error) {}
      scheduleRender();
      return;
    }

    try {
      if (typeof clearRemakeFilterV6230 === 'function') clearRemakeFilterV6230(kind);
      else if (typeof window.clearRemakeFilterV6230 === 'function') window.clearRemakeFilterV6230(kind);
    } catch (error) {}
    scheduleRender();
  }

  function findMatchingRow(item){
    const tables = Array.from(document.querySelectorAll('#remakeFactorPage table'));
    const exact = tables.find(function(table){ return clean(table.id) === item.source; });
    const candidates = exact ? [exact] : tables;

    for (let i = 0; i < candidates.length; i += 1) {
      const rows = Array.from(candidates[i].querySelectorAll('tbody tr'));
      const match = rows.find(function(row){ return rowLabel(row) === item.label; });
      if (match) return match;
    }
    return null;
  }

  function clearFallbackItem(item){
    const next = readFallbackState().filter(function(current){
      return !(current.source === item.source && current.label === item.label);
    });
    writeFallbackState(next);

    const row = findMatchingRow(item);
    if (row && typeof row.click === 'function') {
      suppressClick = true;
      try { row.click(); } catch (error) {}
      window.setTimeout(function(){
        suppressClick = false;
        scheduleRender();
      },0);
    } else {
      scheduleRender();
    }
  }

  function createPill(labelText, removeAction){
    const pill = document.createElement('span');
    pill.className = PILL_CLASS;

    const text = document.createElement('span');
    text.className = 'cdaCrossFilterPillTextV6681';
    text.textContent = labelText;
    text.title = labelText;

    const close = document.createElement('button');
    close.type = 'button';
    close.textContent = 'x';
    close.title = 'Remove filter';
    close.setAttribute('aria-label','Remove ' + labelText);
    close.addEventListener('click',function(event){
      event.preventDefault();
      event.stopPropagation();
      removeAction();
    });

    pill.appendChild(text);
    pill.appendChild(close);
    return pill;
  }

  function renderNativeCrossFilterPills(){
    const pills = rail();
    if (!pills) return;

    pills.querySelectorAll('.' + PILL_CLASS).forEach(function(node){ node.remove(); });

    KINDS.forEach(function(kind){
      const values = crossValues(kind);
      if (!values.length) return;

      const label = LABELS[kind] || kind;
      if (nativePillAlreadyShows(label)) return;

      const friendly = friendlyValues(kind,values);
      const text = label + ': ' + friendly.join(', ');
      pills.appendChild(createPill(text,function(){ clearKind(kind); }));
    });

    const ceramistLabels = selectedLabelsForKind('ceramist');
    if (ceramistLabels.length && !nativePillAlreadyShows(LABELS.ceramist)) {
      pills.appendChild(createPill(
        LABELS.ceramist + ': ' + ceramistLabels.join(', '),
        function(){ clearKind('ceramist'); }
      ));
    }

    readFallbackState().forEach(function(item){
      const kind = item.kind || '';
      if (kind && crossValues(kind).length) return;

      const text = (LABELS[kind] || item.title || 'Selection') + ': ' + item.label;
      const duplicate = Array.from(pills.querySelectorAll('.' + PILL_CLASS)).some(function(node){
        return clean(node.textContent).replace(/\s*x$/i,'') === text;
      });
      if (!duplicate) pills.appendChild(createPill(text,function(){ clearFallbackItem(item); }));
    });
  }

  function applyCrossTableHighlights(){
    document.querySelectorAll('#remakeFactorPage table tbody tr.' + SELECTED_CLASS).forEach(function(row){
      row.classList.remove(SELECTED_CLASS);
      row.removeAttribute('data-cda-cross-highlight-v6681');
    });

    const activeLabels = [];
    ['reason','department','product','productGroup','customer'].forEach(function(kind){
      const values = crossValues(kind);
      const labels = friendlyValues(kind,values);
      labels.forEach(function(label){
        if (label && activeLabels.indexOf(label) < 0) activeLabels.push(label);
      });
    });

    readFallbackState().forEach(function(item){
      if (item.label && activeLabels.indexOf(item.label) < 0) activeLabels.push(item.label);
    });

    if (!activeLabels.length) return;
    const active = new Set(activeLabels.map(clean));

    document.querySelectorAll('#remakeFactorPage table tbody tr').forEach(function(row){
      if (!row.querySelector('td') || row.classList.contains('ceramistSectionRowV6348')) return;
      if (active.has(rowLabel(row))) {
        row.classList.add(SELECTED_CLASS);
        row.setAttribute('data-cda-cross-highlight-v6681','true');
      }
    });
  }

  function rememberFallbackRow(row,event){
    const kind = kindFromRow(row);
    const item = {
      source: sourceKey(row),
      kind: kind,
      title: LABELS[kind] || cardTitle(row),
      label: rowLabel(row)
    };

    let items = readFallbackState();
    const index = items.findIndex(function(current){
      return current.source === item.source && current.label === item.label;
    });

    if (index >= 0) {
      items.splice(index,1);
    } else {
      if (!(event && (event.ctrlKey || event.metaKey))) {
        items = items.filter(function(current){ return current.source !== item.source; });
      }
      items.push(item);
    }
    writeFallbackState(items);
  }

  function renderAll(){
    renderFrame = 0;
    placeNativePillRailInsideSticky();
    renderNativeCrossFilterPills();
    applyCrossTableHighlights();
  }

  function scheduleRender(){
    if (renderFrame) return;
    renderFrame = window.requestAnimationFrame(renderAll);
  }

  function installFinalPlacementObserver(){
    const root = page();
    const shell = root && root.querySelector('.remakeShellV6230');
    if (!shell || shellObserver) return;

    shellObserver = new MutationObserver(function(){
      scheduleRender();
    });
    shellObserver.observe(shell,{childList:true,subtree:false});
  }

  document.addEventListener('click',function(event){
    if (!event.target || !event.target.closest) return;

    const root = event.target.closest('#remakeFactorPage');
    if (!root) return;

    if (!suppressClick) {
      const row = event.target.closest('table tbody tr');
      if (eligibleRow(row)) rememberFallbackRow(row,event);
    }

    window.setTimeout(scheduleRender,0);
  },false);

  document.addEventListener('change',function(event){
    if (event.target && event.target.closest && event.target.closest('#remakeFactorPage')) {
      window.setTimeout(scheduleRender,0);
    }
  },false);

  window.addEventListener('scroll',function(){
    placeNativePillRailInsideSticky();
  },{passive:true});

  window.addEventListener('resize',scheduleRender,{passive:true});

  function start(){
    installFinalPlacementObserver();
    renderAll();
    window.setTimeout(renderAll,80);
    window.setTimeout(renderAll,300);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded',start,{once:true});
  else start();

  window.__cdaRemakeCrossFilterStickyRepairV6681 = true;
  window.CDA_REMAKE_CROSS_FILTER_STICKY_REPAIR_VERSION = VERSION;
})();
</script>
