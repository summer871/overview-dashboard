  function normalizeKind(kind){

  function mark(kind,source){
    const normalized=normalizeKind(kind);
    if(FILTER_KINDS.indexOf(normalized)<0)return;
    sourceByKind[normalized]=source;
  }

  function markSnapshot(filters,exclusions){
    FILTER_KINDS.forEach(function(kind){
      const selected=filters&&Array.isArray(filters[kind])?filters[kind]:[];
      const excluded=exclusions&&Array.isArray(exclusions[kind])?exclusions[kind]:[];
      if(selected.length||excluded.length)sourceByKind[kind]='dropdown';

    FILTER_KINDS.forEach(function(kind){
      if(next[kind]===false&&sourceByKind[kind]==='dropdown'&&active(kind))next[kind]=true;

    const previous=window[name];

    wrapped.__cdaPreviousV6632=previous;

    if(typeof previous!=='function'||previous.__cdaFilterSourceV6632)return;

    if(!rowsForBaseFiltersV6252.__cdaHardDropdownV6632){
      const previousBase=rowsForBaseFiltersV6252;

      wrappedBase.__cdaHardDropdownV6632=true;
