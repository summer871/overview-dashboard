<script id="cdaTatDashboardBindingsControllerV6547">
(function installTatDashboardBindingsV6547(){
  'use strict';

  if (window.cdaTatDashboardBindingsV6547 &&
      window.cdaTatDashboardBindingsV6547.version === 'v6.555') return;

  function apply(){
    if (window.cdaDashboardTitleToggleV6555) {
      window.cdaDashboardTitleToggleV6555.syncAll('tat');
    }
  }

  document.addEventListener('cdaDashboardTabRenderedV6547',function(event){
    if (event && event.detail && event.detail.tabKey === 'tat') apply();
  });

  document.addEventListener('click',function(event){
    const button = event.target && event.target.closest
      ? event.target.closest('#tatDashboardPageV6509 [data-cda-dashboard-title-toggle="true"]')
      : null;
    if (button) window.setTimeout(apply,0);
  },true);

  window.cdaTatDashboardBindingsV6547 = Object.freeze({
    version:'v6.555',
    apply:apply
  });
})();
</script>
