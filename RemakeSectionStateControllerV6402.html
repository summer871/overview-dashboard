<script>

    try {

    } catch (error) {}
    try { candidates.push(document.referrer); } catch (error) {}
    try { candidates.push(window.location.href); } catch (error) {}

    for (let index = 0; index < candidates.length; index += 1) {
      const candidate = String(candidates[index] || '').trim();
      if (!candidate) continue;
      try {
        const url = new URL(candidate, window.location.href);
        if (/^https:\/\/script\.google\.com$/i.test(url.origin) && /\/macros\/s\/.+\/(?:exec|dev)\/?$/i.test(url.pathname)) return url;
      } catch (error) {}
    }
    return null;
