name: Index override analysis

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Check out analysis branch
        uses: actions/checkout@v4
        with:
          ref: refactor/flatten-index
          fetch-depth: 0

      - name: Analyze CSS overrides
        run: node .github/scripts/analyze-index-overrides.cjs

      - name: Commit analysis report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add INDEX_OVERRIDE_ANALYSIS.md
          git diff --cached --quiet && exit 0
          git commit -m "Map repeated CSS selectors and override candidates"
          git push origin HEAD:refactor/flatten-index
