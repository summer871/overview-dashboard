name: CSS selector dependency map

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Check out analysis branch
        uses: actions/checkout@v4
        with:
          ref: refactor/flatten-index
          fetch-depth: 0

      - name: Build selector dependency map
        run: node .github/scripts/build-selector-dependency-map.cjs

      - name: Verify dashboard source files are unchanged
        run: |
          changed="$(git status --short | sed -E 's/^.. //' | sort)"
          printf '%s\n' "$changed"
          test -n "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -v '^reports/selector-dependency-map/' || true)"
          test -z "$unexpected"
          test -s reports/selector-dependency-map/SELECTOR_DEPENDENCY_MAP.md
          test -s reports/selector-dependency-map/SELECTOR_DEPENDENCY_MAP.csv
          test -s reports/selector-dependency-map/SELECTOR_OCCURRENCES.csv
          test -s reports/selector-dependency-map/SELECTOR_DEPENDENCY_MAP.json
          test -s reports/selector-dependency-map/manifest.json
          node -e "const m=require('./reports/selector-dependency-map/manifest.json'); if(!m.sourceFilesUnchanged) process.exit(1); console.log(JSON.stringify(m.summary,null,2));"

      - name: Upload selector map artifact
        uses: actions/upload-artifact@v4
        with:
          name: selector-dependency-map
          path: reports/selector-dependency-map/
          if-no-files-found: error
          retention-days: 30

      - name: Commit selector dependency reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/selector-dependency-map
          git diff --cached --quiet && exit 0
          git commit -m "Build CSS selector dependency map"
          git push origin HEAD:refactor/flatten-index
