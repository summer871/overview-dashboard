name: First Index cleanup

on:
  push:
    branches:
      - refactor/flatten-index
    paths:
      - .github/scripts/first-index-cleanup.cjs
      - .github/workflows/first-index-cleanup.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: refactor/flatten-index
          fetch-depth: 0

      - name: Run deterministic cleanup
        run: node .github/scripts/first-index-cleanup.cjs

      - name: Commit cleanup results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Index.html INDEX_CLEANUP_REPORT.md
          git diff --cached --quiet && exit 0
          git commit -m "Remove stale header and exact duplicate style blocks"
          git push origin HEAD:refactor/flatten-index
