name: Install private Remake filter owner

on:
  push:
    branches:
      - agent/v6.544-shared-table-platform-5118
    paths:
      - .github/scripts/install-private-filter-owner.cjs
      - .github/workflows/install-private-filter-owner.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_REF_NAME}"
          git checkout -B "${GITHUB_REF_NAME}" FETCH_HEAD

      - name: Install private-scope filter owner
        run: node .github/scripts/install-private-filter-owner.cjs

      - name: Commit owner installation and self-cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- DashboardMainScript.html SharedComponentFoundation.html SharedTopParityStyles.html SharedFooter.html RemakePrivateFilterLifecycleV6637.html
          git add -u -- SharedRemakeFilterLifecycleV6636.html
          git rm -f --ignore-unmatch .github/scripts/install-private-filter-owner.cjs .github/workflows/install-private-filter-owner.yml
          git diff --cached --quiet && exit 0
          git commit -m "Install private Remake filter lifecycle owner [skip ci]"
          git push origin HEAD:agent/v6.544-shared-table-platform-5118
