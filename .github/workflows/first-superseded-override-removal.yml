name: First superseded override removal

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v4
        with:
          ref: refactor/flatten-index
          fetch-depth: 0

      - name: Remove one verified superseded override
        run: node .github/scripts/remove-first-superseded-override.cjs

      - name: Commit validated change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Index.html FIRST_OVERRIDE_REMOVAL_REPORT.md
          git diff --cached --quiet && exit 0
          git commit -m "Remove first verified superseded CSS override"
          git push origin HEAD:refactor/flatten-index
