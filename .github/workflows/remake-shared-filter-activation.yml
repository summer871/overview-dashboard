name: Remake shared filter activation

on:
  pull_request:
    branches:
      - agent/v6.544-shared-table-platform-5118
    paths:
      - RemakeSharedFilterAdapterV6646.html
      - .github/scripts/activate-remake-shared-filter.cjs
      - .github/workflows/remake-shared-filter-activation.yml

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v4
        with:
          ref: agent/ai-readable-cleanup-2026-08-21
          fetch-depth: 0

      - name: Install JavaScript parser
        run: npm install --no-save --package-lock=false acorn@8

      - name: Verify adapter JavaScript parses
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const acorn = require('acorn');
          const html = fs.readFileSync('RemakeSharedFilterAdapterV6646.html','utf8');
          const matches = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)];
          if (matches.length !== 1) throw new Error(`Expected one adapter script block, found ${matches.length}`);
          acorn.parse(matches[0][1], {ecmaVersion:'latest',sourceType:'script'});
          console.log('Adapter JavaScript parsed successfully.');
          NODE

      - name: Verify activation script syntax
        run: node --check .github/scripts/activate-remake-shared-filter.cjs

      - name: Activate shared Remake desktop filter bar
        run: node .github/scripts/activate-remake-shared-filter.cjs

      - name: Regenerate Index inspection mirror
        run: node .github/scripts/split-index-for-ai.cjs

      - name: Verify activation contracts
        run: |
          grep -q "includeDashboardFile('SharedFilterBar')" Index.html
          grep -q "includeDashboardFile('RemakeSharedFilterAdapterV6646')" Index.html
          grep -q 'cdaSharedFilterActiveV6646' RemakeSharedFilterAdapterV6646.html
          grep -q 'getPopulationKeys' RemakeSharedFilterAdapterV6646.html
          grep -q 'commitEffectiveSelectionV6389' RemakeSharedFilterAdapterV6646.html
          grep -q 'persistUiV6230' RemakeSharedFilterAdapterV6646.html
          grep -q 'renderDashboardV6230' RemakeSharedFilterAdapterV6646.html
          grep -q 'display:none !important' RemakeSharedFilterAdapterV6646.html
          node - <<'NODE'
          const fs = require('fs');
          const index = fs.readFileSync('Index.html','utf8');
          const main = index.indexOf("includeDashboardFile('DashboardMainScript'");
          const adapter = index.indexOf("includeDashboardFile('RemakeSharedFilterAdapterV6646')");
          if (main < 0 || adapter <= main) throw new Error('Adapter load order is invalid.');
          const report = JSON.parse(fs.readFileSync('docs/REMAKE-SHARED-FILTER-ACTIVATION-v6.646.json','utf8'));
          const manifest = JSON.parse(fs.readFileSync('docs/ai-readable/index/manifest.json','utf8'));
          if (report.legacyFilterDeleted) throw new Error('Legacy fallback was unexpectedly deleted.');
          if (!report.desktopLegacyFilterHiddenOnlyAfterSharedMount) throw new Error('Fallback mount guard missing.');
          if (!manifest.byteForByteReconstructionVerified) throw new Error('Updated Index mirror verification failed.');
          if (manifest.authoritativeSourceSha256 !== report.sourceSha256After) throw new Error('Index mirror is stale after activation.');
          NODE
          test -z "$(git status --short --untracked-files=all | sed -E 's/^.. //' | grep -Ev '^(Index\.html|docs/REMAKE-SHARED-FILTER-ACTIVATION-v6\.646\.json|docs/ai-readable/index/)')"

      - name: Commit shared-filter activation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Index.html docs/REMAKE-SHARED-FILTER-ACTIVATION-v6.646.json docs/ai-readable/index
          git commit -m "Activate SharedFilterBar for Remake desktop filters"
          git pull --rebase origin agent/ai-readable-cleanup-2026-08-21
          git push origin HEAD:agent/ai-readable-cleanup-2026-08-21
