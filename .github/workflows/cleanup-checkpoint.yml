name: Cleanup checkpoint

on:
  pull_request:
    branches:
      - agent/v6.544-shared-table-platform-5118
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v4
        with:
          ref: agent/ai-readable-cleanup-2026-08-21
          fetch-depth: 0

      - name: Syntax-check semantic Index extraction
        run: node --check .github/scripts/extract-semantic-index-modules.cjs

      - name: Extract semantic Index modules
        run: node .github/scripts/extract-semantic-index-modules.cjs

      - name: Refresh AI-readable Index mirror
        run: node .github/scripts/split-index-for-ai.cjs

      - name: Run cleanup structural checkpoint
        run: node scripts/validate-cleanup-checkpoint.js

      - name: Run existing runtime contract tests
        run: node scripts/test-dashboard-runtime-contracts.js

      - name: Run existing dashboard platform validator
        shell: bash
        run: |
          set +e
          output="$(node scripts/validate-dashboard-platform.js 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          unexpected="$(printf '%s\n' "$output" | grep '^ERROR:' | grep -Ev 'ERROR: Missing footer UI v6\.628|ERROR: Missing footer build label' || true)"
          if [ -n "$unexpected" ]; then
            printf 'Unexpected platform validation failures:\n%s\n' "$unexpected"
            exit 1
          fi
          echo 'Only known stale v6.628 footer assertions failed; current footer is newer and these two assertions are informational for cleanup validation.'

      - name: Commit semantic Index extraction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Index.html RemakeSectionStateControllerV6402.html RemakeKpiChooserV6403.html SharedAtomicRenderingV6418.html archive/index-semantic-extraction-2026-08-21/Index.pre-semantic-module-extraction.html docs/INDEX-SEMANTIC-EXTRACTION-BATCH-2026-08-21.json docs/ai-readable/index
          git diff --cached --quiet && { echo "No changes produced"; exit 1; }
          git commit -m "Extract semantic runtime modules from Index"
          git pull --rebase origin agent/ai-readable-cleanup-2026-08-21
          git push origin HEAD:agent/ai-readable-cleanup-2026-08-21
