name: Cleanup checkpoint

on:
  pull_request:
    branches:
      - agent/v6.544-shared-table-platform-5118
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v4
        with:
          ref: agent/ai-readable-cleanup-2026-08-21
          fetch-depth: 0

      - name: Apply full graph audit syntax fix
        run: node .github/scripts/fix-full-graph-audit-handler-regex.cjs

      - name: Syntax-check full runtime graph audit
        run: node --check .github/scripts/audit-legacy-runtime-full-graph.cjs

      - name: Audit full active runtime graph
        run: node .github/scripts/audit-legacy-runtime-full-graph.cjs

      - name: Run cleanup structural checkpoint
        run: node scripts/validate-cleanup-checkpoint.js

      - name: Run DashboardMain composition validator
        run: node scripts/validate-dashboard-main-composition.js

      - name: Run existing runtime contract tests
        run: node scripts/test-dashboard-runtime-contracts.js

      - name: Run existing dashboard platform validator
        shell: bash
        run: |
          set +e
          output="$(node scripts/validate-dashboard-platform.js 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          unexpected="$(printf '%s\n' "$output" | grep '^ERROR:' | grep -Ev 'ERROR: Missing footer UI v6\.628|ERROR: Missing footer build label' || true)"
          if [ -n "$unexpected" ]; then
            printf 'Unexpected platform validation failures:\n%s\n' "$unexpected"
            exit 1
          fi
          echo 'Only known stale v6.628 footer assertions failed; current footer is newer and these two assertions are informational for cleanup validation.'

      - name: Commit full runtime graph audit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github/scripts/audit-legacy-runtime-full-graph.cjs docs/LEGACY-DASHBOARD-FULL-RUNTIME-GRAPH-AUDIT-2026-08-21.json
          git diff --cached --quiet && { echo "No graph audit changes produced"; exit 1; }
          git commit -m "Audit full runtime graph before legacy removal"
          git pull --rebase origin agent/ai-readable-cleanup-2026-08-21
          git push origin HEAD:agent/ai-readable-cleanup-2026-08-21
