name: Cleanup checkpoint

on:
  pull_request:
    branches:
      - agent/v6.544-shared-table-platform-5118
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v4
        with:
          ref: agent/ai-readable-cleanup-2026-08-21
          fetch-depth: 0

      - name: Run cleanup structural checkpoint
        run: node scripts/validate-cleanup-checkpoint.js

      - name: Run DashboardMain composition validator
        run: node scripts/validate-dashboard-main-composition.js

      - name: Run existing runtime contract tests
        run: node scripts/test-dashboard-runtime-contracts.js

      - name: Run dashboard platform validator
        run: node scripts/validate-dashboard-platform.js

      - name: Extract TAT render runtime from protected bytes
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const vm = require('vm');

          const sourcePath = 'TatDashboardControllerScript.html';
          const childPath = 'TatDashboardRenderRuntimeV6509.html';
          const archivePath = 'archive/tat-controller-pre-split-2026-08-23/TatDashboardControllerScript.html';
          const validatorPath = 'scripts/validate-cleanup-checkpoint.js';
          const expectedGitBlobSha = '40edf579adc9ad29c937b108df8b1caebeabaf06';
          const includeDirective = "<?!= includeDashboardFile('TatDashboardRenderRuntimeV6509') ?>";
          const startMarker = '  function destroyChart(name)';
          const endMarker = '\n\n  function closeDropdowns()';

          function gitBlobSha(text) {
            const body = Buffer.from(text, 'utf8');
            const header = Buffer.from('blob ' + body.length + '\0', 'utf8');
            return crypto.createHash('sha1').update(Buffer.concat([header, body])).digest('hex');
          }

          const source = fs.readFileSync(sourcePath, 'utf8');
          if (gitBlobSha(source) !== expectedGitBlobSha) throw new Error('Protected TAT controller blob changed; refusing extraction.');

          const start = source.indexOf(startMarker);
          const end = source.indexOf(endMarker, start);
          if (start < 0 || end < 0 || end <= start) throw new Error('TAT render seam markers are missing.');
          if (source.indexOf(startMarker, start + 1) >= 0) throw new Error('TAT render start marker is not unique.');
          if (source.indexOf(endMarker, end + 1) >= 0) throw new Error('TAT render end marker is not unique.');

          const child = source.slice(start, end);
          const parent = source.slice(0, start) + includeDirective + source.slice(end);
          const reconstructed = parent.replace(includeDirective, child);
          if (reconstructed !== source) throw new Error('TAT extraction is not byte-for-byte reconstructable.');
          if (Buffer.byteLength(parent, 'utf8') > 75000 || Buffer.byteLength(child, 'utf8') > 75000) throw new Error('TAT semantic split does not bring both files under 75 KB.');

          new vm.Script(child, { filename: childPath });
          const scriptMatch = reconstructed.match(/<script\b[^>]*>([\s\S]*?)<\/script>/i);
          if (!scriptMatch) throw new Error('Reconstructed TAT script block is missing.');
          new vm.Script(scriptMatch[1], { filename: 'TatDashboardControllerScript.reconstructed.js' });

          fs.mkdirSync('archive/tat-controller-pre-split-2026-08-23', { recursive: true });
          fs.writeFileSync(archivePath, source, 'utf8');
          fs.writeFileSync(childPath, child, 'utf8');
          fs.writeFileSync(sourcePath, parent, 'utf8');

          let validator = fs.readFileSync(validatorPath, 'utf8');
          const anchor = "const tatController = read('TatDashboardControllerScript.html');\n";
          const guard = [
            "const tatRenderRuntime = read('TatDashboardRenderRuntimeV6509.html');",
            "const tatRenderInclude = \"<?!= includeDashboardFile('TatDashboardRenderRuntimeV6509') ?>\";",
            "const tatControllerPreSplit = read('archive/tat-controller-pre-split-2026-08-23/TatDashboardControllerScript.html');",
            "assert(tatController.includes(tatRenderInclude), 'TAT controller is missing the semantic render-runtime include.');",
            "assert(tatController.replace(tatRenderInclude,tatRenderRuntime) === tatControllerPreSplit, 'TAT controller + render runtime no longer reconstruct the protected pre-split controller byte-for-byte.');",
            "try { new vm.Script(tatRenderRuntime,{filename:'TatDashboardRenderRuntimeV6509.html'}); } catch (error) { failures.push('TatDashboardRenderRuntimeV6509.html: ' + error.message); }",
            "notes.push('TAT controller semantic render extraction reconstructs the protected pre-split bytes.');"
          ].join('\n') + '\n';
          if (!validator.includes(anchor)) throw new Error('Cleanup-validator TAT anchor changed.');
          if (!validator.includes("tatRenderRuntime = read('TatDashboardRenderRuntimeV6509.html')")) validator = validator.replace(anchor, anchor + guard);
          fs.writeFileSync(validatorPath, validator, 'utf8');

          console.log('TAT parent bytes:', Buffer.byteLength(parent, 'utf8'));
          console.log('TAT render child bytes:', Buffer.byteLength(child, 'utf8'));
          console.log('Reconstructed Git blob:', gitBlobSha(reconstructed));
          NODE

      - name: Re-run cleanup structural checkpoint after extraction
        run: node scripts/validate-cleanup-checkpoint.js

      - name: Re-run DashboardMain composition validator after extraction
        run: node scripts/validate-dashboard-main-composition.js

      - name: Re-run runtime contract tests after extraction
        run: node scripts/test-dashboard-runtime-contracts.js

      - name: Re-run dashboard platform validator after extraction
        run: node scripts/validate-dashboard-platform.js

      - name: Commit validated TAT extraction and restore read-only workflow
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/cleanup-checkpoint.yml <<'YAML'
          name: Cleanup checkpoint

          on:
            pull_request:
              branches:
                - agent/v6.544-shared-table-platform-5118
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            validate:
              runs-on: ubuntu-latest
              steps:
                - name: Check out cleanup branch
                  uses: actions/checkout@v4
                  with:
                    ref: agent/ai-readable-cleanup-2026-08-21
                    fetch-depth: 0

                - name: Run cleanup structural checkpoint
                  run: node scripts/validate-cleanup-checkpoint.js

                - name: Run DashboardMain composition validator
                  run: node scripts/validate-dashboard-main-composition.js

                - name: Run existing runtime contract tests
                  run: node scripts/test-dashboard-runtime-contracts.js

                - name: Run dashboard platform validator
                  run: node scripts/validate-dashboard-platform.js
          YAML

          git config user.name 'summer871'
          git config user.email 'summer@caldentalarts.com'
          git add .github/workflows/cleanup-checkpoint.yml \
            TatDashboardControllerScript.html \
            TatDashboardRenderRuntimeV6509.html \
            archive/tat-controller-pre-split-2026-08-23/TatDashboardControllerScript.html \
            scripts/validate-cleanup-checkpoint.js

          expected=$(cat <<'EOF'
          .github/workflows/cleanup-checkpoint.yml
          TatDashboardControllerScript.html
          TatDashboardRenderRuntimeV6509.html
          archive/tat-controller-pre-split-2026-08-23/TatDashboardControllerScript.html
          scripts/validate-cleanup-checkpoint.js
          EOF
          )
          staged=$(git diff --cached --name-only | sort)
          allowed=$(printf '%s\n' "$expected" | sort)
          test "$staged" = "$allowed"

          git commit -m 'refactor: extract TAT render runtime'
          git push origin HEAD:agent/ai-readable-cleanup-2026-08-21
