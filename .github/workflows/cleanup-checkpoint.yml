name: Cleanup checkpoint

on:
  pull_request:
    branches:
      - agent/v6.544-shared-table-platform-5118
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v4
        with:
          ref: agent/ai-readable-cleanup-2026-08-21
          fetch-depth: 0

      - name: Upgrade cleanup validator for chained DashboardMain composition
        run: node .github/scripts/upgrade-dashboard-main-chain-validator.cjs

      - name: Syntax-check legacy DashboardMain extraction
        run: node --check .github/scripts/extract-dashboard-main-legacy-runtime.cjs

      - name: Extract legacy dashboard runtime
        run: node .github/scripts/extract-dashboard-main-legacy-runtime.cjs

      - name: Refresh AI-readable DashboardMain mirror
        run: node .github/scripts/split-dashboard-main-for-ai.cjs

      - name: Run cleanup structural checkpoint
        run: node scripts/validate-cleanup-checkpoint.js

      - name: Run DashboardMain composition validator
        run: node scripts/validate-dashboard-main-composition.js

      - name: Run existing runtime contract tests
        run: node scripts/test-dashboard-runtime-contracts.js

      - name: Run existing dashboard platform validator
        shell: bash
        run: |
          set +e
          output="$(node scripts/validate-dashboard-platform.js 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          unexpected="$(printf '%s\n' "$output" | grep '^ERROR:' | grep -Ev 'ERROR: Missing footer UI v6\.628|ERROR: Missing footer build label' || true)"
          if [ -n "$unexpected" ]; then
            printf 'Unexpected platform validation failures:\n%s\n' "$unexpected"
            exit 1
          fi
          echo 'Only known stale v6.628 footer assertions failed; current footer is newer and these two assertions are informational for cleanup validation.'

      - name: Commit legacy DashboardMain extraction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- DashboardMainScript.html LegacyDashboardRuntime.html LegacyOverviewRuntimeSegment01.html LegacyOverviewRuntimeSegment02.html LegacyOverviewRuntimeSegment03.html LegacyOverviewRuntimeSegment04.html LegacyOverviewRuntimeSegment05.html LegacyOverviewRuntimeSegment06.html LegacyOverviewRuntimeSegment07.html LegacyOverviewRuntimeSegment08.html LegacyOverviewRuntimeSegment09.html LegacyOverviewRuntimeSegment10.html LegacyOverviewRuntimeSegment11.html LegacyOverviewRuntimeSegment12.html LegacyOverviewRuntimeSegment13.html scripts/validate-cleanup-checkpoint.js archive/dashboard-main-semantic-extraction-2026-08-21/DashboardMainScript.pre-legacy-runtime-extraction.html docs/DASHBOARD-MAIN-LEGACY-SEMANTIC-EXTRACTION-2026-08-21.json docs/ai-readable/dashboard-main
          git diff --cached --quiet && { echo "No changes produced"; exit 1; }
          git commit -m "Stage legacy dashboard runtime outside DashboardMain"
          git pull --rebase origin agent/ai-readable-cleanup-2026-08-21
          git push origin HEAD:agent/ai-readable-cleanup-2026-08-21
