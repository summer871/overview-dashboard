name: Dashboard legacy ownership audit

on:
  pull_request:
    branches:
      - agent/v6.544-shared-table-platform-5118
    paths:
      - .github/scripts/audit-dashboard-legacy.cjs
      - .github/workflows/dashboard-legacy-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v4
        with:
          ref: agent/ai-readable-cleanup-2026-08-21
          fetch-depth: 0

      - name: Verify audit syntax
        run: node --check .github/scripts/audit-dashboard-legacy.cjs

      - name: Generate current-source audit
        run: node .github/scripts/audit-dashboard-legacy.cjs

      - name: Verify runtime source unchanged
        run: git diff --exit-code -- Index.html DashboardMainScript.html DashboardBaseStyles.html Code.js

      - name: Commit audit report
        run: |
          if [ -z "$(git status --porcelain -- docs/audits/DASHBOARD-LEGACY-OWNERSHIP-AUDIT-2026-08-21.md)" ]; then
            echo 'Audit already current.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/audits/DASHBOARD-LEGACY-OWNERSHIP-AUDIT-2026-08-21.md
          git commit -m "Audit current dashboard legacy owners"
          git pull --rebase origin agent/ai-readable-cleanup-2026-08-21
          git push origin HEAD:agent/ai-readable-cleanup-2026-08-21
