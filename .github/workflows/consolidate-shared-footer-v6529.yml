name: Consolidate shared footer v6.529

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  consolidate-footer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dashboard branch
        uses: actions/checkout@v4
        with:
          ref: refactor/flatten-index
          fetch-depth: 0

      - name: Download validator from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/.github/scripts/consolidate-shared-footer-v6529.py?ref=main" \
            -o /tmp/consolidate-shared-footer-v6529.py
          test -s /tmp/consolidate-shared-footer-v6529.py

      - name: Install and validate shared footer
        run: python3 /tmp/consolidate-shared-footer-v6529.py

      - name: Verify only Index.html changed
        run: |
          changed="$(git status --short | sed -E 's/^.. //' | sort)"
          printf '%s\n' "$changed"
          test "$changed" = "Index.html"
          grep -q 'id="cdaSharedAppFooterStylesV6529"' Index.html
          grep -q 'id="cdaSharedAppFooterControllerV6529"' Index.html
          grep -q "const APP_VERSION_V6529 = 'v6.529';" Index.html
          test "$(grep -o 'id="cdaSharedAppFooterV6529"' Index.html | wc -l)" -eq 0
          test "$(grep -o 'FOOTER_ID_V6529 = '\''cdaSharedAppFooterV6529'\''' Index.html | wc -l)" -eq 1

      - name: Commit shared footer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Index.html
          git commit -m "Consolidate Remake and TAT shared footer v6.529"
          git push origin HEAD:refactor/flatten-index
