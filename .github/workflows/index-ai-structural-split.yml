name: Index AI-readable inspection mirror

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror-index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v4
        with:
          ref: agent/ai-readable-cleanup-2026-08-21
          fetch-depth: 0

      - name: Verify transformer syntax
        run: node --check .github/scripts/split-index-for-ai.cjs

      - name: Generate AI-readable Index mirror
        run: node .github/scripts/split-index-for-ai.cjs

      - name: Verify runtime source remains untouched
        run: git diff --exit-code -- Index.html Code.js

      - name: Verify generated chunks reconstruct source
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const manifest = JSON.parse(fs.readFileSync('docs/ai-readable/index/manifest.json', 'utf8'));
          const rebuilt = manifest.chunks.map(item => fs.readFileSync(item.file, 'utf8')).join('');
          const source = fs.readFileSync(manifest.authoritativeSource, 'utf8');
          const hash = value => crypto.createHash('sha256').update(value, 'utf8').digest('hex');
          if (rebuilt !== source) throw new Error('Generated chunks do not reconstruct Index.html exactly.');
          if (hash(source) !== manifest.authoritativeSourceSha256) throw new Error('Index source hash mismatch.');
          for (const item of manifest.chunks) {
            const size = fs.statSync(item.file).size;
            if (size !== item.bytes) throw new Error(`Size mismatch for ${item.file}`);
            if (size > manifest.maxAiReadableBytes) throw new Error(`${item.file} exceeds AI-readable limit.`);
          }
          if (manifest.runtimeSourceChanged) throw new Error('Inspection generator reports a runtime change.');
          console.log(`Verified ${manifest.chunkCount} Index inspection chunks.`);
          NODE

      - name: Commit inspection mirror
        run: |
          if [ -z "$(git status --porcelain -- docs/ai-readable/index)" ]; then
            echo 'Index inspection mirror already current.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/ai-readable/index
          git commit -m "Generate AI-readable Index mirror"
          git pull --rebase origin agent/ai-readable-cleanup-2026-08-21
          git push origin HEAD:agent/ai-readable-cleanup-2026-08-21
