name: Validated CSS batch cleanup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v4
        with:
          ref: refactor/flatten-index
          fetch-depth: 0

      - name: Download validator from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/.github/scripts/remove-validated-css-batch.py?ref=main" \
            -o /tmp/remove-validated-css-batch.py
          test -s /tmp/remove-validated-css-batch.py

      - name: Run validated 12-rule CSS batch cleanup
        run: python3 /tmp/remove-validated-css-batch.py

      - name: Confirm only approved files changed
        run: |
          changed="$(git status --short | sed -E 's/^.. //' | sort)"
          printf '%s\n' "$changed"
          test "$changed" = $'CSS_BATCH_CLEANUP_REPORT.md\nIndex.html'

      - name: Commit validated cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Index.html CSS_BATCH_CLEANUP_REPORT.md
          git diff --cached --quiet && exit 0
          git commit -m "Remove validated batch of superseded TAT CSS rules"
          git push origin HEAD:refactor/flatten-index
