name: Apply hard focus filters

on:
  push:
    branches:
      - agent/v6.544-shared-table-platform-5118
    paths:
      - .github/scripts/apply-hard-focus-filters.cjs
      - .github/workflows/apply-hard-focus-filters.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
        with:
          ref: agent/v6.544-shared-table-platform-5118
          fetch-depth: 0

      - name: Apply and validate hard-focus filter repair
        run: node .github/scripts/apply-hard-focus-filters.cjs

      - name: Commit owner-level filter correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- DashboardMainScript.html SharedTopParityStyles.html SharedFooter.html SharedRemakeFilterSemanticsV6632.html
          git rm -f --ignore-unmatch .github/scripts/apply-hard-focus-filters.cjs .github/workflows/apply-hard-focus-filters.yml
          git diff --cached --quiet && exit 0
          git commit -m "Fix dropdown hard focus and preserve soft cross-filtering [skip ci]"
          git push origin HEAD:agent/v6.544-shared-table-platform-5118
