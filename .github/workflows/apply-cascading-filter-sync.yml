name: Apply cascading dropdown synchronization

on:
  push:
    branches:
      - agent/v6.544-shared-table-platform-5118
    paths:
      - .github/scripts/apply-cascading-filter-sync.cjs
      - .github/workflows/apply-cascading-filter-sync.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v6.544-shared-table-platform-5118
          fetch-depth: 0

      - name: Apply guarded owner-level repair
        run: node .github/scripts/apply-cascading-filter-sync.cjs

      - name: Commit synchronized dropdown lifecycle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- SharedTopParityStyles.html SharedFooter.html
          git rm -f --ignore-unmatch .github/scripts/apply-cascading-filter-sync.cjs .github/workflows/apply-cascading-filter-sync.yml
          git diff --cached --quiet && exit 0
          git commit -m "Synchronize cascading dropdown inventories [skip ci]"
          git push origin HEAD:agent/v6.544-shared-table-platform-5118

# Triggered once for v6.635; workflow deletes itself after success.
