name: Fix visible dev build marker ID v6.530

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-visible-dev-build-marker-v6530.yml

permissions:
  contents: write

concurrency:
  group: overview-dashboard-visible-dev-build-marker
  cancel-in-progress: false

jobs:
  fix-marker-id:
    runs-on: ubuntu-latest
    steps:
      - name: Check out isolated extraction branch
        uses: actions/checkout@v4
        with:
          ref: refactor/remake-trend-tail-extraction
          fetch-depth: 0

      - name: Verify pushed marker baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "e9a43ae59f3db79f3a1ad31bb592e4137a39f76f"
          test -z "$(git status --porcelain)"
          test "$(grep -o 'id="cdaVisibleDevBuildMarkerV6530"' Index.html | wc -l)" -eq 1
          test "$(grep -o 'id="cdaVisibleDevBuildMarkerScriptV6530"' Index.html | wc -l)" -eq 0
          grep -q "const MARKER_ID_V6530 = 'cdaVisibleDevBuildMarkerV6530';" Index.html
          grep -q "document.getElementById(MARKER_ID_V6530)" Index.html

      - name: Separate script and visible marker IDs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Index.html')
          original = path.read_text(encoding='utf-8')
          old = '<script id="cdaVisibleDevBuildMarkerV6530">'
          new = '<script id="cdaVisibleDevBuildMarkerScriptV6530">'

          if original.count(old) != 1:
              raise SystemExit(f'Expected exactly one old script ID, found {original.count(old)}. No file was changed.')
          if new in original:
              raise SystemExit('New script ID already exists. No file was changed.')
          if original.count("const MARKER_ID_V6530 = 'cdaVisibleDevBuildMarkerV6530';") != 1:
              raise SystemExit('Visible marker DOM ID constant is missing or duplicated. No file was changed.')
          if original.count('#cdaVisibleDevBuildMarkerV6530') != 2:
              raise SystemExit('Visible marker CSS selector count changed. No file was changed.')

          updated = original.replace(old, new, 1)

          if old in updated or updated.count(new) != 1:
              raise SystemExit('Script ID replacement failed. No file was changed.')
          if updated.count("const MARKER_ID_V6530 = 'cdaVisibleDevBuildMarkerV6530';") != 1:
              raise SystemExit('Visible marker DOM ID changed unexpectedly. No file was changed.')
          if updated.count('#cdaVisibleDevBuildMarkerV6530') != 2:
              raise SystemExit('Visible marker CSS changed unexpectedly. No file was changed.')
          if updated.count("const UI_VERSION_V6530 = 'v6.530';") != 1:
              raise SystemExit('Build version changed unexpectedly. No file was changed.')
          if updated.count("const BUILD_LABEL_V6530 = 'RT-TAIL-01';") != 1:
              raise SystemExit('Build label changed unexpectedly. No file was changed.')

          path.write_text(updated, encoding='utf-8', newline='\n')
          print('Separated script element ID from visible badge DOM ID.')
          PY

      - name: Verify only Index changed
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --short --untracked-files=all | sed -E 's/^.. //' | sort)"
          printf '%s\n' "$changed"
          test "$changed" = "Index.html"
          test "$(grep -o 'id="cdaVisibleDevBuildMarkerV6530"' Index.html | wc -l)" -eq 0
          test "$(grep -o 'id="cdaVisibleDevBuildMarkerScriptV6530"' Index.html | wc -l)" -eq 1
          test "$(grep -o '#cdaVisibleDevBuildMarkerV6530' Index.html | wc -l)" -eq 2
          grep -q "const MARKER_ID_V6530 = 'cdaVisibleDevBuildMarkerV6530';" Index.html
          grep -q "document.getElementById(MARKER_ID_V6530)" Index.html
          grep -q "marker.id = MARKER_ID_V6530" Index.html
          grep -q "const UI_VERSION_V6530 = 'v6.530';" Index.html
          grep -q "const BUILD_LABEL_V6530 = 'RT-TAIL-01';" Index.html
          grep -q "includeDashboardFile('RemakeTailStyles')" Index.html

      - name: Commit marker ID repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Index.html
          git commit -m "Fix visible dev marker ID collision"
          git push origin HEAD:refactor/remake-trend-tail-extraction
