<script id="cdaTatTableWidthsControllerV6563">
(function installTatTableWidthsV6563(){
  'use strict';

  if (window.cdaTatTableWidthsV6563 &&
      window.cdaTatTableWidthsV6563.version === 'v6.563') return;

  const WIDTHS = Object.freeze({
    tatDepartment:['30%','13%','13%','11%','11%','10%','12%'],
    tatProduct:['34%','12%','12%','10%','10%','10%','12%'],
    tatCustomer:['30%','9%','12%','12%','10%','9%','9%','9%']
  });

  function applyToConfig(key,widths){
    const api = window.cdaTable;
    const config = api && typeof api.config === 'function' ? api.config(key) : null;
    if (!config || !Array.isArray(config.columns)) return false;
    config.columns.forEach(function(column,index){
      if (widths[index]) column.width = widths[index];
    });
    return true;
  }

  function apply(){
    let applied = false;
    Object.keys(WIDTHS).forEach(function(key){
      applied = applyToConfig(key,WIDTHS[key]) || applied;
    });
    return applied;
  }

  function afterReplace(){
    apply();
    window.requestAnimationFrame(apply);
  }

  window.cdaTatTableWidthsV6563 = Object.freeze({
    version:'v6.563',
    widths:WIDTHS,
    apply:apply,
    afterReplace:afterReplace
  });

  window.addEventListener('cdaDashboardTabRenderedV6547',function(event){
    if (event && event.detail && event.detail.tabKey === 'tat') afterReplace();
  });
  window.addEventListener('cdaTableRendered',apply);
})();
</script>
