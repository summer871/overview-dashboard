<style>
    :root {
      --bg: #f4f1ee;
      --canvas: #ebe7e3;
      --card: #ffffff;
      --ink: #172033;
      --muted: #667085;
      --line: #d5d9e2;
      --softLine: #edf0f5;
      --navy: #182433;
      --navy2: #26374f;
      --blue: #235b8e;
      --blueSoft: rgba(35, 91, 142, 0.18);
      --slate: #6f7d8f;
      --slateSoft: rgba(111, 125, 143, 0.22);
      --pale: #a8c4dd;
      --paleSoft: rgba(168, 196, 221, 0.30);
      --green: #067647;
      --red: #b42318;
      --amber: #b76e00;
      --chip: #eef4fb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    .tabs {
      height: 42px;
      display: flex;
      align-items: end;
      gap: 4px;
      background: #f7f7f8;
      border-bottom: 1px solid #d7dce4;
      padding: 0 10px;
    }

    .tabBtn {
      border: 0;
      background: transparent;
      padding: 12px 20px 11px;
      font-size: 16px;
      font-weight: 800;
      color: #344054;
      border-radius: 10px 10px 0 0;
      cursor: pointer;
    }

    .tabBtn.active {
      background: #d5e5fb;
      color: #174ea6;
      box-shadow: inset 0 -1px 0 #d5e5fb;
    }

    .tabPage {
      display: none;
      padding: 10px 12px 16px;
    }

    .tabPage.active {
      display: block;
    }

    .dashboardShell {
      max-width: 1920px;
      margin: 0 auto;
      background: var(--canvas);
      border: 1px solid #d4d7de;
      padding: 8px;
    }

    .topBar {
      display: grid;
      grid-template-columns: auto auto auto 1fr;
      gap: 10px;
      align-items: center;
      margin-bottom: 8px;
    }

    .segGroup {
      display: inline-flex;
      background: #ffffff;
      border: 1px solid #c9ced8;
      border-radius: 9px;
      padding: 3px;
      box-shadow: 0 1px 2px rgba(16, 24, 40, 0.08);
      gap: 3px;
    }

    .segBtn,
    .resetBtn {
      border: 0;
      border-radius: 7px;
      background: transparent;
      padding: 9px 13px;
      font-weight: 800;
      font-size: 13px;
      color: #344054;
      cursor: pointer;
      white-space: nowrap;
    }

    .segBtn.active {
      background: var(--navy);
      color: #ffffff;
      box-shadow: 0 1px 2px rgba(16, 24, 40, 0.14);
    }

    .resetBtn {
      background: #ffffff;
      border: 1px solid #c9ced8;
      box-shadow: 0 1px 2px rgba(16, 24, 40, 0.08);
    }

    .kpiStrip {
      display: grid;
      grid-template-columns: repeat(6, minmax(110px, 1fr));
      gap: 6px;
    }

    .kpiMini {
      background: #ffffff;
      border: 1px solid #d8dde6;
      border-radius: 9px;
      padding: 7px 9px;
      min-height: 48px;
    }

    .kpiMini .label {
      font-size: 10px;
      color: var(--muted);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .03em;
      margin-bottom: 4px;
    }

    .kpiMini .value {
      font-size: 18px;
      line-height: 1.05;
      font-weight: 900;
      color: var(--ink);
    }

    .kpiMini .value.good {
      color: var(--green);
    }

    .kpiMini .value.bad {
      color: var(--red);
    }

    .chipRow {
      min-height: 28px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin: 0 0 8px 0;
      align-items: center;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--chip);
      border: 1px solid #c8d8ea;
      color: #23415f;
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 12px;
      font-weight: 700;
    }

    .chip button {
      border: 0;
      background: transparent;
      cursor: pointer;
      color: #315f9b;
      font-weight: 900;
      padding: 0;
    }

    .grid {
      display: grid;
      grid-template-columns: 205px 1.08fr 1.08fr 1.28fr;
      grid-template-rows: 234px 234px 234px;
      gap: 7px;
      grid-template-areas:
        "filters revenue customers customerTable"
        "filters units rpac productTable"
        "filters units avg productTable";
    }

    .filterPanel {
      grid-area: filters;
      background: var(--card);
      border: 1px solid #bdc4cf;
      box-shadow: 0 1px 2px rgba(16, 24, 40, 0.18);
      overflow: hidden;
      min-height: 0;
    }

    .sectionHeader {
      background: #0f1720;
      color: #ffffff;
      padding: 6px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 900;
    }

    .filterBlock {
      border-bottom: 1px solid #dde1e8;
      padding: 8px;
    }

    .deptList,
    .yearList {
      max-height: 232px;
      overflow-y: auto;
    }

    .deptRow,
    .yearRow {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 8px;
      padding: 5px 3px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
    }

    .deptRow:hover,
    .yearRow:hover,
    .deptRow.active,
    .yearRow.active {
      background: #eef5ff;
    }

    .labelSide {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .labelSide span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .rowTotal {
      color: #344054;
      font-size: 11px;
      white-space: nowrap;
      text-align: right;
    }

    select,
    input[type="text"] {
      width: 100%;
      border: 1px solid #cbd3df;
      border-radius: 7px;
      background: #ffffff;
      padding: 8px;
      font-size: 12px;
      color: var(--ink);
    }

    .card {
      background: #ffffff;
      border: 1px solid #bdc4cf;
      box-shadow: 0 1px 2px rgba(16, 24, 40, 0.18);
      padding: 7px;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .areaRevenue { grid-area: revenue; }
    .areaCustomers { grid-area: customers; }
    .areaCustomerTable { grid-area: customerTable; }
    .areaUnits { grid-area: units; }
    .areaRpac { grid-area: rpac; }
    .areaAvg { grid-area: avg; }
    .areaProductTable { grid-area: productTable; }

    .cardHeader {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .chartTitle {
      font-size: 12px;
      font-weight: 900;
      color: #101828;
      white-space: nowrap;
    }

    .tableToggles {
      display: inline-flex;
      background: #f1f4f8;
      border-radius: 7px;
      padding: 2px;
      gap: 2px;
    }

    .tinyBtn {
      border: 0;
      background: transparent;
      border-radius: 5px;
      padding: 4px 7px;
      font-size: 10px;
      font-weight: 800;
      color: #475467;
      cursor: pointer;
    }

    .tinyBtn.active {
      background: #ffffff;
      color: var(--blue);
      box-shadow: 0 1px 2px rgba(16, 24, 40, 0.11);
    }

    .chartBox {
      position: relative;
      width: 100%;
      height: 196px;
    }

    .areaUnits .chartBox {
      height: 430px;
    }

    .tableScroll {
      height: 196px;
      overflow: auto;
      border-top: 1px solid #e1e5ec;
    }

    .areaProductTable .tableScroll {
      height: 430px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
    }

    th {
      background: var(--navy);
      color: #ffffff;
      position: sticky;
      top: 0;
      z-index: 2;
      border: 1px solid #324255;
      padding: 5px;
      text-align: right;
      white-space: nowrap;
    }

    th:first-child,
    td:first-child {
      text-align: left;
    }

    td {
      border: 1px solid #e4e7ec;
      padding: 5px;
      text-align: right;
      background: #ffffff;
      white-space: nowrap;
    }

    tr:nth-child(even) td {
      background: #fafbfc;
    }

    tr.clickable:hover td,
    tr.active td {
      background: #eaf3ff;
      cursor: pointer;
    }

    .negative {
      color: var(--red);
      font-weight: 800;
    }

    .positive {
      color: var(--green);
      font-weight: 800;
    }

    .footer {
      font-size: 11px;
      color: #667085;
      margin-top: 5px;
    }

    .twoShell {
      display: grid;
      grid-template-columns: 255px 1fr;
      gap: 12px;
      max-width: 1900px;
      margin: 0 auto;
    }

    .sideTwo {
      background: #ffffff;
      border: 1px solid var(--line);
      padding: 14px;
      border-radius: 10px;
    }

    .mainTwo {
      min-width: 0;
    }

    .bigKpis {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-bottom: 10px;
    }

    .bigKpi {
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
    }

    .bigKpi .label {
      font-size: 11px;
      color: #667085;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .bigKpi .value {
      font-size: 24px;
      font-weight: 900;
    }

    .twoGrid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .twoGrid .wide {
      grid-column: 1 / -1;
    }

    .twoCard {
      height: 310px;
    }

    .twoCard .chartBox {
      height: 265px;
    }

    .error {
      background: #fef3f2;
      border: 1px solid #fecdca;
      color: #b42318;
      padding: 10px;
      border-radius: 8px;
      margin: 10px;
      white-space: pre-wrap;
    }

    @media (max-width: 1150px) {
      .topBar,
      .grid,
      .twoShell,
      .twoGrid {
        display: block;
      }

      .filterPanel,
      .card,
      .bigKpi {
        margin-bottom: 10px;
      }

      .kpiStrip,
      .bigKpis {
        grid-template-columns: 1fr;
      }

      .chartBox,
      .areaUnits .chartBox,
      .tableScroll,
      .areaProductTable .tableScroll {
        height: 260px;
      }
    }
