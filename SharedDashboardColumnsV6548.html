<!-- SharedDashboardColumnsV6548.html
Version: v6.550
Date: 2026-07-29
Purpose: One visible column chooser and persistence service for managed and existing DOM tables.
-->
<style id="cdaSharedDashboardColumnsStylesV6548">
  .cdaDashboardColumnHiddenV6548 { display:none!important; }
  .cdaDashboardColumnSectionV6548 + .cdaDashboardColumnSectionV6548 { margin-top:7px; padding-top:7px; border-top:1px solid var(--cda-color-divider); }
  .cdaDashboardColumnSectionTitleV6548 { padding:3px 6px 5px; color:var(--cda-color-muted); font:800 9px/1.2 var(--cda-font-ui); text-transform:uppercase; letter-spacing:.05em; }
  .cdaDashboardColumnFooterV6548 { display:flex; justify-content:flex-end; gap:6px; padding:7px 5px 2px; border-top:1px solid var(--cda-color-divider); margin-top:5px; }
  .cdaDashboardColumnFooterV6548 button { width:auto!important; }
</style>
<script id="cdaSharedDashboardColumnsControllerV6548">
(function installSharedDashboardColumnsV6548(){
  'use strict';

  if (window.cdaDashboardColumnsV6548 && window.cdaDashboardColumnsV6548.version === 'v6.550') return;

  const storageKey = 'cdaDashboardColumns.v6550';

  function readState(){
    try {
      const value = JSON.parse(localStorage.getItem(storageKey) || '{}');
      return value && typeof value === 'object' ? value : {};
    } catch (error) {
      return {};
    }
  }

  function writeState(state){
    try { localStorage.setItem(storageKey,JSON.stringify(state || {})); }
    catch (error) {}
  }

  function stateKey(context){
    return String(context.tab && context.tab.key || 'dashboard') + ':' +
      String(context.component && context.component.key || 'component');
  }

  function tableIds(component){
    if (!component) return [];
    if (Array.isArray(component.tableIds)) return component.tableIds.map(String).filter(Boolean);
    if (component.targetId) return [String(component.targetId)];
    return [];
  }

  function resolveTable(id){
    const node = document.getElementById(id);
    if (!node) return null;
    return node.tagName === 'TABLE' ? node : node.closest ? node.closest('table') : null;
  }

  function cleanLabel(value){
    return String(value == null ? '' : value)
      .replace(/[▲▼▴▾]/g,'')
      .replace(/\s+/g,' ')
      .trim() || 'Column';
  }

  function domColumns(table){
    if (!table || !table.tHead || !table.tHead.rows.length) return [];
    const counts = Object.create(null);
    return Array.from(table.tHead.rows[0].cells || []).map(function(cell,index){
      const label = cleanLabel(cell.textContent);
      const base = label.toLowerCase();
      counts[base] = (counts[base] || 0) + 1;
      return {
        field:base + '#' + counts[base],
        label:label,
        index:index,
        hideable:index > 0,
        visible:true
      };
    });
  }

  function domHidden(context,tableId){
    const state = readState();
    const key = stateKey(context);
    const componentState = state[key] || {};
    if (!Object.prototype.hasOwnProperty.call(componentState,tableId)) {
      try {
        const legacy = JSON.parse(localStorage.getItem('cda.remake.columnVisibility.v6357') || '{}');
        const values = legacy && legacy[tableId] && Array.isArray(legacy[tableId].hidden)
          ? legacy[tableId].hidden.map(String)
          : [];
        if (values.length) {
          componentState[tableId] = values;
          state[key] = componentState;
          writeState(state);
        }
        if (legacy && Object.prototype.hasOwnProperty.call(legacy,tableId)) {
          delete legacy[tableId];
          localStorage.setItem('cda.remake.columnVisibility.v6357',JSON.stringify(legacy));
        }
      } catch (error) {}
    }
    return new Set(Array.isArray(componentState[tableId]) ? componentState[tableId] : []);
  }

  function saveDomHidden(context,tableId,hidden){
    const state = readState();
    const key = stateKey(context);
    state[key] = state[key] && typeof state[key] === 'object' ? state[key] : {};
    state[key][tableId] = Array.from(hidden || []);
    writeState(state);
  }

  function managedSource(context){
    const component = context && context.component;
    const api = window.cdaTable;
    if (!component || !component.tableKey || !api ||
        typeof api.config !== 'function' || !api.config(component.tableKey)) return null;
    const config = api.config(component.tableKey);
    const columns = typeof api.columns === 'function' ? api.columns(component.tableKey) : [];
    return {
      id:String(config.tableId || component.tableKey),
      title:component.title || component.key,
      type:'managed',
      tableKey:component.tableKey,
      columns:columns.map(function(column,index){
        return {
          field:String(column.field),
          label:String(column.title || column.label || column.field),
          index:index,
          hideable:column.hideable !== false,
          visible:column.visible !== false
        };
      })
    };
  }

  function domSources(context){
    return tableIds(context.component).map(function(tableId){
      const table = resolveTable(tableId);
      if (!table) return null;
      const hidden = domHidden(context,tableId);
      return {
        id:tableId,
        title:table.getAttribute('aria-label') || context.component.title || tableId,
        type:'dom',
        table:table,
        columns:domColumns(table).map(function(column){
          return Object.assign({},column,{visible:!hidden.has(column.field)});
        })
      };
    }).filter(Boolean);
  }

  function describe(context){
    const managed = managedSource(context);
    return managed ? [managed] : domSources(context);
  }

  function applyDom(context,source){
    const hidden = domHidden(context,source.id);
    const columns = domColumns(source.table);
    source.table.setAttribute('data-cda-dashboard-columns-key',stateKey(context));
    source.table.setAttribute('data-cda-dashboard-columns-table-id',source.id);
    Array.from(source.table.querySelectorAll('.columnHiddenV6357')).forEach(function(node){
      node.classList.remove('columnHiddenV6357');
    });
    Array.from(source.table.rows || []).forEach(function(row){
      Array.from(row.cells || []).forEach(function(cell,index){
        const column = columns[index];
        cell.classList.toggle('cdaDashboardColumnHiddenV6548',!!(column && hidden.has(column.field)));
      });
    });
    Array.from(source.table.querySelectorAll('col')).forEach(function(col,index){
      const column = columns[index];
      col.classList.toggle('cdaDashboardColumnHiddenV6548',!!(column && hidden.has(column.field)));
    });
    return true;
  }

  function apply(context){
    let applied = false;
    describe(context).forEach(function(source){
      if (source.type === 'dom') applied = applyDom(context,source) || applied;
    });
    return applied;
  }

  function setVisible(context,sourceId,field,visible){
    const source = describe(context).find(function(item){ return item.id === sourceId; });
    if (!source) return false;
    if (source.type === 'managed') {
      if (!window.cdaTable || typeof window.cdaTable.toggleColumn !== 'function') return false;
      window.cdaTable.toggleColumn(source.tableKey,field,visible);
      return true;
    }
    const hidden = domHidden(context,source.id);
    if (visible) hidden.delete(field); else hidden.add(field);
    saveDomHidden(context,source.id,hidden);
    applyDom(context,source);
    return true;
  }

  function showAll(context){
    describe(context).forEach(function(source){
      if (source.type === 'managed' && window.cdaTable && typeof window.cdaTable.resetColumns === 'function') {
        window.cdaTable.resetColumns(source.tableKey);
      }
      if (source.type === 'dom') {
        saveDomHidden(context,source.id,new Set());
        applyDom(context,source);
      }
    });
    return true;
  }

  function open(context){
    if (!context || !context.component || !context.popover) return false;
    if (context.popover.isOpenFor(context.button)) {
      context.popover.close();
      return true;
    }
    const sources = describe(context);
    if (!sources.length) return false;
    const panel = context.popover.open(context.button,{label:'Choose visible columns',title:'Columns'});
    sources.forEach(function(source){
      const section = document.createElement('div');
      section.className = 'cdaDashboardColumnSectionV6548';
      if (sources.length > 1) {
        const heading = document.createElement('div');
        heading.className = 'cdaDashboardColumnSectionTitleV6548';
        heading.textContent = source.title;
        section.appendChild(heading);
      }
      source.columns.forEach(function(column){
        const label = document.createElement('label');
        const input = document.createElement('input');
        const text = document.createElement('span');
        input.type = 'checkbox';
        input.checked = column.visible;
        input.disabled = !column.hideable;
        input.addEventListener('change',function(){
          const current = describe(context).find(function(item){ return item.id === source.id; });
          const visibleCount = current
            ? current.columns.filter(function(item){ return item.visible; }).length
            : 0;
          if (!input.checked && visibleCount <= 1) {
            input.checked = true;
            return;
          }
          setVisible(context,source.id,column.field,input.checked);
        });
        text.textContent = column.label;
        label.append(input,text);
        section.appendChild(label);
      });
      panel.appendChild(section);
    });
    const footer = document.createElement('div');
    footer.className = 'cdaDashboardColumnFooterV6548';
    const show = document.createElement('button');
    show.type = 'button';
    show.textContent = 'Show all';
    show.addEventListener('click',function(){ showAll(context); context.popover.close(); });
    const done = document.createElement('button');
    done.type = 'button';
    done.textContent = 'Done';
    done.addEventListener('click',function(){ context.popover.close(); });
    footer.append(show,done);
    panel.appendChild(footer);
    context.popover.position();
    return true;
  }

  window.cdaDashboardColumnsV6548 = Object.freeze({
    version:'v6.550',
    mode:'single-shared-chooser',
    open:open,
    apply:apply,
    reset:showAll,
    describe:describe,
    setVisible:setVisible,
    showAll:showAll
  });
})();
</script>
