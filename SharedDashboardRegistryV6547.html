<script id="cdaSharedDashboardRegistryV6547">
(function installSharedDashboardRegistryV6547(){
  'use strict';

  if (window.cdaDashboardPlatformV6547 && window.cdaDashboardPlatformV6547.version === 'v6.579') return;

  const VERSION_V6547 = 'v6.579';
  const featureRegistryV6547 = new Map();
  const tabRegistryV6547 = new Map();

  function normalizeKeyV6547(value,label){
    const key = String(value == null ? '' : value).trim();
    if (!key) throw new Error((label || 'Key') + ' is required.');
    return key;
  }

  function escapeHtmlV6547(value){
    return String(value == null ? '' : value)
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;')
      .replace(/'/g,'&#39;');

  function registerFeatureV6547(definition){
    if (!definition || typeof definition !== 'object') throw new Error('Feature definition is required.');
    const key = normalizeKeyV6547(definition.key,'Feature key');
    if (featureRegistryV6547.has(key)) throw new Error('Feature already registered: ' + key);
    const normalized = Object.assign({
      placement:'toolbar',
      order:100,
      iconOnly:false,
      appearance:'standard'

    featureRegistryV6547.set(key,Object.freeze(normalized));
    return normalized;
  }

  function normalizeFeatureOptionsV6579(value){
    if (!value || typeof value !== 'object' || Array.isArray(value)) return {};
    return Object.keys(value).reduce(function(result,key){
      const option = value[key];
      result[String(key)] = option && typeof option === 'object' && !Array.isArray(option)
        ? Object.assign({},option)
        : option;
      return result;
    },{});
  }

  function normalizeComponentV6547(component,index){
    if (!component || typeof component !== 'object') {
      throw new Error('Tab component at index ' + index + ' is invalid.');
    }
    const key = normalizeKeyV6547(component.key,'Component key');
    return Object.assign({title:key,kind:'custom',features:[],featureOptions:{}},component,{
      key:key,
      features:Array.from(new Set((component.features || []).map(String))),
      featureOptions:normalizeFeatureOptionsV6579(component.featureOptions)

  function registerTabV6547(definition){
    if (!definition || typeof definition !== 'object') throw new Error('Tab definition is required.');
    const key = normalizeKeyV6547(definition.key,'Tab key');

      key:key,
      mountMode:definition.mountMode === 'decorate' ? 'decorate' : 'replace',
      components:(definition.components || []).map(normalizeComponentV6547)

    tabRegistryV6547.set(key,normalized);
    return normalized;
  }

  function getFeatureV6547(key){ return featureRegistryV6547.get(String(key || '')) || null; }
  function getTabV6547(key){ return tabRegistryV6547.get(String(key || '')) || null; }

  function sortedFeaturesV6547(component,placement){
    return (component && component.features || [])
      .map(getFeatureV6547)
      .filter(function(feature){ return feature && (!placement || feature.placement === placement); })
      .sort(function(left,right){ return Number(left.order || 0) - Number(right.order || 0); });
  }

  function validateTabV6547(tabKey){
    const tab = getTabV6547(tabKey);
    if (!tab) return {ok:false,tabKey:String(tabKey || ''),errors:['Tab is not registered.']};
    const errors = [];
    const warnings = [];
    const componentKeys = new Set();
    tab.components.forEach(function(component){
      if (componentKeys.has(component.key)) errors.push('Duplicate component key: ' + component.key);
      componentKeys.add(component.key);
      component.features.forEach(function(featureKey){

    if (!tab.pageId) errors.push('Tab pageId is required.');
    if (tab.mountMode === 'replace' && typeof tab.renderLayout !== 'function') {
      errors.push('Replace-mode tab requires renderLayout().');
    }
    if (!tab.components.length) warnings.push('Tab has no components.');
    return {
      ok:errors.length === 0,
      version:VERSION_V6547,
      tabKey:tab.key,
      mountMode:tab.mountMode,
      componentKeys:Array.from(componentKeys),
      errors:errors,
      warnings:warnings

    version:VERSION_V6547,
    registerFeature:registerFeatureV6547,
    registerTab:registerTabV6547,

    getTab:getTabV6547,
