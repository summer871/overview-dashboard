<script id="cdaSharedDashboardTitleToggleControllerV6555">
(function installSharedDashboardTitleToggleV6555(){
  'use strict';

  if (window.cdaDashboardTitleToggleV6555 && window.cdaDashboardTitleToggleV6555.version === 'v6.579') return;

  const platform = window.cdaDashboardPlatformV6547;

  const runtime = window.cdaDashboardFeatureRuntimeV6579;
  if (!platform || !theme || !runtime) throw new Error('Dashboard registry, theme, and feature runtime must load before title toggles.');

  const ARROW_EDGE_PATTERN_V6556 = /^[\s▾▸▼▲▶◀⌄⌃˅˄]+|[\s▾▸▼▲▶◀⌄⌃˅˄]+$/g;
  const ARROW_REPLACE_PATTERN_V6556 = /[▾▸▼▲▶◀⌄⌃˅˄]/g;
  const ARROW_TEST_PATTERN_V6556 = /[▾▸▼▲▶◀⌄⌃˅˄]/;

  function cleanTitleText(value){
    return String(value == null ? '' : value).replace(/\s+/g,' ').replace(ARROW_EDGE_PATTERN_V6556,'').trim();
  }

  function canonicalTitle(component,title){
    return cleanTitleText(component && component.title) || cleanTitleText(title && title.textContent) ||
      cleanTitleText(component && component.key) || 'Dashboard component';
  }

  function runtimeContext(tab,component,button,event,card){
    const ownerDocument = button && button.ownerDocument || card && card.ownerDocument || document;
    return {
      tab:tab,
      component:component,
      button:button,
      event:event,
      card:card || button && button.closest && button.closest('[data-cda-component-id],.remakeCard,article'),
      document:ownerDocument,
      window:ownerDocument.defaultView || window,
      adapter:tab.adapter || {},
      platform:platform,
      runtime:runtime,
      popover:window.cdaDashboardPopoverV6547 || null

  }

  function isCollapsed(context){ return runtime.isActive('collapse',context); }

  function sync(context,button){
    if (!button) return;
    const collapsed = isCollapsed(context);
    const iconName = collapsed ? 'expand' : 'collapse';
    const icon = button.querySelector('.cdaDashboardTitleChevronV6555');
    if (icon) icon.textContent = theme.icon(iconName);
    button.setAttribute('data-cda-dashboard-icon-state',iconName);
    button.setAttribute('aria-expanded',collapsed ? 'false' : 'true');
    button.setAttribute('aria-label',(collapsed ? 'Expand ' : 'Collapse ') + context.component.title);
    button.title = (collapsed ? 'Expand ' : 'Collapse ') + context.component.title;

    button.setAttribute('data-cda-dashboard-title-bound','true');
    button.addEventListener('click',function(event){
      event.preventDefault();
      event.stopPropagation();
      const context = runtimeContext(tab,component,button,event,card);
      runtime.run('collapse',context);
      sync(context,button);
    });
  }

  function mount(tabKey,componentKey,card){
    const tab = platform.getTab(tabKey);
    const component = tab && tab.components.find(function(item){ return item.key === componentKey; });
    if (!tab || !component || !card || !runtime.supports('collapse',runtimeContext(tab,component,null,null,card))) return null;

    const title = card.querySelector('.remakeCardTitle,.tatCardTitleV6509');
    if (!title) return null;

    title.classList.add('cdaDashboardTitleHostV6556');
    const titleText = canonicalTitle(component,title);
    let button = title.querySelector(':scope > .cdaDashboardTitleToggleV6555');

    if (!button) {
      button = document.createElement('button');
      button.type = 'button';
      button.className = 'cdaDashboardTitleToggleV6555';
      const chevron = document.createElement('span');
      chevron.className = 'cdaDashboardTitleChevronV6555';
      chevron.setAttribute('aria-hidden','true');
      const text = document.createElement('span');
      text.className = 'cdaDashboardTitleTextV6555';
      button.append(chevron,text);

    if (text) text.textContent = titleText.replace(ARROW_REPLACE_PATTERN_V6556,'').trim();

    title.replaceChildren(button);
    bind(button,tab,component,card);
    sync(runtimeContext(tab,component,button,null,card),button);
    return button;
  }

  function syncAll(tabKey){
    const tab = platform.getTab(tabKey);
    if (!tab) return;
    tab.components.forEach(function(component){
      if ((component.features || []).indexOf('collapse') < 0) return;
      const card = window.cdaDashboardCatalogV6555 ? window.cdaDashboardCatalogV6555.resolveCard(tab.key,component.key) : null;
      if (card) mount(tab.key,component.key,card);
    });
  }

  function inspect(button){
    const text = button && button.querySelector('.cdaDashboardTitleTextV6555');
    const chevrons = button ? button.querySelectorAll('.cdaDashboardTitleChevronV6555') : [];
    return {chevronCount:chevrons.length,text:text ? text.textContent.trim() : '',textContainsArrow:!!(text && ARROW_TEST_PATTERN_V6556.test(text.textContent || ''))};
  }

  window.cdaDashboardTitleToggleV6555 = Object.freeze({
    version:'v6.579',
    runtimeVersion:runtime.version,
    mount:mount,
    sync:sync,
    syncAll:syncAll,
