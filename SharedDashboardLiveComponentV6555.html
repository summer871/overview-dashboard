Version: v6.555
Date: 2026-07-29
Purpose: Open the same dashboard application in an isolated live-component window; never serialize charts or tables.
-->
<style id="cdaSharedDashboardLiveComponentStylesV6555">

  html.cdaLiveComponentWindowV6555 body {
    width:100%!important;
    min-width:0!important;
    min-height:100%!important;
    margin:0!important;
    overflow:auto!important;
    background:var(--cda-color-page)!important;
  }
  html.cdaLiveComponentWindowV6555 .managerTabs,
  html.cdaLiveComponentWindowV6555 #remakeTabFilterHostV6337,
  html.cdaLiveComponentWindowV6555 #tatTabFilterHostV6509,
  html.cdaLiveComponentWindowV6555 .remakeStickyTopV6245,
  html.cdaLiveComponentWindowV6555 .tatKpiStageV6509,
  html.cdaLiveComponentWindowV6555 #remakePillsV6230,
  html.cdaLiveComponentWindowV6555 #tatPillsV6509,
  html.cdaLiveComponentWindowV6555 #tatNoticeV6509,
  html.cdaLiveComponentWindowV6555 #tatCoverageV6509,
  html.cdaLiveComponentWindowV6555 #cdaSharedAppFooterV6531 {

  html.cdaLiveComponentWindowV6555 [data-cda-live-component-page="true"] .remakeShellV6230,

    width:100%!important;

  html.cdaLiveComponentWindowV6555 [data-cda-live-component-page="true"] .remakeGrid,
  html.cdaLiveComponentWindowV6555 [data-cda-live-component-page="true"] .remakeGridV6230,
  html.cdaLiveComponentWindowV6555 [data-cda-live-component-page="true"] .tatGridV6509 {

  html.cdaLiveComponentWindowV6555 [data-cda-live-component-page="true"] .remakeCard,

  html.cdaLiveComponentWindowV6555 [data-cda-live-component-card="true"] .remakeTableWrap,

  html.cdaLiveComponentWindowV6555 [data-cda-live-component-card="true"] .remakeTrendCanvasWrapV6230 {

  .cdaLiveComponentErrorV6555 {
    margin:20px;
    padding:16px;
    border:1px solid var(--cda-color-border-strong);
    border-radius:var(--cda-radius-card);

    font:700 13px/1.45 var(--cda-font-ui);
  }
</style>
<script id="cdaSharedDashboardLiveComponentControllerV6555">
(function installSharedDashboardLiveComponentV6555(){
  'use strict';

  if (window.cdaDashboardLiveComponentV6555) return;

  const PARAM_V6555 = 'component';
  const WINDOW_PARAM_V6555 = 'componentWindow';

  function routeV6555(){
    try {
      const params = new URLSearchParams(window.location.search || '');
      const raw = String(params.get(PARAM_V6555) || '').trim();
      const parts = raw.split('.');
      return {
        active:params.get(WINDOW_PARAM_V6555) === '1' && parts.length === 2 && !!parts[0] && !!parts[1],
        id:raw,
        tabKey:parts[0] || '',
        componentKey:parts[1] || ''
      };
    } catch (error) {
      return {active:false,id:'',tabKey:'',componentKey:''};
    }
  }

  function urlV6555(tabKey,componentKey){
    const url = new URL(window.location.href);
    url.searchParams.delete('debug');
    url.searchParams.set('presentation','all');
    url.searchParams.set(PARAM_V6555,String(tabKey) + '.' + String(componentKey));
    url.searchParams.set(WINDOW_PARAM_V6555,'1');
    return url.toString();
  }

  function openV6555(context){
    if (!context || !context.tab || !context.component) return false;
    const catalog = window.cdaDashboardCatalogV6555;
    if (!catalog || !catalog.component(context.tab.key,context.component.key)) return false;
    const popup = window.open(
      urlV6555(context.tab.key,context.component.key),
      'cdaLiveComponent_' + context.tab.key + '_' + context.component.key,
      'width=1280,height=820,resizable=yes,scrollbars=yes'
    );
    return !!popup;
  }

  function activateTabV6555(route){
    const tab = window.cdaDashboardCatalogV6555 && window.cdaDashboardCatalogV6555.tab(route.tabKey);
    const buttonId = tab && tab.tabButtonId;
    const fallbackId = route.tabKey === 'tat' ? 'tatTabBtnV6509' : 'remakeFactorTabBtn';
    const button = document.getElementById(buttonId || fallbackId);
    if (button && typeof button.click === 'function') button.click();
  }

  function failV6555(message){
    document.documentElement.classList.add('cdaLiveComponentWindowV6555');
    const error = document.createElement('div');
    error.className = 'cdaLiveComponentErrorV6555';
    error.textContent = message;
    document.body.appendChild(error);
  }

  function isolateV6555(route){
    const catalog = window.cdaDashboardCatalogV6555;
    if (!catalog) {
      window.setTimeout(function(){ isolateV6555(route); },40);
      return;
    }
    activateTabV6555(route);
    catalog.waitFor(route.tabKey,route.componentKey,{timeoutMs:30000}).then(function(result){
      const descriptor = result.descriptor;
      const card = result.card;
      const page = document.getElementById(descriptor.pageId);
      if (!card || !page) throw new Error('The live component card or page is missing.');

      catalog.stamp(catalog.tab(route.tabKey),catalog.component(route.tabKey,route.componentKey),card);
      document.documentElement.classList.add('cdaLiveComponentWindowV6555');
      document.documentElement.setAttribute('data-cda-live-component-id',route.id);
      page.setAttribute('data-cda-live-component-page','true');
      card.setAttribute('data-cda-live-component-card','true');
      document.title = descriptor.title;

      window.requestAnimationFrame(function(){
        window.dispatchEvent(new Event('resize'));
        const chart = card.querySelector && card.querySelector('canvas');
        try {
          const instance = window.Chart && typeof window.Chart.getChart === 'function' && chart
            ? window.Chart.getChart(chart)
            : null;
          if (instance && typeof instance.resize === 'function') instance.resize();
        } catch (error) {}
      });
    }).catch(function(error){
      failV6555(error && error.message ? error.message : String(error));
    });
  }

  function startV6555(){
    const route = routeV6555();
    if (route.active) isolateV6555(route);
  }

  window.cdaDashboardLiveComponentV6555 = Object.freeze({
    version:'v6.555',
    mode:'same-application-live-component-window',
    route:routeV6555,
    url:urlV6555,
    open:openV6555,
    isolate:isolateV6555
  });

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded',startV6555,{once:true});
  } else {
    startV6555();
  }
})();
</script>
