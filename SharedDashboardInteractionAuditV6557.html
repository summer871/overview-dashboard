<script id="cdaSharedDashboardInteractionAuditControllerV6557">
(function installSharedDashboardInteractionAuditV6557(){
  'use strict';

  const baseAuditService = window.cdaDashboardAuditV6550;
  if (!baseAuditService || typeof baseAuditService.audit !== 'function') {
    throw new Error('Base dashboard audit must load before interaction audit.');
  }
  if (baseAuditService.version === 'v6.557') return;

  function visible(node){
    if (!node || !window.getComputedStyle) return false;
    const style = window.getComputedStyle(node);
    return !node.hidden && style.display !== 'none' && style.visibility !== 'hidden' && style.opacity !== '0';
  }

  function remakePointerHosts(){
    const page = document.getElementById('remakeFactorPage');
    const failures = [];
    if (!page) return {ok:false,failures:[{reason:'remake-page-missing'}]};

    page.querySelectorAll('.cdaDashboardToolbarV6547').forEach(function(toolbar){
      const host = toolbar.parentElement;
      const header = host && host.parentElement;
      const style = host && window.getComputedStyle ? window.getComputedStyle(host) : null;
      const directSharedHost = !!(host && host.matches('.cdaDashboardDecoratedActionsV6548[data-cda-dashboard-shared-host="true"]'));
      const directHeaderChild = !!(header && header.matches('.remakeCardHeader') && host.parentElement === header);
      const pointerEnabled = !!(style && style.pointerEvents !== 'none' && style.visibility !== 'hidden' && style.display !== 'none');
      if (!directSharedHost || !directHeaderChild || !pointerEnabled || !visible(toolbar)) {
        failures.push({
          component:toolbar.getAttribute('data-cda-dashboard-toolbar') || '',
          directSharedHost:directSharedHost,
          directHeaderChild:directHeaderChild,
          pointerEvents:style ? style.pointerEvents : '',
          visible:visible(toolbar)
        });
      }
    });

    return {ok:failures.length === 0,failures:failures};
  }

  function sameBuildPopout(){
    const service = window.cdaDashboardPopoutV6548;
    const isolation = window.cdaDashboardIsolationV6555;
    const testUrl = isolation && typeof isolation.buildUrl === 'function'
      ? isolation.buildUrl('tat','monthly')
      : '';
    const routePresent = /(?:[?&#]|%23)component=(?:tat(?:\.|%2E)monthly)/i.test(testUrl);
    const supportedUrl = /^https:\/\//i.test(testUrl);
    return {
      serviceVersion:service && service.version,
      isolationVersion:isolation && isolation.version,
      mode:service && service.mode,
      testUrl:testUrl,
      routePresent:routePresent,
      supportedUrl:supportedUrl,
      ok:!!service && service.version === 'v6.557' &&
        service.mode === 'same-build-live-component' &&
        !!isolation && isolation.version === 'v6.557' &&
        supportedUrl && routePresent
    };
  }

  function baseBehaviorOk(base){
    const checks = [
      base.componentCatalog,
      base.titleSideCollapse,
      base.iconOwnership,
      base.everyFeatureInstanceStyleParity,
      base.toolbarActionOrder,
      base.visibleLegacyHeaderActions,
      base.remakeVisibleCardCoverage,
      base.kpiOverflowParity,
      base.oneToolbarOwnerPerCard,
      base.themeCssVariablesPresent
    ];
    return checks.every(function(check){ return !!(check && check.ok); });
  }

  function audit(){
    const base = baseAuditService.audit();
    const pointerHosts = remakePointerHosts();
    const popout = sameBuildPopout();
    const services = Object.assign({},base.services || {},{
      isolation:window.cdaDashboardIsolationV6555 && window.cdaDashboardIsolationV6555.version,
      popout:window.cdaDashboardPopoutV6548 && window.cdaDashboardPopoutV6548.version,
      adapter:window.cdaRemakeDashboardAdapterV6548 && window.cdaRemakeDashboardAdapterV6548.version
    });
    const serviceVersionsCorrect = !!(
      services.theme === 'v6.550' && services.columns === 'v6.550' &&
      services.popover === 'v6.550' && services.toolbar === 'v6.554' &&
      services.bridge === 'v6.555' && services.catalog === 'v6.555' &&
      services.isolation === 'v6.557' && services.popout === 'v6.557' &&
      services.titleToggle === 'v6.556' && services.adapter === 'v6.557'
    );
    return Object.assign({},base,{
      version:'v6.557',
      services:services,
      serviceVersionsCorrect:serviceVersionsCorrect,
      remakePointerHosts:pointerHosts,
      sameBuildPopout:popout,
      livePopoutContract:popout,
      ok:serviceVersionsCorrect && baseBehaviorOk(base) && pointerHosts.ok && popout.ok
    });
  }

  window.cdaDashboardAuditV6550 = Object.freeze({
    version:'v6.557',
    visible:baseAuditService.visible,
    styleSignature:baseAuditService.styleSignature,
    expectedIconName:baseAuditService.expectedIconName,
    audit:audit,
    remakePointerHosts:remakePointerHosts,
    sameBuildPopout:sameBuildPopout
  });
})();
</script>
