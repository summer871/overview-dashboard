</style>
<script id="cdaRemakeTechnicianReconciliationControllerV6568">
(function installRemakeTechnicianReconciliationV6568(){
  'use strict';

  const VERSION = 'v6.567.1';
  const CARD_ID = 'remakeCeramistCardV6342';
  const TABLE_ID = 'remakeCeramistTableV6342';
  const HOST_SELECTOR = '.ceramistPreviewKpisV6342';
  let frame = 0;
  let observer = null;
  let observedCard = null;

  if (window.cdaRemakeTechnicianReconciliationV6568 &&
      window.cdaRemakeTechnicianReconciliationV6568.version === VERSION) return;

  function clean(value){
    return String(value == null ? '' : value).replace(/\s+/g,' ').trim();
  }

  function number(value){
    const match = clean(value).replace(/[$,%]/g,'').replace(/,/g,'').match(/-?\d+(?:\.\d+)?/);
    return match ? Number(match[0]) : NaN;
  }

  function finite(value){ return Number.isFinite(value) ? value : 0; }

  function percent(numerator,denominator){
    return Number.isFinite(numerator) && Number.isFinite(denominator) && denominator > 0
      ? numerator / denominator * 100
      : 0;
  }

  function formatWhole(value){
    return Math.round(finite(value)).toLocaleString();
  }

  function formatOne(value){
    return finite(value).toLocaleString(undefined,{minimumFractionDigits:1,maximumFractionDigits:1});
  }

  function formatPercent(value){
    return finite(value).toLocaleString(undefined,{minimumFractionDigits:1,maximumFractionDigits:1}) + '%';
  }

  function formatCurrency(value){
    return finite(value).toLocaleString(undefined,{style:'currency',currency:'USD',maximumFractionDigits:0});
  }

  function card(){ return document.getElementById(CARD_ID); }
  function table(){ return document.getElementById(TABLE_ID); }

  function topValue(id){
    const node = document.getElementById(id);
    return number(node && node.textContent);
  }

  function headerIndexes(target){
    const headers = Array.from(target && target.querySelectorAll('thead th') || []).map(function(header){
      return clean(header.textContent).toLowerCase();
    });
    function index(patterns){
      return headers.findIndex(function(header){
        return patterns.some(function(pattern){ return pattern.test(header); });
      });
    }
    return {
      cases:index([/rmk cases/,/remake cases/,/^cases$/]),
      units:index([/rmk units/,/remake units/]),
      discount:index([/rmk disc/,/remake disc/,/discount/])
    };
  }

  function attributedTotals(){
    const target = table();
    if (!target) return {rows:0,cases:0,units:0,discount:0};
    const indexes = headerIndexes(target);
    const totals = {rows:0,cases:0,units:0,discount:0};
    Array.from(target.querySelectorAll('tbody tr')).forEach(function(row){
      const cells = Array.from(row.cells || []);
      if (!cells.length) return;
      if (cells.some(function(cell){ return Number(cell.colSpan || 1) > 1; })) return;
      if (/section|divider|group/i.test(String(row.className || ''))) return;
      const cases = indexes.cases >= 0 ? number(cells[indexes.cases] && cells[indexes.cases].textContent) : NaN;
      const units = indexes.units >= 0 ? number(cells[indexes.units] && cells[indexes.units].textContent) : NaN;
      const discount = indexes.discount >= 0 ? number(cells[indexes.discount] && cells[indexes.discount].textContent) : NaN;
      if (!Number.isFinite(cases) && !Number.isFinite(units) && !Number.isFinite(discount)) return;
      totals.rows += 1;
      totals.cases += finite(cases);
      totals.units += finite(units);
      totals.discount += finite(discount);
    });
    return totals;
  }

  function snapshot(){
    const attributed = attributedTotals();
    const remakeCases = topValue('remakeCases');
    const remakeUnits = topValue('remakeUnits');
    return {
      remakeCases:finite(remakeCases),
      attributedCases:attributed.cases,
      unattributedCases:Math.max(0,finite(remakeCases) - attributed.cases),
      caseCoverage:percent(attributed.cases,remakeCases),
      remakeUnits:finite(remakeUnits),
      attributedUnits:attributed.units,
      unattributedUnits:Math.max(0,finite(remakeUnits) - attributed.units),
      unitCoverage:percent(attributed.units,remakeUnits),
      attributedDiscount:attributed.discount,
      workerRows:attributed.rows
    };
  }

  function kpi(doc,key,label,value,title){
    const item = doc.createElement('div');
    item.className = 'ceramistPreviewKpiV6342 cdaTechReconciliationKpiV6568';
    item.setAttribute('data-cda-tech-kpi-v6568',key);
    item.title = title;
    const labelNode = doc.createElement('div');
    labelNode.className = 'label';
    labelNode.textContent = label;
    const valueNode = doc.createElement('div');
    valueNode.className = 'value';
    valueNode.textContent = value;
    item.appendChild(labelNode);
    item.appendChild(valueNode);
    return item;
  }

  function disconnect(){
    if (observer) observer.disconnect();
  }

  function reconnect(targetCard){
    if (!targetCard || typeof MutationObserver !== 'function') return;
    if (!observer) observer = new MutationObserver(function(){ schedule(); });
    observer.disconnect();
    observer.observe(targetCard,{childList:true,subtree:true,characterData:true});
    observedCard = targetCard;
  }

  function render(){
    frame = 0;
    const targetCard = card();
    const host = targetCard && targetCard.querySelector(HOST_SELECTOR);
    if (!targetCard || !host || !table()) return false;
    const data = snapshot();
    if (!data.remakeCases && !data.attributedCases) return false;

    disconnect();
    try {
      const doc = host.ownerDocument || document;
      const fragment = doc.createDocumentFragment();
      fragment.appendChild(kpi(doc,'remakeCases','Remake Cases',formatWhole(data.remakeCases),'All remake cases in the active dashboard filters.'));
      fragment.appendChild(kpi(doc,'attributedCases','Attributed Cases',formatWhole(data.attributedCases),'Remake cases represented in the responsible-worker table.'));
      fragment.appendChild(kpi(doc,'caseCoverage','Case Coverage',formatPercent(data.caseCoverage),formatWhole(data.attributedCases) + ' of ' + formatWhole(data.remakeCases) + ' remake cases have worker attribution.'));
      fragment.appendChild(kpi(doc,'attributedUnits','Attributed Units',formatOne(data.attributedUnits),'Remake units represented in the responsible-worker table.'));
      fragment.appendChild(kpi(doc,'unitCoverage','Unit Coverage',formatPercent(data.unitCoverage),formatOne(data.attributedUnits) + ' of ' + formatOne(data.remakeUnits) + ' remake units have worker attribution.'));
      fragment.appendChild(kpi(doc,'attributedDiscount','Attributed Discount',formatCurrency(data.attributedDiscount),'Discount represented by the responsible-worker rows.'));
      host.replaceChildren(fragment);
      host.setAttribute('data-cda-tech-reconciled-v6568','true');
      host.setAttribute('aria-label','Technician attribution reconciliation');
      targetCard.setAttribute('data-cda-tech-reconciliation-v6568',VERSION);
      window.CDA_REMAKE_TECHNICIAN_RECONCILIATION_VERSION = VERSION;
    } finally {
      reconnect(targetCard);
    }
    return true;
  }

  function schedule(){
    if (frame) return;
    frame = window.requestAnimationFrame(render);
  }

  function audit(){
    const data = snapshot();
    const targetCard = card();
    const host = targetCard && targetCard.querySelector(HOST_SELECTOR);
    const labels = host ? Array.from(host.querySelectorAll('.label')).map(function(node){ return clean(node.textContent); }) : [];
    const expectedCaseCoverage = percent(data.attributedCases,data.remakeCases);
    const expectedUnitCoverage = percent(data.attributedUnits,data.remakeUnits);
    const result = {
      version:VERSION,
      remakeCases:data.remakeCases,
      attributedCases:data.attributedCases,
      unattributedCases:data.unattributedCases,
      caseCoverage:Number(data.caseCoverage.toFixed(1)),
      remakeUnits:Number(data.remakeUnits.toFixed(1)),
      attributedUnits:Number(data.attributedUnits.toFixed(1)),
      unattributedUnits:Number(data.unattributedUnits.toFixed(1)),
      unitCoverage:Number(data.unitCoverage.toFixed(1)),
      workerRows:data.workerRows,
      labelsPresent:['Remake Cases','Attributed Cases','Case Coverage','Attributed Units','Unit Coverage','Attributed Discount'].every(function(label){ return labels.indexOf(label) >= 0; }),
      caseFormulaCorrect:Math.abs(data.caseCoverage - expectedCaseCoverage) < 0.001,
      unitFormulaCorrect:Math.abs(data.unitCoverage - expectedUnitCoverage) < 0.001,
      oldMisleadingAttributionRemoved:labels.indexOf('Attribution') < 0,
      ok:false
    };
    result.ok = result.labelsPresent && result.caseFormulaCorrect && result.unitFormulaCorrect && result.oldMisleadingAttributionRemoved;
    return result;
  }

  function start(){
    render();
    document.addEventListener('change',function(event){
      if (event.target && event.target.closest && event.target.closest('#remakeFactorPage,#remakeTabFilterHostV6337')) window.setTimeout(schedule,0);
    },true);
    document.addEventListener('click',function(event){
      if (event.target && event.target.closest && event.target.closest('#remakeFactorPage,#remakeTabFilterHostV6337')) window.setTimeout(schedule,0);
    },true);
    window.addEventListener('pageshow',schedule);
    window.setTimeout(schedule,300);
    window.setTimeout(schedule,1200);
  }

  window.cdaRemakeTechnicianReconciliationV6568 = Object.freeze({
    version:VERSION,
    render:render,
    snapshot:snapshot,
    audit:audit
  });

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded',start,{once:true});
  else start();
})();
</script>
