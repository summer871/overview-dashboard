<script id="cdaSharedTableEngineV6538">
(function installCdaSharedTableEngineV6538(){
  'use strict';

  /* ==================================================================
   * SharedTableEngine v6.538
   *
   * WHY THIS EXISTS
   *   Remake tables have sorting and a column chooser. TAT tables had
   *   neither. Remake's implementation cannot be reused because it builds
   *   its own <thead> in JavaScript and sorts data objects held in
   *   uiV6230.lastTables, while TAT hard-codes its <thead> as an HTML string
   *   and discards its row objects after render. The column chooser is not
   *   even in a shared file, it lives inside Index.html scoped to
   *   #remakeFactorPage, so no other tab can ever see it.
   *
   *   This engine works on the RENDERED DOM instead. Any table that is
   *   <table class="remakeTable"> gets sorting and a column chooser with
   *   zero renderer changes, including tabs that do not exist yet.
   *
   * WHAT IT DOES NOT TOUCH
   *   Remake's own sort engine. Any <th> already carrying .sortableV6230 is
   *   skipped entirely, so Remake behaviour is unchanged by this file.
   *
   * ==================================================================
   * PER-TABLE OVERRIDES - put these on the <table> element
   * ==================================================================
   *
   *   data-cda-sortable="0"          opt out of sorting completely
   *   data-cda-columns="0"           opt out of the column chooser
   *   data-cda-default-sort="3:desc" first-load sort, index or column name
   *   data-cda-sort-skip-rows="a,b"  rows that travel with the row above
   *   data-cda-sort-pin-rows="a,b"   rows always pinned to the top
   *   data-cda-persist="0"           do not remember sort or hidden columns
   *   data-cda-row-limit="500"       declared limit, enforced in a later phase
   *
   * PER-COLUMN OVERRIDES - put these on a <th>
   *
   *   data-cda-col="cases"           stable name, used for persistence
   *   data-cda-type="text|number|percent|currency|date"
   *   data-cda-sortable="0"          this one column is not sortable
   *   data-cda-sort-dir="asc"        first click sorts ascending
   *   data-cda-lock="1"              cannot be hidden by the column chooser
   *
   *   When data-cda-type is absent the engine sniffs the column from its own
   *   cells, which is why TAT's hard-coded headers work with no edits.
   *   Column 0 is always locked, a table with no first column is unreadable.
   *
   * TAB HOOK
   *   After a tab rewrites a tbody it should fire:
   *     document.dispatchEvent(new CustomEvent('cda:table-rendered',
   *       { detail: { tableId: 'tatCustomerTableV6509' } }))
   *   A MutationObserver is also present as a safety net.
   * ================================================================== */

  var VERSION = 'v6.538';
  var SORT_KEY = 'cdaSharedTableSort.v6536';
  var COLS_KEY = 'cdaSharedTableCols.v6538';
  var TABLE_SELECTOR = 'table.remakeTable, table[data-cda-table]';

  var DEFAULT_SKIP_ROW_CLASSES = ['tatProductDetailRowV6523','ceramistSectionRowV6348','ceramistDetailRowV6368','cdaAttachedRowV6536'];
  var DEFAULT_PIN_ROW_CLASSES = ['selectedV6230','selectedPinnedV6311','ceramistPinnedWorkerV6361'];

  var state = window.cdaSharedTableEngineStateV6538 = window.cdaSharedTableEngineStateV6538 || { sorts:{}, cols:{}, wired:new WeakSet(), colsWired:new WeakSet(), observing:false };

  function readStore(key){ try { return JSON.parse(localStorage.getItem(key) || '{}') || {}; } catch (e) { return {}; } }
  function writeStore(key, value){ try { localStorage.setItem(key, JSON.stringify(value || {})); } catch (e) {} }
  if (!state.loadedStore) { state.sorts = readStore(SORT_KEY); state.cols = readStore(COLS_KEY); state.loadedStore = true; }

  function attr(el, name, fallback){
    if (!el) return fallback;
    var v = el.getAttribute(name);
    return v === null || v === '' ? fallback : v;
  }
  function tableKey(table){ return attr(table, 'data-cda-table', '') || table.id || ''; }
  function classList(v){ return String(v || '').split(',').map(function(s){ return s.trim(); }).filter(Boolean); }
  function headerCells(table){
    var head = table.tHead;
    if (!head || !head.rows.length) return [];
    return Array.prototype.slice.call(head.rows[head.rows.length - 1].cells);
  }
  function bodyRows(table){
    var body = table.tBodies && table.tBodies[0];
    return body ? Array.prototype.slice.call(body.rows) : [];
  }
  function columnName(th, index){ return attr(th, 'data-cda-col', '') || ('col' + index); }
  function headerLabel(th){
    var clone = th.cloneNode(true);
    Array.prototype.forEach.call(clone.querySelectorAll('.cdaSortGlyphV6536, .sortGlyphV6230'), function(n){ n.remove(); });
    return String(clone.textContent || '').replace(/\s+/g, ' ').trim();
  }
  function remakeOwned(table){
    return headerCells(table).some(function(th){ return th.classList.contains('sortableV6230'); });
  }

  /* ---- value parsing --------------------------------------------------- */

  function cellText(row, index){
    var cell = row.children && row.children[index];
    return cell ? String(cell.textContent || '').trim() : '';
  }
  var NUMERIC_RE = /^[\s$\u00a3\u20ac(]*-?[\d,]+(?:\.\d+)?\)?%?\s*$/;
  function parseNumeric(text){
    if (text === '' || text === '-' || text === '\u2013' || /^n\/a$/i.test(text)) return null;
    var clean = String(text).replace(/[\s,$\u00a3\u20ac%]/g, '');
    var negative = false;
    if (/^\(.*\)$/.test(clean)) { negative = true; clean = clean.slice(1, -1); }
    if (clean.charAt(0) === '-') { negative = true; clean = clean.slice(1); }
    if (clean === '' || !/^\d*\.?\d+$/.test(clean)) return null;
    var value = parseFloat(clean);
    if (!isFinite(value)) return null;
    return negative ? -value : value;
  }
  function parseDate(text){
    if (!text) return null;
    var ms = Date.parse(text);
    return isFinite(ms) ? ms : null;
  }
  function sniffType(rows, index){
    var numeric = 0, dated = 0, seen = 0;
    for (var i = 0; i < rows.length && seen < 12; i++) {
      var text = cellText(rows[i], index);
      if (!text || text === '-') continue;
      seen++;
      if (NUMERIC_RE.test(text)) numeric++;
      else if (parseDate(text) !== null && /\d{4}|\d\/\d/.test(text)) dated++;
    }
    if (!seen) return 'text';
    if (numeric / seen >= 0.6) return 'number';
    if (dated / seen >= 0.6) return 'date';
    return 'text';
  }
  function valueFor(row, index, type){
    var text = cellText(row, index);
    if (type === 'number' || type === 'percent' || type === 'currency') return parseNumeric(text);
    if (type === 'date') return parseDate(text);
    return String(text).toLowerCase();
  }

  /* ---- sorting --------------------------------------------------------- */

  function buildGroups(rows, skipClasses){
    var groups = [];
    rows.forEach(function(row){
      var attached = skipClasses.some(function(name){ return row.classList.contains(name); });
      if (attached && groups.length) { groups[groups.length - 1].extras.push(row); return; }
      groups.push({ lead: row, extras: [] });
    });
    return groups;
  }

  var reordering = false;

  function applySort(table, spec, persist){
    if (!table || !spec) return;
    var body = table.tBodies && table.tBodies[0];
    if (!body) return;
    var rows = bodyRows(table);
    if (rows.length < 2) { paintGlyphs(table, spec); return; }
    if (rows[0].cells.length === 1 && rows[0].cells[0].hasAttribute('colspan')) { paintGlyphs(table, spec); return; }

    var headers = headerCells(table);
    var th = headers[spec.index];
    var type = attr(th, 'data-cda-type', '') || sniffType(rows, spec.index);
    var skipClasses = classList(attr(table, 'data-cda-sort-skip-rows', DEFAULT_SKIP_ROW_CLASSES.join(',')));
    var pinClasses = classList(attr(table, 'data-cda-sort-pin-rows', DEFAULT_PIN_ROW_CLASSES.join(',')));
    var groups = buildGroups(rows, skipClasses);
    var direction = spec.dir === 'asc' ? 1 : -1;

    var decorated = groups.map(function(group, position){
      return {
        group: group,
        position: position,
        pinned: pinClasses.some(function(name){ return group.lead.classList.contains(name); }),
        value: valueFor(group.lead, spec.index, type)
      };
    });

    decorated.sort(function(a, b){
      if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
      var av = a.value, bv = b.value;
      var aEmpty = av === null || av === undefined || av === '';
      var bEmpty = bv === null || bv === undefined || bv === '';
      if (aEmpty && bEmpty) return a.position - b.position;
      if (aEmpty) return 1;
      if (bEmpty) return -1;
      if (typeof av === 'string' || typeof bv === 'string') {
        return (String(av).localeCompare(String(bv), undefined, { numeric: true, sensitivity: 'base' }) * direction) || (a.position - b.position);
      }
      if (av === bv) return a.position - b.position;
      return (av - bv) * direction;
    });

    reordering = true;
    try {
      var fragment = document.createDocumentFragment();
      decorated.forEach(function(item){
        fragment.appendChild(item.group.lead);
        item.group.extras.forEach(function(extra){ fragment.appendChild(extra); });
      });
      body.appendChild(fragment);
    } finally {
      window.setTimeout(function(){ reordering = false; }, 0);
    }

    paintGlyphs(table, spec);

    if (persist && attr(table, 'data-cda-persist', '1') !== '0') {
      var key = tableKey(table);
      if (key) { state.sorts[key] = { col: spec.col, index: spec.index, dir: spec.dir }; writeStore(SORT_KEY, state.sorts); }
    }
  }

  function paintGlyphs(table, spec){
    headerCells(table).forEach(function(th, index){
      if (!th.classList.contains('cdaSortV6536')) return;
      var glyph = th.querySelector('.cdaSortGlyphV6536');
      if (!glyph) return;
      if (spec && index === spec.index) {
        glyph.innerHTML = spec.dir === 'asc' ? '&#9650;' : '&#9660;';
        th.setAttribute('data-cda-sort-active', '1');
        th.setAttribute('aria-sort', spec.dir === 'asc' ? 'ascending' : 'descending');
      } else {
        glyph.innerHTML = '';
        th.removeAttribute('data-cda-sort-active');
        th.removeAttribute('aria-sort');
      }
    });
  }

  function resolveDefault(table, headers){
    var raw = attr(table, 'data-cda-default-sort', '');
    if (!raw) return null;
    var parts = String(raw).split(':');
    var target = parts[0].trim();
    var dir = (parts[1] || 'desc').trim() === 'asc' ? 'asc' : 'desc';
    var index = -1;
    if (/^\d+$/.test(target)) index = Number(target);
    else headers.forEach(function(th, i){ if (attr(th, 'data-cda-col', '') === target) index = i; });
    if (index < 0 || index >= headers.length) return null;
    return { index: index, dir: dir, col: columnName(headers[index], index) };
  }

  function wireSort(table){
    if (!table || state.wired.has(table)) return;
    if (attr(table, 'data-cda-sortable', '1') === '0') return;
    var headers = headerCells(table);
    if (!headers.length) return;
    if (remakeOwned(table)) { state.wired.add(table); return; }
    state.wired.add(table);

    headers.forEach(function(th, index){
      if (attr(th, 'data-cda-sortable', '1') === '0') return;
      th.classList.add('cdaSortV6536');
      if (!th.querySelector('.cdaSortGlyphV6536')) {
        var glyph = document.createElement('span');
        glyph.className = 'cdaSortGlyphV6536';
        glyph.setAttribute('aria-hidden', 'true');
        th.appendChild(glyph);
      }
      th.setAttribute('title', 'Sort by ' + (headerLabel(th) || ('column ' + (index + 1))));
      th.addEventListener('click', function(){
        var current = state.sorts[tableKey(table)];
        var dir = attr(th, 'data-cda-sort-dir', '') === 'asc' ? 'asc' : 'desc';
        if (current && Number(current.index) === index) dir = current.dir === 'desc' ? 'asc' : 'desc';
        applySort(table, { index: index, dir: dir, col: columnName(th, index) }, true);
      });
    });

    var remembered = state.sorts[tableKey(table)];
    if (remembered) {
      var index = Number(remembered.index);
      if (remembered.col) headers.forEach(function(th, i){ if (attr(th, 'data-cda-col', '') === remembered.col) index = i; });
      if (index >= 0 && index < headers.length) {
        applySort(table, { index: index, dir: remembered.dir, col: remembered.col || columnName(headers[index], index) }, false);
        return;
      }
    }
    var fallback = resolveDefault(table, headers);
    if (fallback) applySort(table, fallback, false);
  }

  function reapplySort(table){
    var remembered = state.sorts[tableKey(table)];
    if (!remembered) return;
    var headers = headerCells(table);
    if (!headers.length || remakeOwned(table)) return;
    var index = Number(remembered.index);
    if (remembered.col) headers.forEach(function(th, i){ if (attr(th, 'data-cda-col', '') === remembered.col) index = i; });
    if (index < 0 || index >= headers.length) return;
    applySort(table, { index: index, dir: remembered.dir, col: remembered.col || columnName(headers[index], index) }, false);
  }

  /* ---- column chooser -------------------------------------------------- */

  function hiddenSet(table){
    var key = tableKey(table);
    var list = key && state.cols[key];
    return new Set(Array.isArray(list) ? list.map(String) : []);
  }
  function saveHidden(table, set){
    var key = tableKey(table);
    if (!key || attr(table, 'data-cda-persist', '1') === '0') return;
    if (set.size) state.cols[key] = Array.from(set);
    else delete state.cols[key];
    writeStore(COLS_KEY, state.cols);
  }
  function isLocked(th, index){ return index === 0 || attr(th, 'data-cda-lock', '0') === '1'; }

  function applyColumns(table){
    var headers = headerCells(table);
    if (!headers.length) return;
    var hidden = hiddenSet(table);
    var hideIndexes = [];
    headers.forEach(function(th, index){
      if (isLocked(th, index)) return;
      if (hidden.has(columnName(th, index))) hideIndexes.push(index);
    });

    reordering = true;
    try {
      headers.forEach(function(th, index){
        th.style.display = hideIndexes.indexOf(index) >= 0 ? 'none' : '';
      });
      Array.prototype.forEach.call(table.rows, function(row){
        if (row.parentNode === table.tHead) return;
        Array.prototype.forEach.call(row.cells, function(cell, index){
          if (cell.hasAttribute('colspan')) return;
          cell.style.display = hideIndexes.indexOf(index) >= 0 ? 'none' : '';
        });
      });
    } finally {
      window.setTimeout(function(){ reordering = false; }, 0);
    }

    var button = table.$cdaColsButtonV6538;
    if (button) button.setAttribute('data-cda-hidden-count', String(hideIndexes.length));
  }

  function popover(){
    var node = document.getElementById('cdaColsPopoverV6538');
    if (node) return node;
    node = document.createElement('div');
    node.id = 'cdaColsPopoverV6538';
    node.setAttribute('role', 'dialog');
    node.setAttribute('aria-label', 'Choose columns');
    node.innerHTML = '<div class="cdaColsHeadV6538"><div><div class="cdaColsTitleV6538">Columns</div><div class="cdaColsHintV6538">Hide columns you do not need. The first column always stays.</div></div><button type="button" class="cdaColsCloseV6538" aria-label="Close">&times;</button></div><div class="cdaColsListV6538"></div><div class="cdaColsFootV6538"><button type="button" data-cda-cols-action="all">Show all</button><button type="button" class="primary" data-cda-cols-action="close">Done</button></div>';
    document.body.appendChild(node);
    node.addEventListener('click', function(event){ event.stopPropagation(); });
    node.querySelector('.cdaColsCloseV6538').addEventListener('click', closePopover);
    node.querySelector('[data-cda-cols-action="close"]').addEventListener('click', closePopover);
    node.querySelector('[data-cda-cols-action="all"]').addEventListener('click', function(){
      var table = node.$table;
      if (!table) return;
      saveHidden(table, new Set());
      applyColumns(table);
      renderPopover(table);
    });
    return node;
  }

  function renderPopover(table){
    var node = popover();
    node.$table = table;
    var list = node.querySelector('.cdaColsListV6538');
    list.innerHTML = '';
    var hidden = hiddenSet(table);
    headerCells(table).forEach(function(th, index){
      var locked = isLocked(th, index);
      var name = columnName(th, index);
      var row = document.createElement('label');
      row.className = 'cdaColsOptionV6538' + (locked ? ' locked' : '');
      var box = document.createElement('input');
      box.type = 'checkbox';
      box.checked = locked || !hidden.has(name);
      box.disabled = locked;
      var text = document.createElement('span');
      text.textContent = headerLabel(th) || ('Column ' + (index + 1));
      row.appendChild(box);
      row.appendChild(text);
      if (locked) {
        var lock = document.createElement('span');
        lock.className = 'cdaColsLockV6538';
        lock.textContent = 'always';
        row.appendChild(lock);
      } else {
        box.addEventListener('change', function(){
          var set = hiddenSet(table);
          if (box.checked) set.delete(name); else set.add(name);
          saveHidden(table, set);
          applyColumns(table);
        });
      }
      list.appendChild(row);
    });
  }

  function openPopover(table, button){
    var node = popover();
    renderPopover(table);
    node.classList.add('open');
    button.setAttribute('aria-expanded', 'true');
    node.$button = button;
    var rect = button.getBoundingClientRect();
    var width = node.offsetWidth || 300;
    var left = Math.min(Math.max(8, rect.right - width), window.innerWidth - width - 8);
    var top = Math.min(rect.bottom + 6, window.innerHeight - (node.offsetHeight || 300) - 8);
    node.style.left = Math.round(left) + 'px';
    node.style.top = Math.round(Math.max(8, top)) + 'px';
  }

  function closePopover(){
    var node = document.getElementById('cdaColsPopoverV6538');
    if (!node) return;
    node.classList.remove('open');
    if (node.$button) node.$button.setAttribute('aria-expanded', 'false');
    node.$table = null;
  }

  function wireColumns(table){
    if (!table || state.colsWired.has(table)) { if (table) applyColumns(table); return; }
    if (attr(table, 'data-cda-columns', '1') === '0') return;
    if (!headerCells(table).length) return;
    /* Remake already has its own Columns button. Do not add a second one. */
    if (remakeOwned(table)) { state.colsWired.add(table); return; }

    var card = table.closest('.remakeCard') || table.closest('.tatCardV6509');
    var actions = card && (card.querySelector('.remakeCardActionsV6230') || card.querySelector('.tatCardActionsV6509'));
    if (!actions) return;
    if (actions.querySelector('.cdaColsButtonV6538')) { state.colsWired.add(table); applyColumns(table); return; }

    state.colsWired.add(table);
    var button = document.createElement('button');
    button.type = 'button';
    button.className = 'cdaColsButtonV6538';
    button.textContent = 'Columns';
    button.setAttribute('aria-expanded', 'false');
    button.setAttribute('title', 'Choose which columns to show');
    button.setAttribute('data-cda-hidden-count', '0');
    button.addEventListener('click', function(event){
      event.stopPropagation();
      var node = document.getElementById('cdaColsPopoverV6538');
      if (node && node.classList.contains('open') && node.$table === table) { closePopover(); return; }
      openPopover(table, button);
    });
    actions.insertBefore(button, actions.firstChild);
    table.$cdaColsButtonV6538 = button;
    applyColumns(table);
  }

  /* ---- lifecycle ------------------------------------------------------- */

  function scan(){
    Array.prototype.forEach.call(document.querySelectorAll(TABLE_SELECTOR), function(table){
      wireSort(table);
      wireColumns(table);
      if (state.wired.has(table)) reapplySort(table);
      applyColumns(table);
    });
  }

  var scanFrame = 0;
  function scheduleScan(){
    if (scanFrame) return;
    scanFrame = window.requestAnimationFrame(function(){ scanFrame = 0; scan(); });
  }

  document.addEventListener('cda:table-rendered', function(event){
    var id = event && event.detail && event.detail.tableId;
    if (!id) { scheduleScan(); return; }
    var element = document.getElementById(id);
    var table = element ? (element.tagName === 'TABLE' ? element : element.closest('table')) : null;
    if (!table) { scheduleScan(); return; }
    wireSort(table);
    wireColumns(table);
    reapplySort(table);
    applyColumns(table);
  });

  function startObserver(){
    if (state.observing || !window.MutationObserver || !document.body) return;
    state.observing = true;
    var observer = new MutationObserver(function(mutations){
      if (reordering) return;
      for (var i = 0; i < mutations.length; i++) {
        var target = mutations[i].target;
        if (target && target.closest && target.closest(TABLE_SELECTOR)) { scheduleScan(); return; }
        var added = mutations[i].addedNodes;
        for (var j = 0; added && j < added.length; j++) {
          var node = added[j];
          if (node && node.nodeType === 1 && ((node.matches && node.matches(TABLE_SELECTOR)) || (node.querySelector && node.querySelector(TABLE_SELECTOR)))) { scheduleScan(); return; }
        }
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });
  }

  function start(){
    window.CDA_SHARED_TABLE_ENGINE_VERSION = VERSION;
    scan();
    startObserver();
    document.addEventListener('click', function(event){
      var tab = event.target && event.target.closest ? event.target.closest('.tabBtn') : null;
      if (tab) window.setTimeout(scheduleScan, 60);
      var node = document.getElementById('cdaColsPopoverV6538');
      if (node && node.classList.contains('open')) {
        var inside = event.target && event.target.closest && (event.target.closest('#cdaColsPopoverV6538') || event.target.closest('.cdaColsButtonV6538'));
        if (!inside) closePopover();
      }
    }, true);
    document.addEventListener('keydown', function(event){ if (event.key === 'Escape') closePopover(); });
    window.addEventListener('resize', function(){ closePopover(); }, { passive: true });
  }

  window.cdaSharedTableEngineV6538 = {
    version: VERSION,
    scan: scan,
    sort: function(tableIdOrKey, columnNameOrIndex, dir){
      var table = document.getElementById(tableIdOrKey) || document.querySelector('[data-cda-table="' + tableIdOrKey + '"]');
      if (!table) return false;
      if (table.tagName !== 'TABLE') table = table.closest('table') || table.querySelector('table');
      if (!table) return false;
      var headers = headerCells(table);
      var index = -1;
      if (/^\d+$/.test(String(columnNameOrIndex))) index = Number(columnNameOrIndex);
      else headers.forEach(function(th, i){ if (attr(th, 'data-cda-col', '') === columnNameOrIndex) index = i; });
      if (index < 0 || index >= headers.length) return false;
      applySort(table, { index: index, dir: dir === 'asc' ? 'asc' : 'desc', col: columnName(headers[index], index) }, true);
      return true;
    },
    clear: function(tableIdOrKey){
      if (tableIdOrKey) { delete state.sorts[tableIdOrKey]; delete state.cols[tableIdOrKey]; }
      else { state.sorts = {}; state.cols = {}; }
      writeStore(SORT_KEY, state.sorts);
      writeStore(COLS_KEY, state.cols);
    },
    state: state
  };
  window.cdaSharedTableEngineV6536 = window.cdaSharedTableEngineV6538;

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start, { once: true });
  else start();
})();
</script>
