<!-- SharedFilterBarStyles.html
Version: v1.0.0
Date: 2026-08-20
Purpose: Shared filter bar CSS. Works with SharedFilterBar.html module.
-->
<style id="cdaSharedFilterBarStyles">
  .cdaFilterBar {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 5px;
    align-items: center;
    width: 100%;
    min-width: 0;
  }

  .cdaFilter {
    position: relative;
    min-width: 0;
    min-height: 32px;
  }

  .cdaFilterButton {
    width: 100%;
    height: 34px;
    border: 1px solid #cbd5e1;
    border-radius: 7px;
    background: #ffffff;
    color: #1f2937;
    font: 800 11.5px/1 Roboto, Arial, sans-serif;
    text-align: left;
    padding: 0 28px 0 10px;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    position: relative;
    transition: border-color 80ms ease;
  }

  .cdaFilterButton::after {
    content: '\25BE';
    position: absolute;
    right: 9px;
    top: 50%;
    transform: translateY(-50%);
    color: #475467;
    font-size: 11px;
    pointer-events: none;
  }

  .cdaFilterButton:hover,
  .cdaFilterButton.active {
    border-color: #94a3b8;
    background: #f8fafc;
  }

  .cdaFilterButton.active {
    box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.10);
  }

  .cdaFilterPanel {
    display: none;
    background: #ffffff;
    border: 1px solid #cbd5df;
    border-radius: 10px;
    box-shadow: 0 18px 38px rgba(16, 24, 40, 0.24);
    overflow: hidden;
  }

  .cdaFilterPanel.open {
    display: block;
  }

  .cdaFilterHeader {
    display: flex;
    gap: 6px;
    align-items: center;
    padding: 7px 8px;
    border-bottom: 1px solid #e5e7eb;
    background: #f8fafc;
    flex-wrap: nowrap;
  }

  .cdaFilterHeader button {
    border: 1px solid #cbd5df;
    background: #ffffff;
    color: #1f2937;
    border-radius: 999px;
    padding: 5px 8px;
    font: 800 11px/1 Roboto, Arial, sans-serif;
    cursor: pointer;
    white-space: nowrap;
    flex: 0 0 auto;
  }

  .cdaFilterHeader button:hover {
    background: #f1f5f9;
    border-color: #94a3b8;
  }

  .cdaFilterVisibleToggle {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    border: 1px solid #cbd5df;
    border-radius: 999px;
    padding: 4px 8px;
    background: #ffffff;
    color: #1f2937;
    font: 800 11px/1 Roboto, Arial, sans-serif;
    cursor: pointer;
    white-space: nowrap;
    flex: 0 0 auto;
  }

  .cdaFilterVisibleToggle:has(input:checked),
  .cdaFilterVisibleToggle:has(input:indeterminate) {
    border-color: #f2c94c;
    background: #fff7d6;
    color: #7a4a00;
  }

  .cdaFilterVisibleToggle input {
    width: 14px;
    height: 14px;
    margin: 0;
    accent-color: #d89b00;
    cursor: pointer;
  }

  .cdaFilterCount {
    margin-left: auto;
    color: #667085;
    font: 800 11px/1 Roboto, Arial, sans-serif;
    white-space: nowrap;
  }

  .cdaFilterSearch {
    width: calc(100% - 14px);
    margin: 7px;
    height: 32px;
    border: 1px solid #d5dae2;
    border-radius: 7px;
    padding: 0 9px;
    color: #202124;
    font: 700 12px/1 Roboto, Arial, sans-serif;
    outline: none;
    background: #ffffff;
  }

  .cdaFilterSearch:focus {
    border-color: #94a3b8;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
  }

  .cdaFilterList {
    max-height: 304px;
    overflow-y: auto;
    scrollbar-gutter: stable both-edges;
  }

  .cdaFilterList::-webkit-scrollbar { width: 12px; }
  .cdaFilterList::-webkit-scrollbar-track { background: #f1f3f4; border-radius: 8px; }
  .cdaFilterList::-webkit-scrollbar-thumb { background: #9aa0a6; border: 3px solid #f1f3f4; border-radius: 8px; }
  .cdaFilterList::-webkit-scrollbar-thumb:hover { background: #6f7378; }

  .cdaFilterRow {
    display: grid;
    grid-template-columns: 22px minmax(0, 1fr) auto;
    gap: 8px;
    align-items: center;
    padding: 7px 9px;
    border-bottom: 1px solid #f1f3f5;
    cursor: pointer;
    user-select: none;
  }

  .cdaFilterRow:hover,
  .cdaFilterRow.active { background: #eef5ff; }

  .cdaFilterRow input {
    pointer-events: none;
    width: 16px;
    height: 16px;
    accent-color: #2563eb;
  }

  .cdaFilterLabel {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font: 800 12px/1.2 Roboto, Arial, sans-serif;
    color: #344054;
  }

  .cdaFilterOnly {
    border: 1px solid #d5dae2;
    background: #ffffff;
    color: #475467;
    border-radius: 999px;
    padding: 3px 7px;
    font: 900 10px/1 Roboto, Arial, sans-serif;
    cursor: pointer;
    opacity: 0;
    transition: opacity 80ms ease;
  }

  .cdaFilterRow:hover .cdaFilterOnly { opacity: 1; }
  .cdaFilterOnly:hover { background: #f1f5f9; border-color: #94a3b8; }

  .cdaFilterEmpty {
    padding: 14px 10px;
    color: #667085;
    font: 800 12px/1.3 Roboto, Arial, sans-serif;
    text-align: center;
  }

  @media (max-width: 980px) {
    .cdaFilterBar { grid-template-columns: 1fr; gap: 6px; }
    .cdaFilterPanel { position: static !important; width: 100% !important; max-height: 360px !important; margin-top: 4px; }
  }
</style>
