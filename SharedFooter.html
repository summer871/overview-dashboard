<script id="cdaRemakeRefreshStatusControllerV6630">

      node=document.createElement('div');
      node.id=STATUS_ID;
      node.setAttribute('role','status');

    const target=page();

    const detailNode=node.querySelector('.cdaRemakeRefreshDetailV6630');

      const month=clean(item&&item.month||validation.month||'');

      const label=/^\d{4}-\d{2}$/.test(item.month)?new Date(item.month+'-01T12:00:00').toLocaleDateString(undefined,{month:'short',year:'numeric'}):item.month;
