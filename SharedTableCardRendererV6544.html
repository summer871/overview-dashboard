    TABLE_BODY_IDS.forEach(function(name){var body=oldPage.querySelector('#'+name);var table=body&&body.closest('table');if(table){nodes[name+'__table']=table;table.remove();}});
    return nodes;
  }

  function replaceNode(next,nodes,name){
    var preserved=nodes[name];var placeholder=next.querySelector('#'+name);
    if(preserved&&placeholder&&placeholder.parentNode)placeholder.parentNode.replaceChild(preserved,placeholder);
  }

  function restorePreserved(next,nodes){
    PRESERVE_IDS.forEach(function(name){replaceNode(next,nodes,name);});
    TABLE_BODY_IDS.forEach(function(name){var table=nodes[name+'__table'];var body=next.querySelector('#'+name);var placeholderTable=body&&body.closest('table');if(table&&placeholderTable&&placeholderTable.parentNode)placeholderTable.parentNode.replaceChild(table,placeholderTable);});
  }
