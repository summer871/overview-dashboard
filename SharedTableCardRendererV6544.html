<!-- SharedTableCardRendererV6544.html
TAT table-card rebuild using Remake as the source-of-truth component contract.
The TAT controller still owns TAT data and calculations. This file owns the
visible card, header, toolbar and managed-table presentation for both pages.
-->
<style id="cdaSharedTableToolbarStylesV6544">
  #tatDashboardPageV6509 .tatCardV6509.remakeCard,
  #remakeFactorPage .remakeCard {
    box-sizing:border-box !important;
  }

  #tatDashboardPageV6509 .tatCardHeadV6509,
  #tatDashboardPageV6509 .remakeCardHeader,
  #remakeFactorPage .remakeCardHeader {
    display:flex !important;
    align-items:center !important;
    justify-content:space-between !important;
    gap:10px !important;
    min-height:42px !important;
    padding:8px 10px !important;
    box-sizing:border-box !important;
  }

  #tatDashboardPageV6509 .tatCardTitleV6509,
  #tatDashboardPageV6509 .remakeCardTitle,
  #remakeFactorPage .remakeCardTitle {
    margin:0 !important;
    color:#172033 !important;
    font:900 12px/1.2 Roboto,Arial,sans-serif !important;
  }

  .cdaSharedTableToolbarV6544 {
    display:flex !important;
    align-items:center !important;
    justify-content:flex-end !important;
    flex-wrap:wrap !important;
    gap:5px !important;
    min-width:0 !important;
    margin:0 !important;
    padding:0 !important;
  }

  .cdaSharedTableToolbarV6544 > .cdaSharedTableActionV6544 {
    box-sizing:border-box !important;
    display:inline-flex !important;
    align-items:center !important;
    justify-content:center !important;
    min-width:0 !important;
    min-height:27px !important;
    height:27px !important;
    margin:0 !important;
    padding:0 10px !important;
    border:1px solid #d7dce2 !important;
    border-radius:999px !important;
    background:#fff !important;
    color:#344054 !important;
    box-shadow:none !important;
    font:800 10px/1 Roboto,Arial,sans-serif !important;
    letter-spacing:0 !important;
    text-decoration:none !important;
    text-transform:none !important;
    white-space:nowrap !important;
    cursor:pointer !important;
    appearance:none !important;
  }

  .cdaSharedTableToolbarV6544 > .cdaSharedTableActionV6544:hover,
  .cdaSharedTableToolbarV6544 > .cdaSharedTableActionV6544:focus-visible,
  .cdaSharedTableToolbarV6544 > .cdaSharedTableActionV6544[aria-expanded="true"] {
    border-color:#e5c35b !important;
    background:#fff8dc !important;
    color:#7a5700 !important;
    outline:none !important;
  }

  .cdaSharedTableToolbarV6544 > .cdaSharedTableActionV6544[data-cda-action="reset"] {
    width:27px !important;
    min-width:27px !important;
    padding:0 !important;
    border-color:#e5c35b !important;
    background:#fff8dc !important;
    color:#8a6500 !important;
    font-size:15px !important;
  }

  [data-cda-legacy-table-action="v6.544"] {
    display:none !important;
  }
</style>
<script id="cdaSharedTableCardRendererControllerV6544">
(function installSharedTableCardRendererV6544(){
  'use strict';

  var VERSION = 'v6.544';
  var ACTIONS = ['year','columns','export-current','export-all','popout','reset'];
  var LABELS = {
    year:'Year',
    columns:'Columns',
    'export-current':'Export current',
    'export-all':'All data',
    popout:'Pop out',
    reset:'↺'
  };
  var TAT_COMPONENTS = {
    tatDepartment:'department',
    tatLate:'late',
    tatCustomer:'customer',
    tatQuality:'quality'
  };
  var syncing = false;
  var timer = 0;

  function clean(value){
    return String(value == null ? '' : value).replace(/\s+/g,' ').trim();
  }

  function tableFor(config){
    if (!config) return null;
    if (config.tableNode && config.tableNode.isConnected) return config.tableNode;
    var node = config.tableId ? document.getElementById(config.tableId) : null;
    if (!node && config.bodyId) node = document.getElementById(config.bodyId);
    if (!node) return null;
    return node.tagName === 'TABLE' ? node : node.closest('table');
  }

  function cardFor(config,table){
    if (config && config.card && config.card.isConnected) return config.card;
    if (config && config.sourceCard && config.sourceCard.isConnected) return config.sourceCard;
    if (config && config.cardId) {
      var byId = document.getElementById(config.cardId);
      if (byId) return byId;
    }
    return table && table.closest ? table.closest('article,.remakeCard') : null;
  }

  function pageFor(config,card){
    if (config && config.page) return config.page;
    return card && card.closest('#tatDashboardPageV6509') ? 'tat' : 'remake';
  }

  function componentFor(config){
    return config.component || TAT_COMPONENTS[config.key] || String(config.key || '').replace(/^tat/,'').toLowerCase();
  }

  function actionFrom(button){
    if (!button) return '';
    var value = clean(button.getAttribute('data-cda-action') || '') + ' ' + clean(button.textContent) + ' ' + clean(button.title || button.getAttribute('aria-label'));
    value = value.toLowerCase();
    if (/\byear\b|all years|^20\d{2}$/.test(value)) return 'year';
    if (/column/.test(value)) return 'columns';
    if (/export[ -]?current/.test(value)) return 'export-current';
    if (/all data|export[ -]?all/.test(value)) return 'export-all';
    if (/pop[ -]?out/.test(value)) return 'popout';
    if (/reset|clear|↺|⟳|⟲/.test(value)) return 'reset';
    return '';
  }

  function legacyActions(card){
    var map = Object.create(null);
    Array.prototype.slice.call(card.querySelectorAll('button')).forEach(function(button){
      if (button.hasAttribute('data-cda-shared-action-button')) return;
      var action = actionFrom(button);
      if (action && !map[action]) map[action] = button;
    });
    return map;
  }

  function currentYearLabel(){
    var source = document.getElementById('tatFilterButton_year_V6509');
    return clean(source && source.textContent) || 'Year';
  }

  function invoke(config,action,event,legacy){
    if (legacy && legacy.isConnected) {
      legacy.click();
      return;
    }
    var page = pageFor(config,cardFor(config,tableFor(config)));
    var component = componentFor(config);
    if (action === 'columns' && window.cdaTable && typeof window.cdaTable.toggleChooser === 'function') {
      window.cdaTable.toggleChooser(config.key,event);
      return;
    }
    if (page !== 'tat') return;
    if (action === 'year' && typeof window.toggleTatDropdownV6509 === 'function') window.toggleTatDropdownV6509('year',event);
    if (action === 'export-current' && typeof window.exportTatComponentV6509 === 'function') window.exportTatComponentV6509(component);
    if (action === 'export-all' && typeof window.exportTatAllDataV6509 === 'function') window.exportTatAllDataV6509(component);
    if (action === 'popout' && typeof window.popoutTatComponentV6509 === 'function') window.popoutTatComponentV6509(component);
    if (action === 'reset' && typeof window.clearTatComponentV6509 === 'function') window.clearTatComponentV6509(component);
  }

  function makeButton(config,action,legacy){
    var button = document.createElement('button');
    button.type = 'button';
    button.className = 'cdaSharedTableActionV6544 remakeMiniButtonV6230';
    button.setAttribute('data-cda-shared-action-button',VERSION);
    button.setAttribute('data-cda-action',action);
    button.textContent = action === 'year' ? currentYearLabel() : LABELS[action];
    button.title = action === 'reset' ? 'Reset this table' : LABELS[action];
    button.setAttribute('aria-label',button.title);
    button.addEventListener('click',function(event){
      event.preventDefault();
      event.stopPropagation();
      invoke(config,action,event,legacy);
      schedule();
    });
    return button;
  }

  function normalizeTatCard(card){
    if (!card) return;
    card.classList.add('remakeCard');
    card.classList.remove('tatCardV6509');
    var header = card.querySelector('.tatCardHeadV6509,.remakeCardHeader');
    if (header) {
      header.classList.add('remakeCardHeader');
      header.classList.remove('tatCardHeadV6509');
    }
    var title = card.querySelector('.tatCardTitleV6509,.remakeCardTitle');
    if (title) {
      title.classList.add('remakeCardTitle');
      title.classList.remove('tatCardTitleV6509');
    }
    var wrap = card.querySelector('.tatSummaryTableV6509,.tatCustomersWrapV6509,.tatQualityTableWrapV6509,.remakeTableWrap');
    if (wrap) wrap.classList.add('remakeTableWrap');
    var table = card.querySelector('table');
    if (table) {
      table.classList.add('remakeTable');
      table.classList.remove('tatTableV6509');
    }
  }

  function toolbarHost(card){
    var header = card.querySelector('.remakeCardHeader,.tatCardHeadV6509');
    if (!header) return null;
    var host = header.querySelector('.cdaSharedTableToolbarHostV6544');
    if (!host) {
      host = document.createElement('div');
      host.className = 'cdaSharedTableToolbarHostV6544 remakeCardActionsV6230';
      var old = header.querySelector('.tatCardActionsV6509,.remakeCardActionsV6230');
      if (old && old !== host) old.setAttribute('data-cda-legacy-table-action',VERSION);
      header.appendChild(host);
    }
    return host;
  }

  function renderToolbar(config){
    var table = tableFor(config);
    var card = cardFor(config,table);
    if (!table || !card) return null;
    var page = pageFor(config,card);
    if (page === 'tat') normalizeTatCard(card);
    var host = toolbarHost(card);
    if (!host) return null;
    var legacy = legacyActions(card);
    host.replaceChildren();
    host.className = 'cdaSharedTableToolbarHostV6544 remakeCardActionsV6230 cdaSharedTableToolbarV6544';
    host.setAttribute('data-cda-shared-toolbar',VERSION);
    host.setAttribute('data-cda-toolbar-key',config.key || '');
    host.setAttribute('data-cda-toolbar-page',page);
    ACTIONS.forEach(function(action){
      var source = legacy[action] || null;
      var supported = page === 'tat' || !!source || (action === 'columns' && window.cdaTable && typeof window.cdaTable.toggleChooser === 'function');
      if (!supported) return;
      if (source) source.setAttribute('data-cda-legacy-table-action',VERSION);
      host.appendChild(makeButton(config,action,source));
    });
    card.setAttribute('data-cda-toolbar-synced',VERSION);
    card.setAttribute('data-cda-table-page',page);
    return host;
  }

  function syncAll(){
    if (syncing) return [];
    var registry = window.cdaSharedTableRegistryV6544;
    if (!registry || typeof registry.list !== 'function') return [];
    syncing = true;
    try {
      return registry.list().map(renderToolbar).filter(Boolean);
    } finally {
      syncing = false;
    }
  }

  function schedule(){
    if (syncing) return;
    if (timer) window.clearTimeout(timer);
    timer = window.setTimeout(function(){timer=0;syncAll();},40);
  }

  function render(config){
    var table = tableFor(config);
    var card = cardFor(config,table);
    if (!table || !card || !card.contains(table)) return null;
    card.setAttribute('data-cda-shared-table-attached',VERSION);
    card.setAttribute('data-cda-table-instance',config.key || '');
    table.setAttribute('data-cda-shared-table-attached',VERSION);
    table.setAttribute('data-cda-table-instance',config.key || '');
    renderToolbar(config);
    return card;
  }

  function toolbarAudit(){
    var registry = window.cdaSharedTableRegistryV6544;
    if (!registry || typeof registry.list !== 'function') return [];
    return registry.list().map(function(config){
      var table = tableFor(config);
      var card = cardFor(config,table);
      var toolbar = card && card.querySelector('.cdaSharedTableToolbarV6544[data-cda-toolbar-key="'+config.key+'"]');
      var actions = toolbar ? Array.prototype.slice.call(toolbar.querySelectorAll('[data-cda-action]')).map(function(button){return button.getAttribute('data-cda-action');}) : [];
      return {
        key:config.key,
        page:pageFor(config,card),
        toolbarPresent:!!toolbar,
        actions:actions,
        identicalOptions:ACTIONS.every(function(action){return actions.indexOf(action)>=0;}),
        identicalOrder:actions.join('|')===ACTIONS.join('|'),
        remakeCardContract:!!(card && card.classList.contains('remakeCard') && card.querySelector('.remakeCardHeader') && card.querySelector('table.remakeTable'))
      };
    });
  }

  function audit(){
    var rows = toolbarAudit();
    return {
      version:VERSION,
      mode:'tat-rebuilt-from-remake-contract',
      actionOrder:ACTIONS.slice(),
      toolbars:rows,
      allTatTablesUseRemakeContract:rows.filter(function(row){return row.page==='tat';}).every(function(row){return row.remakeCardContract;}),
      allTatTablesHaveIdenticalOptions:rows.filter(function(row){return row.page==='tat';}).every(function(row){return row.identicalOptions && row.identicalOrder;})
    };
  }

  window.renderSharedTableCardV6544 = render;
  window.auditSharedRemakeTableShellV6544 = audit;
  window.cdaSharedTableCardRendererV6544 = Object.freeze({
    version:VERSION,
    mode:'tat-rebuilt-from-remake-contract',
    actionOrder:ACTIONS.slice(),
    render:render,
    syncToolbar:renderToolbar,
    syncAllToolbars:syncAll,
    toolbarAudit:toolbarAudit,
    audit:audit
  });

  document.addEventListener('cdaSharedTableDefinitionsReadyV6544',schedule);
  document.addEventListener('cdaSharedTableRenderedV6544',schedule);
  document.addEventListener('cdaTableRendered',schedule);
  document.addEventListener('cdaTatDashboardRenderedV6509',schedule);
  if (window.MutationObserver) {
    new MutationObserver(function(mutations){
      if (mutations.some(function(mutation){return mutation.addedNodes && mutation.addedNodes.length;})) schedule();
    }).observe(document.documentElement,{childList:true,subtree:true});
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded',schedule,{once:true});
  else schedule();
})();
</script>
