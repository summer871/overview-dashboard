<!-- SharedTableCardRendererV6544.html
Non-destructive shared table card and toolbar adapter.
Cards and tables remain owned by their existing pages. This module owns one
visible toolbar DOM and delegates every action to the page's existing behavior.
-->
<style id="cdaSharedTableToolbarStylesV6544">
  .cdaSharedTableToolbarV6544 {
    display:flex !important;
    align-items:center !important;
    justify-content:flex-end !important;
    flex-wrap:wrap !important;
    gap:5px !important;
    min-width:0 !important;
    margin:0 !important;
    padding:0 !important;
  }

  .cdaSharedTableToolbarV6544 > .cdaSharedTableActionV6544 {
    box-sizing:border-box !important;
    display:inline-flex !important;
    align-items:center !important;
    justify-content:center !important;
    min-width:0 !important;
    min-height:27px !important;
    height:27px !important;
    margin:0 !important;
    padding:0 10px !important;
    border:1px solid #d7dce2 !important;
    border-radius:999px !important;
    background:#fff !important;
    color:#344054 !important;
    box-shadow:none !important;
    font:800 10px/1 Roboto,Arial,sans-serif !important;
    letter-spacing:0 !important;
    text-decoration:none !important;
    text-transform:none !important;
    white-space:nowrap !important;
    cursor:pointer !important;
    appearance:none !important;
  }

  .cdaSharedTableToolbarV6544 > .cdaSharedTableActionV6544:hover,
  .cdaSharedTableToolbarV6544 > .cdaSharedTableActionV6544:focus-visible {
    border-color:#b8c0ca !important;
    background:#f8fafc !important;
    color:#172033 !important;
    outline:none !important;
  }

  .cdaSharedTableToolbarV6544 > .cdaSharedTableActionV6544[data-cda-action="reset"] {
    width:27px !important;
    min-width:27px !important;
    padding:0 !important;
    border-color:#e5c35b !important;
    background:#fff8dc !important;
    color:#8a6500 !important;
    font-size:15px !important;
  }

  .cdaSharedTableToolbarV6544 > .cdaSharedTableActionV6544[aria-expanded="true"],
  .cdaSharedTableToolbarV6544 > .cdaSharedTableActionV6544[aria-pressed="true"] {
    border-color:#e5c35b !important;
    background:#fff8dc !important;
    color:#7a5700 !important;
  }

  [data-cda-legacy-table-action="v6.544"] {
    position:absolute !important;
    width:1px !important;
    height:1px !important;
    min-width:1px !important;
    min-height:1px !important;
    margin:-1px !important;
    padding:0 !important;
    overflow:hidden !important;
    clip:rect(0 0 0 0) !important;
    clip-path:inset(50%) !important;
    white-space:nowrap !important;
    border:0 !important;
    opacity:0 !important;
    pointer-events:none !important;
  }
</style>
<script id="cdaSharedTableCardRendererControllerV6544">
(function installSharedTableCardRendererV6544(){
  'use strict';

  var VERSION_V6544 = 'v6.544';
  var RENDERER_V6544 = 'attachExistingTableV6544';
  var ACTION_ORDER_V6544 = ['year','columns','export-current','export-all','popout','reset'];
  var ACTION_LABELS_V6544 = {
    year:'Year',
    columns:'Columns',
    'export-current':'Export current',
    'export-all':'All data',
    popout:'Pop out',
    reset:'↺'
  };
  var observerV6544 = null;
  var syncTimerV6544 = null;
  var syncingV6544 = false;

  function cleanV6544(value){
    return String(value == null ? '' : value).replace(/\s+/g,' ').trim();
  }

  function tableForConfigV6544(config){
    if (!config) return null;
    if (config.tableNode && config.tableNode.nodeType === 1) return config.tableNode;
    if (config.tableId) return document.getElementById(config.tableId);
    if (config.bodyNode && config.bodyNode.closest) return config.bodyNode.closest('table');
    if (config.bodyId) {
      var body = document.getElementById(config.bodyId);
      return body && body.closest ? body.closest('table') : null;
    }
    return null;
  }

  function cardForConfigV6544(config, table){
    if (config && config.sourceCard && config.sourceCard.nodeType === 1) return config.sourceCard;
    if (config && config.card && config.card.nodeType === 1) return config.card;
    if (config && config.cardId) {
      var cardById = document.getElementById(config.cardId);
      if (cardById) return cardById;
    }
    return table && table.closest ? table.closest('article,.remakeCard') : null;
  }

  function actionFromButtonV6544(button){
    if (!button) return '';
    var explicit = cleanV6544(button.getAttribute('data-cda-action') || button.getAttribute('data-cda-card-action')).toLowerCase();
    var text = cleanV6544(button.textContent).toLowerCase();
    var title = cleanV6544(button.title || button.getAttribute('aria-label')).toLowerCase();
    var combined = explicit + ' ' + text + ' ' + title;
    if (/\byear\b|^20\d{2}$|all years/.test(combined)) return 'year';
    if (/column/.test(combined)) return 'columns';
    if (/export[ -]?current/.test(combined)) return 'export-current';
    if (/all data|export[ -]?all/.test(combined)) return 'export-all';
    if (/pop[ -]?out/.test(combined)) return 'popout';
    if (/reset|clear|↺|⟳|⟲/.test(combined)) return 'reset';
    return '';
  }

  function actionHostForCardV6544(card){
    if (!card) return null;
    var host = card.querySelector('.cdaCardActionsV6544,[data-cda-card-actions],.remakeCardActions,.tatCardActions');
    if (host) return host;
    var candidate = Array.prototype.slice.call(card.querySelectorAll('button')).find(function(button){
      return !!actionFromButtonV6544(button);
    });
    return candidate ? candidate.parentElement : null;
  }

  function legacyButtonsV6544(card){
    if (!card) return [];
    return Array.prototype.slice.call(card.querySelectorAll('button')).filter(function(button){
      return !button.hasAttribute('data-cda-shared-action-button') && !!actionFromButtonV6544(button);
    });
  }

  function legacyActionsV6544(card){
    var actions = Object.create(null);
    legacyButtonsV6544(card).forEach(function(button){
      var action = actionFromButtonV6544(button);
      if (!actions[action]) actions[action] = button;
    });
    return actions;
  }

  function currentYearLabelV6544(config, legacy){
    var source = legacy && legacy.year;
    var label = cleanV6544(source && source.textContent);
    if (label && !/^year$/i.test(label)) return label;
    if (config && config.page === 'tat') {
      var tatButton = document.getElementById('tatFilterButton_year_V6509');
      label = cleanV6544(tatButton && tatButton.textContent);
      if (label) return label;
    }
    return 'Year';
  }

  function tatFallbackV6544(config, action, event){
    var component = config.component || '';
    if (action === 'year') {
      if (typeof window.toggleTatDropdownV6509 === 'function') return window.toggleTatDropdownV6509('year',event);
      var yearButton = document.getElementById('tatFilterButton_year_V6509');
      if (yearButton) return yearButton.click();
    }
    if (action === 'columns' && window.cdaTable && typeof window.cdaTable.toggleChooser === 'function') {
      return window.cdaTable.toggleChooser(config.key);
    }
    if (action === 'export-current' && typeof window.exportTatComponentV6509 === 'function') return window.exportTatComponentV6509(component);
    if (action === 'export-all' && typeof window.exportTatAllDataV6509 === 'function') return window.exportTatAllDataV6509(component);
    if (action === 'popout' && typeof window.popoutTatComponentV6509 === 'function') return window.popoutTatComponentV6509(component);
    if (action === 'reset' && typeof window.clearTatComponentV6509 === 'function') return window.clearTatComponentV6509(component);
    return null;
  }

  function fallbackActionV6544(config, action, event){
    if (config.page === 'tat') return tatFallbackV6544(config,action,event);
    if (action === 'columns' && window.cdaTable && typeof window.cdaTable.toggleChooser === 'function') {
      return window.cdaTable.toggleChooser(config.key);
    }
    return null;
  }

  function createSharedButtonV6544(config, action, source){
    var button = document.createElement('button');
    button.type = 'button';
    button.className = 'cdaSharedTableActionV6544';
    button.setAttribute('data-cda-shared-action-button',VERSION_V6544);
    button.setAttribute('data-cda-action',action);
    button.setAttribute('data-cda-action-source',source ? 'legacy' : 'contract');
    button.textContent = action === 'year' ? currentYearLabelV6544(config,{year:source}) : ACTION_LABELS_V6544[action];
    button.title = source && source.title ? source.title : ACTION_LABELS_V6544[action];
    button.setAttribute('aria-label',source && source.getAttribute('aria-label') ? source.getAttribute('aria-label') : button.title);
    if (source && source.hasAttribute('aria-expanded')) button.setAttribute('aria-expanded',source.getAttribute('aria-expanded'));
    if (source && source.hasAttribute('aria-pressed')) button.setAttribute('aria-pressed',source.getAttribute('aria-pressed'));
    button.addEventListener('click',function(event){
      event.preventDefault();
      event.stopPropagation();
      if (source && source.isConnected && typeof source.click === 'function') {
        source.click();
      } else {
        fallbackActionV6544(config,action,event);
      }
      window.setTimeout(scheduleSyncV6544,0);
    });
    return button;
  }

  function hideLegacyV6544(button){
    if (!button) return;
    button.setAttribute('data-cda-legacy-table-action',VERSION_V6544);
    button.setAttribute('aria-hidden','true');
    button.tabIndex = -1;
  }

  function restoreLegacyV6544(card){
    if (!card) return;
    Array.prototype.slice.call(card.querySelectorAll('[data-cda-legacy-table-action="v6.544"]')).forEach(function(button){
      button.removeAttribute('data-cda-legacy-table-action');
      button.removeAttribute('aria-hidden');
      button.removeAttribute('tabindex');
    });
  }

  function removeSharedToolbarV6544(card){
    if (!card) return;
    Array.prototype.slice.call(card.querySelectorAll('.cdaSharedTableToolbarV6544')).forEach(function(toolbar){
      if (toolbar.parentNode) toolbar.parentNode.removeChild(toolbar);
    });
  }

  function renderToolbarV6544(config){
    var table = tableForConfigV6544(config);
    var card = cardForConfigV6544(config,table);
    var host = actionHostForCardV6544(card);
    if (!card || !host) return null;

    var legacy = legacyActionsV6544(card);
    removeSharedToolbarV6544(card);

    var toolbar = document.createElement('div');
    toolbar.className = 'cdaSharedTableToolbarV6544';
    toolbar.setAttribute('data-cda-shared-toolbar',VERSION_V6544);
    toolbar.setAttribute('data-cda-toolbar-key',config.key || '');
    toolbar.setAttribute('data-cda-toolbar-page',config.page || '');

    ACTION_ORDER_V6544.forEach(function(action){
      var source = legacy[action] || null;
      var supported = !!source;
      if (!supported && config.page === 'tat') supported = true;
      if (!supported && action === 'columns' && window.cdaTable && typeof window.cdaTable.toggleChooser === 'function') supported = true;
      if (!supported) return;
      if (source) hideLegacyV6544(source);
      toolbar.appendChild(createSharedButtonV6544(config,action,source));
    });

    host.appendChild(toolbar);
    card.setAttribute('data-cda-toolbar-synced',VERSION_V6544);
    return toolbar;
  }

  function syncToolbarV6544(configOrKey){
    var registry = window.cdaSharedTableRegistryV6544;
    var config = typeof configOrKey === 'string' && registry && typeof registry.get === 'function'
      ? registry.get(configOrKey)
      : configOrKey;
    return config ? renderToolbarV6544(config) : null;
  }

  function syncAllToolbarsV6544(){
    if (syncingV6544) return [];
    var registry = window.cdaSharedTableRegistryV6544;
    if (!registry || typeof registry.list !== 'function') return [];
    syncingV6544 = true;
    var result;
    try {
      result = registry.list().map(syncToolbarV6544).filter(Boolean);
    } finally {
      syncingV6544 = false;
    }
    return result;
  }

  function scheduleSyncV6544(){
    if (syncingV6544) return;
    if (syncTimerV6544) window.clearTimeout(syncTimerV6544);
    syncTimerV6544 = window.setTimeout(function(){
      syncTimerV6544 = null;
      syncAllToolbarsV6544();
    },40);
  }

  function renderSharedTableCardV6544(config){
    var table = tableForConfigV6544(config);
    var card = cardForConfigV6544(config,table);
    if (!table || !card || !card.contains(table)) return null;
    card.setAttribute('data-cda-shared-table-attached',VERSION_V6544);
    card.setAttribute('data-cda-table-instance',config && config.key || '');
    card.setAttribute('data-cda-table-page',config && config.page || '');
    card.setAttribute('data-cda-table-attacher',RENDERER_V6544);
    table.setAttribute('data-cda-shared-table-attached',VERSION_V6544);
    table.setAttribute('data-cda-table-instance',config && config.key || '');
    renderToolbarV6544(config);
    return card;
  }

  function createTatActionsV6544(config){
    if (!config) return [];
    return ACTION_ORDER_V6544.map(function(action){
      return createSharedButtonV6544(config,action,null);
    });
  }

  function toggleCollapsedV6544(config,force){
    var table = tableForConfigV6544(config);
    var card = cardForConfigV6544(config,table);
    if (!card) return false;
    var existingButton = config && config.collapseButtonId ? document.getElementById(config.collapseButtonId) : null;
    if (existingButton && typeof existingButton.click === 'function' && force == null) {
      existingButton.click();
      return true;
    }
    return false;
  }

  function toolbarAuditV6544(){
    var registry = window.cdaSharedTableRegistryV6544;
    if (!registry || typeof registry.list !== 'function') return [];
    return registry.list().map(function(config){
      var table = tableForConfigV6544(config);
      var card = cardForConfigV6544(config,table);
      var toolbar = card && card.querySelector('.cdaSharedTableToolbarV6544[data-cda-toolbar-key="' + config.key + '"]');
      var buttons = toolbar ? Array.prototype.slice.call(toolbar.querySelectorAll('[data-cda-shared-action-button]')) : [];
      var actions = buttons.map(function(button){ return button.getAttribute('data-cda-action'); });
      return {
        key:config.key,
        page:config.page,
        toolbarPresent:!!toolbar,
        sharedMarkup:!!toolbar && buttons.length === actions.length,
        actions:actions,
        orderMatches:actions.every(function(action,index){ return ACTION_ORDER_V6544.indexOf(action) === index; }),
        behaviorSources:buttons.map(function(button){ return button.getAttribute('data-cda-action-source'); }),
        legacyTargets:card ? card.querySelectorAll('[data-cda-legacy-table-action="v6.544"]').length : 0
      };
    });
  }

  function auditV6544(){
    var attached = Array.prototype.slice.call(document.querySelectorAll('[data-cda-shared-table-attached="v6.544"][data-cda-table-instance]'));
    var cards = attached.filter(function(node){ return node.matches('article,.remakeCard'); });
    var toolbars = toolbarAuditV6544();
    return {
      version:VERSION_V6544,
      renderer:RENDERER_V6544,
      mode:'shared-toolbar-contract',
      totalCards:cards.length,
      instances:cards.map(function(card){ return card.getAttribute('data-cda-table-instance'); }),
      noGeneratedCards:cards.every(function(card){ return card.getAttribute('data-cda-table-attacher') === RENDERER_V6544; }),
      tablesRemainContained:cards.every(function(card){
        var key = card.getAttribute('data-cda-table-instance');
        var table = card.querySelector('table[data-cda-table-instance="' + key + '"]');
        return !!table && card.contains(table);
      }),
      sharedToolbarStyles:!!document.getElementById('cdaSharedTableToolbarStylesV6544'),
      toolbars:toolbars,
      allToolbarsShared:toolbars.every(function(item){ return item.toolbarPresent && item.sharedMarkup; }),
      allToolbarOrdersValid:toolbars.every(function(item){ return item.orderMatches; })
    };
  }

  function destroyToolbarsV6544(){
    var registry = window.cdaSharedTableRegistryV6544;
    if (!registry || typeof registry.list !== 'function') return;
    registry.list().forEach(function(config){
      var table = tableForConfigV6544(config);
      var card = cardForConfigV6544(config,table);
      removeSharedToolbarV6544(card);
      restoreLegacyV6544(card);
    });
  }

  window.renderSharedTableCardV6544 = renderSharedTableCardV6544;
  window.auditSharedRemakeTableShellV6544 = auditV6544;
  window.CDA_SHARED_TABLE_CARD_RENDERER_VERSION = VERSION_V6544;
  window.cdaSharedTableCardRendererV6544 = Object.freeze({
    version:VERSION_V6544,
    name:RENDERER_V6544,
    mode:'shared-toolbar-contract',
    actionOrder:ACTION_ORDER_V6544.slice(),
    render:renderSharedTableCardV6544,
    createTatActions:createTatActionsV6544,
    syncToolbar:syncToolbarV6544,
    syncAllToolbars:syncAllToolbarsV6544,
    toggleCollapsed:toggleCollapsedV6544,
    toolbarAudit:toolbarAuditV6544,
    destroyToolbars:destroyToolbarsV6544,
    audit:auditV6544
  });

  document.addEventListener('cdaSharedTableDefinitionsReadyV6544',scheduleSyncV6544);
  document.addEventListener('cdaSharedTableRenderedV6544',scheduleSyncV6544);
  document.addEventListener('cdaSharedTableExistingV6544',scheduleSyncV6544);
  document.addEventListener('cdaTatDashboardRenderedV6509',scheduleSyncV6544);

  if (window.MutationObserver) {
    observerV6544 = new MutationObserver(function(mutations){
      var relevant = mutations.some(function(mutation){
        return Array.prototype.some.call(mutation.addedNodes || [],function(node){
          return node.nodeType === 1 && !node.closest('.cdaSharedTableToolbarV6544');
        });
      });
      if (relevant) scheduleSyncV6544();
    });
    observerV6544.observe(document.documentElement,{childList:true,subtree:true});
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded',scheduleSyncV6544,{once:true});
  else scheduleSyncV6544();
})();
</script>
