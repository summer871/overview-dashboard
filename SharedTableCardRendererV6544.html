<!-- SharedTableCardRendererV6544.html
TAT frontend replacement.
The existing TAT controller remains the data, cache, filter, calculation, chart,
export and interaction owner. This module deletes the old generated TAT page and
rebuilds only its frontend from the Remake card/table contract while preserving
all IDs consumed by the existing controller.
-->
<style id="cdaTatRemakeFrontendStylesV6544">
  #tatDashboardPageV6509.cleanRemakeV6230 {
    width:100%;
    min-width:0;
    box-sizing:border-box;
  }

  #tatDashboardPageV6509 .remakeKpiAreaV6406,
  #tatDashboardPageV6509 .remakeKpisV6230,
  #tatDashboardPageV6509 .remakeGridV6230,
  #tatDashboardPageV6509 .remakeCard,
  #tatDashboardPageV6509 .remakeCardHeader,
  #tatDashboardPageV6509 .remakeTableWrap,
  #tatDashboardPageV6509 .remakeTable {
    box-sizing:border-box;
  }

  #tatDashboardPageV6509 .remakeCardHeader {
    display:flex !important;
    align-items:center !important;
    justify-content:space-between !important;
    gap:10px !important;
    min-height:42px !important;
    padding:8px 10px !important;
  }

  #tatDashboardPageV6509 .remakeCardTitle {
    margin:0 !important;
    color:#172033 !important;
    font:900 12px/1.2 Roboto,Arial,sans-serif !important;
  }

  #tatDashboardPageV6509 .remakeCardActionsV6230 {
    display:flex !important;
    align-items:center !important;
    justify-content:flex-end !important;
    flex-wrap:wrap !important;
    gap:5px !important;
    margin:0 !important;
    padding:0 !important;
  }

  #tatDashboardPageV6509 .remakeCardActionsV6230 > button {
    display:inline-flex !important;
    align-items:center !important;
    justify-content:center !important;
    min-height:27px !important;
    height:27px !important;
    margin:0 !important;
    padding:0 10px !important;
    border:1px solid #d7dce2 !important;
    border-radius:999px !important;
    background:#fff !important;
    color:#344054 !important;
    box-shadow:none !important;
    font:800 10px/1 Roboto,Arial,sans-serif !important;
    white-space:nowrap !important;
    cursor:pointer !important;
  }

  #tatDashboardPageV6509 .remakeCardActionsV6230 > button:hover,
  #tatDashboardPageV6509 .remakeCardActionsV6230 > button:focus-visible,
  #tatDashboardPageV6509 .remakeCardActionsV6230 > button[aria-expanded="true"] {
    border-color:#e5c35b !important;
    background:#fff8dc !important;
    color:#7a5700 !important;
    outline:none !important;
  }

  #tatDashboardPageV6509 .remakeCardActionsV6230 > button[data-tat-action="reset"] {
    width:27px !important;
    min-width:27px !important;
    padding:0 !important;
    border-color:#e5c35b !important;
    background:#fff8dc !important;
    color:#8a6500 !important;
    font-size:15px !important;
  }

  #tatDashboardPageV6509 .remakeTableWrap {
    width:100%;
    min-width:0;
    overflow:auto;
  }

  #tatDashboardPageV6509 table.remakeTable {
    width:100%;
  }
</style>
<script id="cdaTatRemakeFrontendControllerV6544">
(function installTatRemakeFrontendV6544(){
  'use strict';

  var VERSION = 'v6.544';
  var rebuilding = false;
  var rebuilt = false;

  function id(value){
    return document.getElementById(value);
  }

  function actionButton(component,action,label,title){
    return '<button class="remakeMiniButtonV6230" type="button" data-tat-action="'+action+'" title="'+title+'" aria-label="'+title+'" onclick="cdaTatFrontendActionV6544(\''+component+'\',\''+action+'\',event)">'+label+'</button>';
  }

  function toolbar(component,collapse){
    var html = '<div class="remakeCardActionsV6230" data-cda-tat-remake-toolbar="'+component+'">'
      + actionButton(component,'year','Year','Filter by year')
      + actionButton(component,'columns','Columns','Choose visible columns')
      + actionButton(component,'export-current','Export current','Export the current table view')
      + actionButton(component,'export-all','All data','Export all matching TAT data')
      + actionButton(component,'popout','Pop out','Open this table in a separate window')
      + actionButton(component,'reset','↺','Reset this table');
    if (collapse) {
      html += '<button id="'+collapse.id+'" class="remakeMiniButtonV6230" type="button" title="'+collapse.title+'" aria-label="'+collapse.title+'" aria-expanded="true" onclick="toggleTatSectionV6509(\''+collapse.section+'\')">▾</button>';
    }
    return html + '</div>';
  }

  function card(title,component,body,options){
    options = options || {};
    var idAttribute = options.id ? ' id="'+options.id+'"' : '';
    var wideClass = options.wide ? ' tatWideV6509' : '';
    var titleMarkup = options.titleMarkup || '<div class="remakeCardTitle">'+title+'</div>';
    return '<article'+idAttribute+' class="remakeCard'+wideClass+'" data-cda-tat-remake-card="'+component+'">'
      + '<div class="remakeCardHeader"><div>'+titleMarkup+'</div>'+toolbar(component,options.collapse)+'</div>'
      + body
      + '</article>';
  }

  function tableMarkup(tableId,headers,bodyClass){
    return '<div class="remakeTableWrap '+(bodyClass||'')+'"><table class="remakeTable"><thead><tr>'
      + headers.map(function(header){return '<th'+(header.numeric?' class="num"':'')+'>'+header.label+'</th>';}).join('')
      + '</tr></thead><tbody id="'+tableId+'"></tbody></table></div>';
  }

  function buildPageMarkup(){
    var departmentTable = tableMarkup('tatDepartmentTableV6509',[
      {label:'Department / Product'},{label:'Sold Units',numeric:true},{label:'Remake Units',numeric:true},{label:'Remake %',numeric:true},{label:'Avg TAT',numeric:true},{label:'OTP',numeric:true},{label:'Avg Days Late',numeric:true}
    ]);
    var lateTable = tableMarkup('tatLateTableV6509',[
      {label:'Performance'},{label:'Cases',numeric:true},{label:'Share',numeric:true}
    ]);
    var customerTable = tableMarkup('tatCustomerTableV6509',[
      {label:'Customer'},{label:'Cases',numeric:true},{label:'Sold Units',numeric:true},{label:'Remake Units',numeric:true},{label:'Remake %',numeric:true},{label:'Avg TAT',numeric:true},{label:'OTP',numeric:true},{label:'Avg Days Late',numeric:true}
    ],'tatCollapsibleBodyV6509');
    var qualityTable = tableMarkup('tatQualityTableV6509',[
      {label:'Issue'},{label:'Case'},{label:'Customer'},{label:'Departments'},{label:'Invoice Date'},{label:'Date In'},{label:'TAT End'},{label:'TAT Days',numeric:true},{label:'Units',numeric:true},{label:'Remake Units',numeric:true}
    ],'tatQualityTableWrapV6509');

    var monthly = card('Monthly TAT Comparison','monthly','<div class="remakeTrendCanvasWrapV6230"><canvas id="tatMonthlyChartV6509"></canvas></div>');
    var department = card('Department Summary','department',departmentTable);
    var distribution = card('TAT Distribution','distribution','<div id="tatDistributionSubV6509" class="tatSrOnlyV6513">Percent of eligible cases by business-day bucket</div><div class="remakeTrendCanvasWrapV6230"><canvas id="tatDistributionChartV6509"></canvas></div>');
    var late = card('Promise Performance','late',lateTable);
    var customer = card('Customers','customer','<div class="tatCollapsibleBodyV6509">'+customerTable+'</div>',{
      id:'tatCustomerCardV6509',wide:true,collapse:{id:'tatCustomerCollapseV6509',section:'customers',title:'Collapse customers'}
    });
    var qualityTitle = '<div class="tatQualityTitleRowV6513"><div class="remakeCardTitle">Data Quality & Coverage</div><div id="tatQualityCoverageV6513" class="tatQualityCoverageV6513"></div></div>';
    var quality = card('Data Quality & Coverage','quality','<div class="tatCollapsibleBodyV6509 tatQualityBodyV6509"><div id="tatIssueSummaryV6509" class="tatIssueSummaryV6509"></div>'+qualityTable+'</div>',{
      id:'tatQualityCardV6509',wide:true,titleMarkup:qualityTitle,collapse:{id:'tatQualityCollapseV6509',section:'quality',title:'Collapse quality'}
    });

    return '<div class="tatKpiStageV6509">'
      + '<div class="remakeKpiAreaV6406 tatKpiAreaV6528">'
      + '<div class="remakeKpiToolbarV6403"><button id="tatKpiChooserButtonV6528" class="remakeKpiChooserButtonV6403" type="button" aria-label="Choose KPI cards" aria-haspopup="dialog" aria-expanded="false">⋮</button></div>'
      + '<div class="remakeKpisV6230 tatKpisV6509">'
      + '<div class="remakeKpi" data-tat-kpi-key-v6528="avgTat"><div class="label">Average TAT</div><div id="tatKpiAvgV6509" class="value">-</div><div id="tatKpiAvgSubV6509" class="sub">Eligible cases</div></div>'
      + '<div class="remakeKpi" data-tat-kpi-key-v6528="otp"><div class="label">On Time to Promise</div><div id="tatKpiOtpV6509" class="value">-</div><div id="tatKpiOtpSubV6509" class="sub">Due-date eligible</div></div>'
      + '<div class="remakeKpi" data-tat-kpi-key-v6528="avgLate"><div class="label">Average Days Late</div><div id="tatKpiLateV6509" class="value">-</div><div id="tatKpiLateSubV6509" class="sub">Late cases only</div></div>'
      + '<div class="remakeKpi" data-tat-kpi-key-v6528="soldUnits"><div class="label">Sold Units</div><div id="tatKpi31V6509" class="value">-</div><div id="tatKpi31SubV6509" class="sub">Included units</div></div>'
      + '<div class="remakeKpi" data-tat-kpi-key-v6528="remakePct"><div class="label">Remake %</div><div id="tatKpiRemakePctV6523" class="value">-</div><div id="tatKpiRemakePctSubV6523" class="sub">Remake units / sold units</div></div>'
      + '</div></div><div id="tatStampV6509" class="tatStampV6509" aria-live="polite">Loading</div></div>'
      + '<div class="tatShellV6509"><div id="tatNoticeV6509" class="tatNoticeV6509"></div>'
      + '<div id="tatCoverageV6509" class="tatCoverageV6509" hidden>'
      + '<div class="tatCoverageMetricV6509"><span>Total Cases</span><strong id="tatCoverageCasesV6509">-</strong></div>'
      + '<div class="tatCoverageMetricV6509"><span>Total Units</span><strong id="tatCoverageUnitsV6509">-</strong></div>'
      + '<div class="tatCoverageMetricV6509"><span>TAT Eligible</span><strong id="tatCoverageEligibleV6509">-</strong></div>'
      + '<div class="tatCoverageMetricV6509"><span>Coverage</span><strong id="tatCoveragePctV6509">-</strong></div>'
      + '<div class="tatCoverageMetricV6509"><span>Excluded Cases</span><strong id="tatCoverageExcludedV6509">-</strong></div>'
      + '<div id="tatCoverageNoteV6509" class="tatCoverageNoteV6509">Base totals include the full invoice population. TAT calculations use the eligible subset.</div></div>'
      + '<div id="tatPillsV6509" class="tatPillsV6509"></div>'
      + '<div class="remakeGridV6230">'+monthly+department+distribution+late+customer+quality+'</div></div>';
  }

  function rebuild(){
    if (rebuilding) return null;
    var oldPage = id('tatDashboardPageV6509');
    if (!oldPage) return null;
    rebuilding = true;
    try {
      var wasActive = oldPage.classList.contains('active') || getComputedStyle(oldPage).display !== 'none';
      var parent = oldPage.parentNode;
      var next = document.createElement('section');
      next.id = 'tatDashboardPageV6509';
      next.className = 'tabContent cleanRemakeV6230';
      next.setAttribute('data-cda-tat-frontend',VERSION);
      next.innerHTML = buildPageMarkup();
      parent.replaceChild(next,oldPage);
      if (wasActive) {
        next.classList.add('active');
        next.style.setProperty('display','block','important');
        next.style.setProperty('visibility','visible','important');
      } else {
        next.style.setProperty('display','none','important');
      }
      rebuilt = true;
      document.dispatchEvent(new CustomEvent('cdaTatFrontendRebuiltV6544',{detail:{version:VERSION}}));
      window.setTimeout(function(){
        if (window.cdaSharedTableCardRendererV6544 && typeof window.cdaSharedTableCardRendererV6544.syncAllToolbars === 'function') {
          window.cdaSharedTableCardRendererV6544.syncAllToolbars();
        }
      },0);
      return next;
    } finally {
      rebuilding = false;
    }
  }

  window.cdaTatFrontendActionV6544 = function(component,action,event){
    if (event) {
      event.preventDefault();
      event.stopPropagation();
    }
    var tableKeys = {department:'tatDepartment',late:'tatLate',customer:'tatCustomer',quality:'tatQuality'};
    if (action === 'year' && typeof window.toggleTatDropdownV6509 === 'function') return window.toggleTatDropdownV6509('year',event);
    if (action === 'columns' && window.cdaTable && typeof window.cdaTable.toggleChooser === 'function' && tableKeys[component]) return window.cdaTable.toggleChooser(tableKeys[component],event);
    if (action === 'export-current' && typeof window.exportTatComponentV6509 === 'function') return window.exportTatComponentV6509(component);
    if (action === 'export-all' && typeof window.exportTatAllDataV6509 === 'function') return window.exportTatAllDataV6509(component);
    if (action === 'popout' && typeof window.popoutTatComponentV6509 === 'function') return window.popoutTatComponentV6509(component);
    if (action === 'reset' && typeof window.clearTatComponentV6509 === 'function') return window.clearTatComponentV6509(component);
  };

  function audit(){
    var page = id('tatDashboardPageV6509');
    var cards = page ? Array.prototype.slice.call(page.querySelectorAll('[data-cda-tat-remake-card]')) : [];
    return {
      version:VERSION,
      mode:'deleted-and-rebuilt-tat-frontend',
      rebuilt:rebuilt,
      pagePresent:!!page,
      pageUsesRemakeContract:!!(page && page.classList.contains('cleanRemakeV6230') && !page.classList.contains('tatMirrorRemakeV6512')),
      cardCount:cards.length,
      cards:cards.map(function(card){
        var actions = Array.prototype.slice.call(card.querySelectorAll('[data-tat-action]')).map(function(button){return button.getAttribute('data-tat-action');});
        return {
          component:card.getAttribute('data-cda-tat-remake-card'),
          remakeCard:card.classList.contains('remakeCard'),
          actions:actions,
          identicalActions:actions.join('|')==='year|columns|export-current|export-all|popout|reset'
        };
      }),
      dataIdsPreserved:['tatMonthlyChartV6509','tatDepartmentTableV6509','tatDistributionChartV6509','tatLateTableV6509','tatCustomerTableV6509','tatQualityTableV6509'].every(function(name){return !!id(name);})
    };
  }

  window.cdaSharedTableCardRendererV6544 = Object.freeze({
    version:VERSION,
    mode:'deleted-and-rebuilt-tat-frontend',
    rebuildTatFrontend:rebuild,
    syncAllToolbars:function(){return [];},
    toolbarAudit:function(){return audit().cards;},
    audit:audit
  });
  window.auditSharedRemakeTableShellV6544 = audit;

  function start(){
    var attempts = 0;
    var timer = window.setInterval(function(){
      attempts += 1;
      var page = id('tatDashboardPageV6509');
      if (page) {
        window.clearInterval(timer);
        rebuild();
      } else if (attempts >= 100) {
        window.clearInterval(timer);
      }
    },25);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded',start,{once:true});
  else start();
})();
</script>
