<script id="cdaSharedTableCardRendererControllerV6544">

    return !label || /^all years$/i.test(label) ? String(new Date().getFullYear()) : label;

  function openYearV6544(event){

      event.preventDefault();
      event.stopPropagation();

      ? window.cdaTable.hiddenCount(config.key)
      : 0;

    if (!card) return;
    var collapsed = force == null

    card.classList.toggle('remakeSectionCollapsedV6402', collapsed);
    var button = card.querySelector('.remakeSectionToggleV6402');
    if (button) button.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
    if (config.collapseKey) {
      var state = readCollapsedV6544();
      state[config.collapseKey] = collapsed;
      writeCollapsedV6544(state);
    }

  function collapseButtonV6544(config){
    if (!config.collapseKey) return null;
    var button = buttonV6544('', 'remakeMiniButtonV6230 remakeSectionToggleV6402', function(){
      toggleCollapsedV6544(config);
    }, 'Collapse or expand ' + config.title);

    button.setAttribute('aria-expanded', 'true');
    var chevron = nodeV6544('span', 'remakeSectionChevronV6402', '▾');
    chevron.setAttribute('aria-hidden', 'true');

  function tableFromBodyV6544(bodyId, title){
    var table = nodeV6544('table', 'remakeTable');
    table.setAttribute('data-cda-shared-table', VERSION_V6544);
    table.setAttribute('aria-label', title || 'Table');

    table.appendChild(body);

  function renderSharedTableCardV6544(config){
    var sourceCard = config && config.sourceCard;
    if (!sourceCard || !sourceCard.parentNode) return null;
    if (sourceCard.getAttribute('data-cda-renderer') === RENDERER_V6544) return sourceCard;

    var oldClassName = sourceCard.className || '';
    var oldId = sourceCard.id || '';
    var parent = sourceCard.parentNode;
    var nextSibling = sourceCard.nextSibling;
    var card = nodeV6544('article', 'remakeCard');

    card.className = ('remakeCard ' + (config.extraCardClass || '') + ' ' + (config.preserveClasses ? oldClassName : ''))
      .replace(/\s+/g, ' ')

    if (config.cardId || oldId) card.id = config.cardId || oldId;
    card.setAttribute('data-cda-table-card', VERSION_V6544);
    card.setAttribute('data-cda-table-instance', config.key);
    card.setAttribute('data-cda-renderer', RENDERER_V6544);
    card.setAttribute('data-cda-table-size', config.size || 'standard');
    card.setAttribute('data-cda-table-page', config.page || '');

    var header = nodeV6544('div', 'remakeCardHeader');
    var heading = nodeV6544('div', 'cdaSharedTableHeadingV6544');
    var title = nodeV6544('div', 'remakeCardTitle', config.title || '');
    heading.appendChild(title);
    (config.headingNodes || []).forEach(function(item){ if (item) heading.appendChild(item); });
    header.appendChild(heading);

    (config.actionNodes || []).forEach(function(item){ if (item) actions.appendChild(item); });
    var collapse = collapseButtonV6544(config);
    if (collapse) actions.appendChild(collapse);
    header.appendChild(actions);
    card.appendChild(header);

    if (config.collapseKey) {

      title.setAttribute('data-remake-section-title-v6408', config.collapseKey);
      title.addEventListener('click', function(){ toggleCollapsedV6544(config); });
      title.addEventListener('keydown', function(event){

    (config.beforeTableNodes || []).forEach(function(item){ if (item) bodyHost.appendChild(item); });

    bodyHost.appendChild(wrap);
    (config.afterTableNodes || []).forEach(function(item){ if (item) bodyHost.appendChild(item); });

    parent.removeChild(sourceCard);

    if (config.collapseKey) {

  }
