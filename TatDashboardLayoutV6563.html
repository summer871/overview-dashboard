<script id="cdaTatDashboardLayoutControllerV6563">
(function installTatDashboardLayoutV6563(){
  'use strict';

  if (window.cdaTatDashboardLayoutV6563 &&
      window.cdaTatDashboardLayoutV6563.version === 'v6.564') return;

  const observersV6564 = new WeakMap();

  function numericV6564(value){
    const parsed = Number(String(value == null ? '' : value).replace(/[^0-9.+-]/g,''));
    return Number.isFinite(parsed) ? parsed : 0;
  }

  function percentV6564(value){
    const parsed = numericV6564(value);
    return parsed > 1 ? parsed / 100 : parsed;
  }

  function activeDocumentV6564(){
    const isolation = window.cdaDashboardIsolationV6555;
    const detached = isolation && typeof isolation.card === 'function'
      ? isolation.card('tat.performance')
      : null;
    return detached && detached.ownerDocument || document;
  }

  function rowsV6564(doc){
    const body = doc && doc.getElementById('tatLateTableV6509');
    if (!body) return [];
    return Array.from(body.rows || []).map(function(row,index){
      const cells = Array.from(row.cells || []);
      return {
        index:index,
        row:row,
        label:String(cells[0] && cells[0].textContent || '').trim(),
        count:numericV6564(cells[1] && cells[1].textContent),
        share:percentV6564(cells[2] && cells[2].textContent)
      };
    }).filter(function(item){ return item.label; });
  }

  function selectedBandV6564(){
    const state = window.cdaTatStateV6509;
    return String(state && state.cross && state.cross.lateBand || '');
  }

  function clickSourceRowV6564(item,doc){
    if (!item || !item.row) return;
    const view = doc && doc.defaultView || window;
    try {
      item.row.dispatchEvent(new view.MouseEvent('click',{bubbles:true,cancelable:true,view:view}));
    } catch (error) {
      if (typeof item.row.click === 'function') item.row.click();
    }
  }

  function renderPromiseV6564(doc){
    doc = doc || activeDocumentV6564();
    const items = rowsV6564(doc);
    const headline = doc && doc.getElementById('tatPromiseHeadlineV6564');
    const meta = doc && doc.getElementById('tatPromiseHeadlineMetaV6564');
    const stack = doc && doc.getElementById('tatPromiseStackV6564');
    const legend = doc && doc.getElementById('tatPromiseLegendV6564');
    const empty = doc && doc.getElementById('tatPromiseEmptyV6564');
    if (!headline || !meta || !stack || !legend || !empty) return false;

    const total = items.reduce(function(sum,item){ return sum + item.count; },0);
    const onTime = items.find(function(item){ return item.label.toLowerCase() === 'on time'; }) || null;
    const hasData = total > 0;

    stack.replaceChildren();
    legend.replaceChildren();
    stack.hidden = !hasData;
    legend.hidden = !hasData;
    empty.hidden = hasData;

    if (!hasData) {
      headline.textContent = 'No data';
      meta.textContent = '0 due-date eligible cases';
      empty.textContent = 'No due-date eligible cases match the current filters.';
      return true;
    }

    headline.textContent = onTime ? (onTime.share * 100).toFixed(1) + '%' : '-';
    meta.textContent = total.toLocaleString() + ' due-date eligible cases';
    const selected = selectedBandV6564();

    items.forEach(function(item,index){
      const segment = doc.createElement('button');
      segment.type = 'button';
      segment.className = 'tatPromiseStackSegmentV6564';
      segment.setAttribute('data-tone',String(index));
      segment.style.flex = String(Math.max(0,item.share)) + ' 1 0';
      segment.title = item.label + ': ' + (item.share * 100).toFixed(1) + '%';
      segment.setAttribute('aria-label',segment.title);
      segment.addEventListener('click',function(){ clickSourceRowV6564(item,doc); });
      stack.appendChild(segment);

      const button = doc.createElement('button');
      button.type = 'button';
      button.className = 'tatPromiseLegendRowV6564';
      button.setAttribute('aria-pressed',selected === item.label ? 'true' : 'false');
      button.title = item.label + ': ' + item.count.toLocaleString() + ' cases';

      const dot = doc.createElement('span');
      dot.className = 'tatPromiseLegendDotV6564';
      dot.setAttribute('data-tone',String(index));
      dot.setAttribute('aria-hidden','true');

      const label = doc.createElement('span');
      label.className = 'tatPromiseLegendLabelV6564';
      label.textContent = item.label;

      const share = doc.createElement('span');
      share.className = 'tatPromiseLegendShareV6564';
      share.textContent = (item.share * 100).toFixed(1) + '%';

      button.append(dot,label,share);
      button.addEventListener('click',function(){ clickSourceRowV6564(item,doc); });
      legend.appendChild(button);
    });
    return true;
  }

  function improveCellTitlesV6564(doc){
    doc = doc || activeDocumentV6564();
    [
      '.tatDepartmentTableWrapV6563 tbody tr td:first-child',
      '.tatProductTableWrapV6562 tbody tr td:first-child',
      '.tatCustomerTableWrapV6563 tbody tr td:first-child'
    ].forEach(function(selector){
      doc.querySelectorAll(selector).forEach(function(cell){
        const text = String(cell.textContent || '').trim();
        if (text) cell.title = text;
      });
    });
  }

  function bindDocumentV6564(doc){
    if (!doc) return false;
    const body = doc.getElementById('tatLateTableV6509');
    if (body && !observersV6564.has(body)) {
      const view = doc.defaultView || window;
      const Observer = view.MutationObserver || MutationObserver;
      const observer = new Observer(function(){
        renderPromiseV6564(doc);
        improveCellTitlesV6564(doc);
      });
      observer.observe(body,{childList:true,subtree:true,characterData:true});
      observersV6564.set(body,observer);
    }
    renderPromiseV6564(doc);
    improveCellTitlesV6564(doc);
    return true;
  }

  function afterReplaceV6564(){
    window.requestAnimationFrame(function(){ bindDocumentV6564(activeDocumentV6564()); });
  }

  window.cdaTatDashboardLayoutV6563 = Object.freeze({
    version:'v6.564',
    mode:'analysis-first-promise-strip-and-full-width-distribution',
    afterReplace:afterReplaceV6564,
    renderPromise:renderPromiseV6564,
    improveCellTitles:improveCellTitlesV6564
  });

  window.addEventListener('cdaDashboardTabRenderedV6547',function(event){
    if (event && event.detail && event.detail.tabKey === 'tat') afterReplaceV6564();
  });
  window.addEventListener('cdaTableRendered',function(){ afterReplaceV6564(); });

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded',afterReplaceV6564,{once:true});
  } else {
    afterReplaceV6564();
  }
})();
</script>
