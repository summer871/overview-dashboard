Date: 2026-07-30
Purpose: Extend the dashboard audit with native Remake ownership, popup-window-only vertical scrolling, and cross-window shared-control parity.

<script id="cdaSharedDashboardInteractionAuditControllerV6557">
(function installSharedDashboardInteractionAuditV6557(){
  'use strict';

  const baseAuditService = window.cdaDashboardAuditV6550;
  if (!baseAuditService || typeof baseAuditService.audit !== 'function') {
    throw new Error('Base dashboard audit must load before interaction audit.');
  }
  if (baseAuditService.version === 'v6.561') return;

  function viewFor(node){
    return node && node.ownerDocument && node.ownerDocument.defaultView || window;
  }

  function styleFor(node){
    const view = viewFor(node);
    return node && view && typeof view.getComputedStyle === 'function'
      ? view.getComputedStyle(node)
      : null;
  }

  function visible(node){
    const style = styleFor(node);
    return !!node && !node.hidden && !!style && style.display !== 'none' &&
      style.visibility !== 'hidden' && style.opacity !== '0';
  }

  function styleSignature(node){
    const style = styleFor(node);
    if (!style) return '';
    return [style.width,style.height,style.minWidth,style.minHeight,style.paddingLeft,
      style.paddingRight,style.borderWidth,style.borderStyle,style.borderRadius,
      style.backgroundColor,style.color,style.fontFamily,style.fontSize,
      style.fontWeight,style.lineHeight].join('|');
  }

  function remakeActionHosts(){
    const page = document.getElementById('remakeFactorPage');
    const failures = [];
    if (!page) return {ok:false,failures:[{reason:'remake-page-missing'}]};
    page.querySelectorAll('.cdaDashboardToolbarV6547').forEach(function(toolbar){
      const host = toolbar.parentElement;
      const style = styleFor(host);
      const nativeHost = !!(host && host.matches(
        '.remakeCardActionsV6230[data-cda-dashboard-shared-host="native-remake-actions"]'
      ));
      const pointerEnabled = !!(style && style.pointerEvents !== 'none' &&
        style.visibility !== 'hidden' && style.display !== 'none');
      const staleSibling = !!toolbar.closest(
        '.cdaDashboardDecoratedActionsV6548[data-cda-dashboard-shared-host="true"]'
      );
      if (!nativeHost || !pointerEnabled || staleSibling || !visible(toolbar)) {
        failures.push({
          component:toolbar.getAttribute('data-cda-dashboard-toolbar') || '',
          nativeHost:nativeHost,
          pointerEvents:style ? style.pointerEvents : '',
          staleSibling:staleSibling,
          visible:visible(toolbar)
        });
      }
    });
    return {ok:failures.length === 0,failures:failures};
  }

  function titleOwnership(){
    const platform = window.cdaDashboardPlatformV6547;
    const catalog = window.cdaDashboardCatalogV6555;
    const failures = [];
    if (!platform || !catalog) return {ok:false,failures:[{reason:'platform-or-catalog-missing'}]};

    const tat = platform.getTab('tat');
    if (tat) {
      tat.components.forEach(function(component){
        if ((component.features || []).indexOf('collapse') < 0) return;
        const card = catalog.resolveCard('tat',component.key);
        const shared = card ? card.querySelectorAll('[data-cda-dashboard-title-toggle="true"]') : [];
        if (!card || shared.length !== 1) {
          failures.push({component:'tat.' + component.key,owner:'shared',count:shared.length});
        }
      });
    }

    const remake = platform.getTab('remake');
    if (remake) {
      remake.components.forEach(function(component){
        if ((component.features || []).indexOf('collapse') < 0) return;
        const card = catalog.resolveCard('remake',component.key);
        const title = card && card.querySelector('.remakeCardTitle');
        const shared = card ? card.querySelectorAll('[data-cda-dashboard-title-toggle="true"]') : [];
        const nativeButtons = card ? Array.from(card.querySelectorAll('[data-remake-section-toggle-v6402]')) : [];
        const visibleNative = nativeButtons.filter(visible);
        if (!card || !title || shared.length !== 0 || nativeButtons.length !== 1 ||
            visibleNative.length !== 1 || title.getAttribute('role') !== 'button') {
          failures.push({
            component:'remake.' + component.key,
            owner:'native-remake',
            titlePresent:!!title,
            sharedToggleCount:shared.length,
            nativeButtonCount:nativeButtons.length,
            visibleNativeButtonCount:visibleNative.length,
            titleRole:title ? title.getAttribute('role') : ''
          });
        }
      });
    }
    return {ok:failures.length === 0,failures:failures};
  }

  function referenceButton(featureKey,detachedButton){
    return Array.from(document.querySelectorAll(
      '.cdaDashboardToolbarV6547 [data-cda-dashboard-feature-key="' + featureKey + '"]'
    )).find(function(button){ return button !== detachedButton && visible(button); }) || null;
  }

  function detachedButtonParity(){
    const isolation = window.cdaDashboardIsolationV6555;
    const failures = [];
    const active = isolation && typeof isolation.active === 'function' ? isolation.active() : [];
    active.forEach(function(id){
      const card = isolation.card(id);
      if (!card) {
        failures.push({component:id,reason:'detached-card-missing'});
        return;
      }
      card.querySelectorAll('.cdaDashboardToolbarV6547 [data-cda-dashboard-feature-key]').forEach(function(button){
        if (!visible(button)) return;
        const feature = button.getAttribute('data-cda-dashboard-feature-key') || '';
        const reference = referenceButton(feature,button);
        if (!reference) {
          failures.push({component:id,feature:feature,reason:'dashboard-reference-missing'});
          return;
        }
        const sameClasses = ['cdaDashboardButtonV6547','cdaDashboardButtonIconV6547','cdaDashboardButtonPlainV6548']
          .every(function(className){ return button.classList.contains(className) === reference.classList.contains(className); });
        const sameText = button.textContent.trim() === reference.textContent.trim();
        const sameStyle = styleSignature(button) === styleSignature(reference);
        if (!sameClasses || !sameText || !sameStyle) {
          failures.push({
            component:id,
            feature:feature,
            sameClasses:sameClasses,
            expectedText:reference.textContent.trim(),
            actualText:button.textContent.trim(),
            expectedStyle:styleSignature(reference),
            actualStyle:styleSignature(button)
          });
        }
      });
    });
    return {active:active,ok:failures.length === 0,failures:failures};
  }

  function isInternalVerticalScrollOwner(node){
    const style = styleFor(node);
    if (!style || !visible(node)) return false;
    const overflowY = String(style.overflowY || '').toLowerCase();
    return /auto|scroll|overlay|hidden|clip/.test(overflowY) &&
      node.scrollHeight > node.clientHeight + 2;
  }

  function detachedFullTables(){
    const isolation = window.cdaDashboardIsolationV6555;
    const failures = [];
    const active = isolation && typeof isolation.active === 'function' ? isolation.active() : [];

    active.forEach(function(id){
      const session = typeof isolation.session === 'function' ? isolation.session(id) : null;
      const card = isolation.card(id);
      if (!card || !session) {
        failures.push({component:id,reason:'detached-card-or-session-missing'});
        return;
      }
      if (card.getAttribute('data-cda-popout-full-table') !== 'true') {
        failures.push({component:id,reason:'full-table-marker-missing'});
      }
      if (!session.fullTableNormalized) {
        failures.push({component:id,reason:'runtime-normalization-not-confirmed'});
      }

      [card].concat(Array.from(card.querySelectorAll('*'))).forEach(function(node){
        if (!isInternalVerticalScrollOwner(node)) return;
        const style = styleFor(node);
        failures.push({
          component:id,
          reason:'internal-vertical-scroll-owner',
          tagName:node.tagName || '',
          id:node.id || '',
          className:typeof node.className === 'string' ? node.className : '',
          overflowY:style ? style.overflowY : '',
          maxHeight:style ? style.maxHeight : '',
          clientHeight:node.clientHeight,
          scrollHeight:node.scrollHeight
        });
      });

      const doc = card.ownerDocument;
      const rootStyle = doc && doc.documentElement ? styleFor(doc.documentElement) : null;
      const bodyStyle = doc && doc.body ? styleFor(doc.body) : null;
      const rootOwnsScroll = !!rootStyle && /auto|scroll|overlay/.test(String(rootStyle.overflowY || '').toLowerCase());
      const bodyOwnsScroll = !!bodyStyle && /auto|scroll|overlay/.test(String(bodyStyle.overflowY || '').toLowerCase()) &&
        doc.body.scrollHeight > doc.body.clientHeight + 2;
      if (!rootOwnsScroll || bodyOwnsScroll) {
        failures.push({
          component:id,
          reason:'popup-window-not-sole-scroll-owner',
          rootOverflowY:rootStyle ? rootStyle.overflowY : '',
          bodyOverflowY:bodyStyle ? bodyStyle.overflowY : '',
          rootOwnsScroll:rootOwnsScroll,
          bodyOwnsScroll:bodyOwnsScroll
        });
      }
    });
    return {active:active,scrollOwner:'popup-window',ok:failures.length === 0,failures:failures};
  }

  function detachedLivePopout(){
    const service = window.cdaDashboardPopoutV6548;
    const isolation = window.cdaDashboardIsolationV6555;
    const columns = window.cdaDashboardColumnsV6548;
    const popover = window.cdaDashboardPopoverV6547;
    const toolbar = window.cdaDashboardToolbarV6548;
    const tatAdapter = window.cdaTatDashboardAdapterV6547;
    const remakeAdapter = window.cdaRemakeDashboardAdapterV6548;
    const fullTables = detachedFullTables();
    const buttonParity = detachedButtonParity();
    const serviceOk = !!service && service.version === 'v6.561' &&
      service.mode === 'detached-live-component' &&
      service.tableMode === 'window-scroll-full-table' &&
      typeof service.open === 'function' && typeof service.restore === 'function' &&
      typeof service.active === 'function' && typeof service.normalizeFullTable === 'function';
    const isolationOk = !!isolation && isolation.version === 'v6.561' &&
      isolation.mode === 'detached-live-component' &&
      isolation.tableMode === 'window-scroll-full-table' &&
      typeof isolation.card === 'function' && typeof isolation.normalizeFullTable === 'function';
    return {
      serviceVersion:service && service.version,
      isolationVersion:isolation && isolation.version,
      mode:service && service.mode,
      tableMode:service && service.tableMode,
      active:service && typeof service.active === 'function' ? service.active() : [],
      lastAttempt:service && typeof service.lastAttempt === 'function' ? service.lastAttempt() : null,
      documentAwareColumns:!!columns && columns.version === 'v6.558' &&
        typeof columns.documentFor === 'function' && typeof columns.resolveTable === 'function',
      documentAwarePopover:!!popover && popover.version === 'v6.558' &&
        typeof popover.activeDocument === 'function',
      documentAwareToolbar:!!toolbar && toolbar.version === 'v6.558' &&
        typeof toolbar.contextFor === 'function' && typeof toolbar.cardFor === 'function',
      tatDetachedCollapse:!!tatAdapter && tatAdapter.version === 'v6.558' &&
        typeof tatAdapter.applyDetachedCollapse === 'function',
      remakeDetachedCollapse:!!remakeAdapter && remakeAdapter.version === 'v6.558' &&
        typeof remakeAdapter.syncDetachedNativeCollapse === 'function',
      fullTables:fullTables,
      buttonParity:buttonParity,
      ok:serviceOk && isolationOk && !!columns && columns.version === 'v6.558' &&
        !!popover && popover.version === 'v6.558' && !!toolbar && toolbar.version === 'v6.558' &&
        !!tatAdapter && tatAdapter.version === 'v6.558' &&
        !!remakeAdapter && remakeAdapter.version === 'v6.558' &&
        fullTables.ok && buttonParity.ok
    };
  }

  function baseBehaviorOk(base){
    const checks = [
      base.componentCatalog,base.iconOwnership,base.everyFeatureInstanceStyleParity,
      base.toolbarActionOrder,base.visibleLegacyHeaderActions,base.remakeVisibleCardCoverage,
      base.kpiOverflowParity,base.oneToolbarOwnerPerCard,base.themeCssVariablesPresent
    ];
    return checks.every(function(check){ return !!(check && check.ok); });
  }

  function audit(){
    const base = baseAuditService.audit();
    const actionHosts = remakeActionHosts();
    const titles = titleOwnership();
    const popout = detachedLivePopout();
    const services = Object.assign({},base.services || {},{
      columns:window.cdaDashboardColumnsV6548 && window.cdaDashboardColumnsV6548.version,
      popover:window.cdaDashboardPopoverV6547 && window.cdaDashboardPopoverV6547.version,
      toolbar:window.cdaDashboardToolbarV6548 && window.cdaDashboardToolbarV6548.version,
      isolation:window.cdaDashboardIsolationV6555 && window.cdaDashboardIsolationV6555.version,
      popout:window.cdaDashboardPopoutV6548 && window.cdaDashboardPopoutV6548.version,
      bridge:window.cdaRemakeLegacyBridgeV6554 && window.cdaRemakeLegacyBridgeV6554.version,
      adapter:window.cdaRemakeDashboardAdapterV6548 && window.cdaRemakeDashboardAdapterV6548.version,
      tatAdapter:window.cdaTatDashboardAdapterV6547 && window.cdaTatDashboardAdapterV6547.version,
      decorator:window.cdaDashboardDecoratorV6548 && window.cdaDashboardDecoratorV6548.version
    });
    const serviceVersionsCorrect = !!(
      services.theme === 'v6.550' && services.columns === 'v6.558' &&
      services.popover === 'v6.558' && services.toolbar === 'v6.558' &&
      services.bridge === 'v6.559' && services.catalog === 'v6.555' &&
      services.isolation === 'v6.561' && services.popout === 'v6.561' &&
      services.titleToggle === 'v6.556' && services.adapter === 'v6.558' &&
      services.tatAdapter === 'v6.558' && services.decorator === 'v6.558'
    );
    return Object.assign({},base,{
      version:'v6.561',
      services:services,
      serviceVersionsCorrect:serviceVersionsCorrect,
      remakeActionHosts:actionHosts,
      titleOwnership:titles,
      detachedLivePopout:popout,
      detachedFullTables:popout.fullTables,
      detachedButtonParity:popout.buttonParity,
      livePopoutContract:popout,
      titleSideCollapse:titles,
      ok:serviceVersionsCorrect && baseBehaviorOk(base) && actionHosts.ok && titles.ok && popout.ok
    });
  }

  window.cdaDashboardAuditV6550 = Object.freeze({
    version:'v6.561',
    visible:baseAuditService.visible,
    styleSignature:baseAuditService.styleSignature,
    expectedIconName:baseAuditService.expectedIconName,
    audit:audit,
    remakeActionHosts:remakeActionHosts,
    titleOwnership:titleOwnership,
    detachedLivePopout:detachedLivePopout,
    detachedFullTables:detachedFullTables,
    detachedButtonParity:detachedButtonParity
  });
})();
</script>
