<script>

    window.dashboardBaseUrl = '<?!= dashboardBaseUrl ?>';
    window.CDA_SERVER_PRESENTATION = {
      version: <?!= JSON.stringify(dashboardPresentationVersion || 'v6.251') ?>,
      mode: <?!= JSON.stringify(dashboardPresentationMode || 'remake') ?>,
      source: <?!= JSON.stringify(dashboardPresentationSource || 'Code.gs backendPresentationMode') ?>,
      fastCacheRetained: true
    };
    // v6.501: Code.gs stays unchanged. This client-only mode prevents Sales boot while allowing Remake + TAT tabs.
    window.CDA_SERVER_PRESENTATION.mode = 'remaketat';
    window.CDA_SERVER_PRESENTATION.startTab = 'remakeFactor';
    window.addEventListener('error', function(event) {
      var box = document.getElementById('singleShellClientError');
      if (!box) return;
      box.style.display = 'block';
      box.textContent = 'CLIENT JS ERROR\n' + event.message + '\nLine: ' + event.lineno + ':' + event.colno + '\nFile: ' + event.filename;
    });
    window.addEventListener('unhandledrejection', function(event) {
      var box = document.getElementById('singleShellClientError');
      if (!box) return;
      box.style.display = 'block';
      box.textContent = 'CLIENT PROMISE ERROR\n' + (event.reason && event.reason.message ? event.reason.message : String(event.reason));
    });


    let payload = null;
    let facts = [];
    let charts = {};
    const monthLabels = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

    const colors = {
      2026: {
        border: '#2563eb',
        area: 'rgba(37, 99, 235, 0.13)',
        bar: '#4285f4',
        barBorder: '#2f6fe4',
        label: '#1d4ed8'
      },
      2025: {
        border: '#8da2bd',
        area: 'rgba(141, 162, 189, 0.08)',
        bar: '#94a3b8',
        barBorder: '#64748b',
        label: '#64748b'
      },
      2024: {
        border: '#c47a2c',
        area: 'rgba(196, 122, 44, 0.07)',
        bar: '#d98b3f',
        barBorder: '#b96a21',
        label: '#a35f16'
      }
    };

    const visibleChartIdsByTab = {
      one: ['chartRevenue', 'chartCustomers', 'chartUnits', 'chartRpac', 'chartAvg'],
      two: ['o2Customers', 'o2Units', 'o2Rpac', 'o2Avg', 'o2RevenueTrend']
    };

    const executiveValueLabelPlugin = {
      id: 'executiveValueLabels',
      afterDatasetsDraw(chart, args, pluginOptions) {
        if (!pluginOptions || pluginOptions.display === false) return;

        const ctx = chart.ctx;
        const metricKey = pluginOptions.metricKey || '';
        const chartType = chart.config.type;
        const labelMode = pluginOptions.labelMode || 'standard';
        const barLabelPlacement = pluginOptions.barLabelPlacement || 'above';

        ctx.save();
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.font = '500 9.5px Roboto, Arial, sans-serif';

        chart.data.datasets.forEach((dataset, datasetIndex) => {
          const meta = chart.getDatasetMeta(datasetIndex);
          if (!meta || meta.hidden) return;

          const points = meta.data || [];
          const lastVisibleIndex = getLastNonZeroIndex(dataset.data || []);

          points.forEach((element, index) => {
            const value = Number(dataset.data[index] || 0);
            if (!value || !isFinite(value)) return;

            // Keep trend charts professional: label only the latest visible point.
            if (chartType === 'line' && index !== lastVisibleIndex) return;

            // Keep revenue trend from getting crowded.
            if (chartType === 'line' && metricKey !== 'revenue') return;

            const position = element.tooltipPosition();
            const label = formatChartValueLabel(value, metricKey);
            if (!label) return;

            const color = colors[Number(dataset.label)]?.label || '#344054';
            let x = position.x;
            let y = chartType === 'bar' ? position.y - 4 : position.y - 7;
            let fillColor = color;
            let strokeColor = null;
            let strokeWidth = 0;
            let baseline = 'bottom';

            if (chartType === 'bar' && barLabelPlacement === 'insideTop') {
              const props = typeof element.getProps === 'function'
                ? element.getProps(['x', 'y', 'base'], true)
                : element;
              if (props && Number.isFinite(props.y) && Number.isFinite(props.base)) {
                const topY = Math.min(props.y, props.base);
                const bottomY = Math.max(props.y, props.base);
                const barHeight = bottomY - topY;
                if (barHeight >= 22) {
                  x = props.x;
                  y = topY + 6;
                  baseline = 'top';
                  fillColor = '#ffffff';
                  strokeColor = 'rgba(15, 23, 42, 0.45)';
                  strokeWidth = 3;
                }
              }
            }

            ctx.textBaseline = baseline;
            if (strokeColor && strokeWidth > 0) {
              ctx.lineWidth = strokeWidth;
              ctx.strokeStyle = strokeColor;
              ctx.strokeText(label, x, y);
            }
            ctx.fillStyle = fillColor;
            ctx.fillText(label, x, y);
            ctx.textBaseline = 'bottom';
          });
        });

        ctx.restore();
      }
    };

    const executiveTrendBackgroundPlugin = {
      id: 'executiveTrendBackground',
      beforeDatasetsDraw(chart, args, pluginOptions) {
        if (!pluginOptions || pluginOptions.display === false) return;

        const chartArea = chart.chartArea;
        const xScale = chart.scales && chart.scales.x;
        const yScale = chart.scales && chart.scales.y;
        if (!chartArea || !xScale || !yScale) return;

        const ctx = chart.ctx;
        ctx.save();

        const tickCount = chart.data && chart.data.labels ? chart.data.labels.length : 0;
        if (tickCount > 0) {
          const isDaily = pluginOptions.trendMode === 'dailyCumulative';
          const bandStep = isDaily ? 5 : 1;
          for (let index = 0; index < tickCount; index += bandStep) {
            if ((index / bandStep) % 2 !== 0) continue;
            const center = xScale.getPixelForTick(index);
            const previous = index > 0 ? xScale.getPixelForTick(Math.max(0, index - bandStep)) : null;
            const next = index < tickCount - 1 ? xScale.getPixelForTick(Math.min(tickCount - 1, index + bandStep)) : null;
            const width = next !== null ? Math.abs(next - center) : previous !== null ? Math.abs(center - previous) : chartArea.width;
            const left = Math.max(chartArea.left, center - width / 2);
            const right = Math.min(chartArea.right, center + width / 2);

            ctx.fillStyle = 'rgba(248, 250, 252, 0.48)';
            ctx.fillRect(left, chartArea.top, right - left, chartArea.bottom - chartArea.top);
          }
        }

        const averageValue = Number(pluginOptions.averageValue || 0);
        if (averageValue && isFinite(averageValue)) {
          const y = yScale.getPixelForValue(averageValue);
          if (y >= chartArea.top && y <= chartArea.bottom) {
            ctx.setLineDash([4, 8]);
            ctx.lineWidth = 0.7;
            ctx.strokeStyle = 'rgba(148, 163, 184, 0.16)';
            ctx.beginPath();
            ctx.moveTo(chartArea.left, y);
            ctx.lineTo(chartArea.right, y);
            ctx.stroke();
          }
        }

        ctx.restore();
      },
      afterDatasetsDraw(chart, args, pluginOptions) {
        if (!pluginOptions || pluginOptions.display === false) return;

        const active = chart.tooltip && typeof chart.tooltip.getActiveElements === 'function'
          ? chart.tooltip.getActiveElements()
          : [];
        if (!active || !active.length) return;

        const point = active[0].element;
        const chartArea = chart.chartArea;
        if (!point || !chartArea) return;

        const ctx = chart.ctx;
        ctx.save();
        ctx.setLineDash([4, 4]);
        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(148, 163, 184, 0.45)';
        ctx.beginPath();
        ctx.moveTo(point.x, chartArea.top);
        ctx.lineTo(point.x, chartArea.bottom);
        ctx.stroke();
        ctx.restore();
      }
    };


    const overviewLegendSpacingPlugin = {
      id: 'overviewLegendSpacing',
      beforeInit(chart) {
        if (!chart || !chart.legend || chart.legend.$overviewLegendSpacingPatched) return;

        const originalFit = chart.legend.fit;
        chart.legend.fit = function legendFitWithOverviewSpacing() {
          originalFit.bind(chart.legend)();

          const pluginOptions = chart.options && chart.options.plugins
            ? chart.options.plugins.overviewLegendSpacing
            : null;
          if (!pluginOptions || pluginOptions.display === false) return;

          const extra = Number(pluginOptions.padding || 0);
          if (extra && isFinite(extra)) {
            this.height += extra;
          }
        };

        chart.legend.$overviewLegendSpacingPatched = true;
      }
    };



    const revenueGapBandPlugin = {
      id: 'revenueGapBand',
      beforeDatasetsDraw(chart, args, pluginOptions) {
        if (!pluginOptions || pluginOptions.display === false) return;
        if (!chart || !chart.chartArea || !chart.data || !chart.data.datasets) return;

        const ctx = chart.ctx;
        const chartArea = chart.chartArea;
        const currentYear = Number(pluginOptions.currentYear || 2026);
        const priorYear = Number(pluginOptions.priorYear || currentYear - 1);
        const datasets = chart.data.datasets || [];
        const currentIndex = datasets.findIndex(ds => Number(ds.label) === currentYear);
        const priorIndex = datasets.findIndex(ds => Number(ds.label) === priorYear);
        if (currentIndex < 0 || priorIndex < 0) return;

        const currentMeta = chart.getDatasetMeta(currentIndex);
        const priorMeta = chart.getDatasetMeta(priorIndex);
        const current = datasets[currentIndex];
        const prior = datasets[priorIndex];
        if (!currentMeta || !priorMeta || !current || !prior) return;

        const currentPoints = currentMeta.data || [];
        const priorPoints = priorMeta.data || [];
        const count = Math.min(current.data.length, prior.data.length, currentPoints.length, priorPoints.length);
        if (count < 2) return;

        function props(point) {
          if (!point) return null;
          const p = typeof point.getProps === 'function'
            ? point.getProps(['x', 'y', 'cp1x', 'cp1y', 'cp2x', 'cp2y'], true)
            : point;
          return p && Number.isFinite(p.x) && Number.isFinite(p.y) ? p : null;
        }

        function cubic(a, b, c, d, t) {
          const mt = 1 - t;
          return mt * mt * mt * a + 3 * mt * mt * t * b + 3 * mt * t * t * c + t * t * t * d;
        }

        function sampleSegment(points, index, t) {
          const left = props(points[index]);
          const right = props(points[index + 1]);
          if (!left || !right) return null;

          const cp1x = Number.isFinite(left.cp2x) ? left.cp2x : left.x;
          const cp1y = Number.isFinite(left.cp2y) ? left.cp2y : left.y;
          const cp2x = Number.isFinite(right.cp1x) ? right.cp1x : right.x;
          const cp2y = Number.isFinite(right.cp1y) ? right.cp1y : right.y;

          return {
            x: cubic(left.x, cp1x, cp2x, right.x, t),
            y: cubic(left.y, cp1y, cp2y, right.y, t)
          };
        }

        function buildSamples(points) {
          const samples = [];
          const samplesPerSegment = 96;
          for (let i = 0; i < count - 1; i++) {
            for (let step = 0; step < samplesPerSegment; step++) {
              const point = sampleSegment(points, i, step / samplesPerSegment);
              if (point) samples.push(point);
            }
          }
          const last = props(points[count - 1]);
          if (last) samples.push({ x: last.x, y: last.y });
          return samples;
        }

        function interpolatePair(a, b, ratio) {
          return {
            current: {
              x: a.current.x + (b.current.x - a.current.x) * ratio,
              y: a.current.y + (b.current.y - a.current.y) * ratio
            },
            prior: {
              x: a.prior.x + (b.prior.x - a.prior.x) * ratio,
              y: a.prior.y + (b.prior.y - a.prior.y) * ratio
            },
            delta: 0
          };
        }

        function drawBand(region, fillStyle) {
          if (!region || region.length < 2) return;
          ctx.beginPath();
          ctx.moveTo(region[0].current.x, region[0].current.y);
          for (let i = 1; i < region.length; i++) {
            ctx.lineTo(region[i].current.x, region[i].current.y);
          }
          for (let i = region.length - 1; i >= 0; i--) {
            ctx.lineTo(region[i].prior.x, region[i].prior.y);
          }
          ctx.closePath();
          ctx.fillStyle = fillStyle;
          ctx.fill();
        }

        const currentSamples = buildSamples(currentPoints);
        const priorSamples = buildSamples(priorPoints);
        const sampleCount = Math.min(currentSamples.length, priorSamples.length);
        if (sampleCount < 2) return;

        const paired = [];
        for (let i = 0; i < sampleCount; i++) {
          paired.push({
            current: currentSamples[i],
            prior: priorSamples[i],
            // Canvas y is inverted: a smaller current y means a higher current value.
            delta: priorSamples[i].y - currentSamples[i].y
          });
        }

        ctx.save();
        ctx.beginPath();
        ctx.rect(chartArea.left, chartArea.top, chartArea.right - chartArea.left, chartArea.bottom - chartArea.top);
        ctx.clip();

        // Keep the original soft blue foundation below the 2026 line.
        ctx.beginPath();
        ctx.moveTo(paired[0].current.x, chartArea.bottom);
        paired.forEach(pair => ctx.lineTo(pair.current.x, pair.current.y));
        ctx.lineTo(paired[paired.length - 1].current.x, chartArea.bottom);
        ctx.closePath();
        ctx.fillStyle = 'rgba(37, 99, 235, 0.11)';
        ctx.fill();

        // Split only where the two smooth curves cross, then fill each complete
        // contiguous region once. This removes internal seams, overlaps and gaps.
        const regions = [];
        let region = [paired[0]];
        let sign = paired[0].delta >= 0 ? 1 : -1;

        for (let i = 1; i < paired.length; i++) {
          const previous = paired[i - 1];
          const currentPair = paired[i];
          const nextSign = currentPair.delta >= 0 ? 1 : -1;

          if (nextSign !== sign && previous.delta !== currentPair.delta) {
            const ratio = Math.max(0, Math.min(1, previous.delta / (previous.delta - currentPair.delta)));
            const crossing = interpolatePair(previous, currentPair, ratio);
            region.push(crossing);
            regions.push({ sign: sign, points: region });
            region = [crossing, currentPair];
            sign = nextSign;
          } else {
            region.push(currentPair);
          }
        }
        regions.push({ sign: sign, points: region });

        const higherIsBad = pluginOptions.higherIsBad === true;
        regions.forEach(item => {
          const currentHigher = item.sign > 0;
          const good = higherIsBad ? !currentHigher : currentHigher;
          drawBand(
            item.points,
            good ? 'rgba(5, 150, 105, 0.25)' : 'rgba(220, 38, 38, 0.23)'
          );
        });

        // v6.407: the Remake chart passes selected month indexes. Wash out
        // every unselected month after drawing the comparison band, without
        // changing the underlying dataset values or comparison calculations.
        const selectedMonthIndexesV6407 = new Set((pluginOptions.selectedMonthIndexesV6407 || []).map(Number).filter(Number.isFinite));
        const xScaleV6407 = chart.scales && chart.scales.x;
        if (selectedMonthIndexesV6407.size && xScaleV6407) {
          const labelCountV6407 = (chart.data.labels || []).length;
          ctx.fillStyle = 'rgba(248,250,252,.82)';
          for (let indexV6407 = 0; indexV6407 < labelCountV6407; indexV6407 += 1) {
            if (selectedMonthIndexesV6407.has(indexV6407)) continue;
            const centerV6407 = xScaleV6407.getPixelForValue(indexV6407);
            const prevV6407 = indexV6407 > 0 ? xScaleV6407.getPixelForValue(indexV6407 - 1) : chartArea.left;
            const nextV6407 = indexV6407 < labelCountV6407 - 1 ? xScaleV6407.getPixelForValue(indexV6407 + 1) : chartArea.right;
            const leftV6407 = indexV6407 > 0 ? (prevV6407 + centerV6407) / 2 : chartArea.left;
            const rightV6407 = indexV6407 < labelCountV6407 - 1 ? (centerV6407 + nextV6407) / 2 : chartArea.right;
            ctx.fillRect(leftV6407, chartArea.top, Math.max(1, rightV6407 - leftV6407), chartArea.bottom - chartArea.top);
          }
        }

        ctx.restore();
      }
    };

    const revenueTrendCalloutsPlugin = {
      id: 'revenueTrendCallouts',
      afterDatasetsDraw(chart, args, pluginOptions) {
        if (!pluginOptions || pluginOptions.display === false) return;
        if (!chart || !chart.chartArea || !chart.data || !chart.data.datasets) return;

        const ctx = chart.ctx;
        const chartArea = chart.chartArea;
        const xScale = chart.scales && chart.scales.x;
        const yScale = chart.scales && chart.scales.y;
        if (!ctx || !xScale || !yScale) return;

        const currentYear = Number(pluginOptions.currentYear || 2026);
        const priorYear = Number(pluginOptions.priorYear || currentYear - 1);
        const datasets = chart.data.datasets || [];
        const currentIndex = datasets.findIndex(ds => Number(ds.label) === currentYear);
        const priorIndex = datasets.findIndex(ds => Number(ds.label) === priorYear);
        const current = currentIndex >= 0 ? datasets[currentIndex] : null;
        const prior = priorIndex >= 0 ? datasets[priorIndex] : null;
        if (!current || !prior || !Array.isArray(current.data) || !Array.isArray(prior.data)) return;
        const selectedMonthIndexesV6407 = new Set((pluginOptions.selectedMonthIndexesV6407 || []).map(Number).filter(Number.isFinite));
        const hasMonthHighlightV6407 = selectedMonthIndexesV6407.size > 0;

        const currentMeta = chart.getDatasetMeta(currentIndex);
        const priorMeta = chart.getDatasetMeta(priorIndex);

        function roundedRect(x, y, w, h, r) {
          const radius = Math.min(r, w / 2, h / 2);
          ctx.beginPath();
          ctx.moveTo(x + radius, y);
          ctx.lineTo(x + w - radius, y);
          ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
          ctx.lineTo(x + w, y + h - radius);
          ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
          ctx.lineTo(x + radius, y + h);
          ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
          ctx.lineTo(x, y + radius);
          ctx.quadraticCurveTo(x, y, x + radius, y);
          ctx.closePath();
        }

        function dot(x, y, color) {
          ctx.beginPath();
          ctx.arc(x, y, 3.2, 0, Math.PI * 2);
          ctx.fillStyle = color;
          ctx.fill();
          ctx.lineWidth = 1.4;
          ctx.strokeStyle = '#ffffff';
          ctx.stroke();
        }

        function lastFinitePoint(ds) {
          if (!ds || !Array.isArray(ds.data)) return null;
          for (let i = ds.data.length - 1; i >= 0; i--) {
            const value = Number(ds.data[i]);
            if (Number.isFinite(value)) return { index: i, value };
          }
          return null;
        }

        function deltaForIndex(index) {
          const cur = Number(current.data[index]);
          const prev = Number(prior.data[index]);
          if (!Number.isFinite(cur) || !Number.isFinite(prev)) return null;
          const delta = cur - prev;
          if (!Math.abs(cur) && !Math.abs(prev)) return null;
          if (!Math.abs(prev) && Math.abs(cur)) return { delta, pct: null, isNew: true };
          if (!Math.abs(prev)) return null;
          return { delta, pct: delta / Math.abs(prev), isNew: false };
        }

        function pctText(delta) {
          if (delta && delta.isNew) return 'New';
          if (pluginOptions && pluginOptions.deltaAsPoints === true) {
            const points = delta ? Number(delta.delta) : NaN;
            if (!Number.isFinite(points)) return '';
            const roundedPoints = Math.round(points * 10) / 10;
            return (roundedPoints > 0 ? '+' : '') + roundedPoints.toFixed(1) + '%';
          }
          const pct = delta ? delta.pct : null;
          if (!Number.isFinite(pct)) return '';
          const rounded = Math.round(pct * 100);
          return (rounded > 0 ? '+' : '') + rounded + '%';
        }

        function clamp(value, min, max) {
          return Math.max(min, Math.min(max, value));
        }

        function xForIndex(index) {
          const point = currentMeta && currentMeta.data ? currentMeta.data[index] : null;
          if (point && Number.isFinite(point.x)) return point.x;
          return xScale.getPixelForValue(index);
        }

        function visibleTickIndexes() {
          const maxIndex = Math.min(current.data.length, prior.data.length) - 1;
          const raw = (xScale.ticks || []).map(tick => Number(tick.value)).filter(Number.isFinite);
          let indexes = raw.map(value => Math.round(value)).filter(index => index >= 0 && index <= maxIndex);
          if (!indexes.length) {
            indexes = [0, Math.round(maxIndex / 2), maxIndex];
          }
          indexes.push(0, maxIndex);
          indexes = Array.from(new Set(indexes)).sort((a, b) => a - b);

          // Keep this readable: monthly charts can show every month, but daily charts only show the visible tick anchors.
          const MAX_BADGES = current.data.length <= 7 ? 7 : 6;
          if (indexes.length > MAX_BADGES) {
            const reduced = [];
            for (let i = 0; i < MAX_BADGES; i++) {
              reduced.push(indexes[Math.round(i * (indexes.length - 1) / (MAX_BADGES - 1))]);
            }
            indexes = Array.from(new Set(reduced)).sort((a, b) => a - b);
          }
          return indexes.filter(index => !!deltaForIndex(index));
        }

        function pointFor(meta, index) {
          return meta && meta.data ? meta.data[index] : null;
        }

        function drawDeltaText(index, placedLabels) {
          const delta = deltaForIndex(index);
          if (!delta) return;
          const cp = pointFor(currentMeta, index);
          const pp = pointFor(priorMeta, index);
          if (!cp && !pp) return;

          const higherIsBad = pluginOptions.higherIsBad === true;
          const good = higherIsBad ? delta.delta <= 0 : delta.delta >= 0;
          const text = pctText(delta);
          if (!text) return;
          const x = xForIndex(index);
          const anchorY = Math.min(
            cp && Number.isFinite(cp.y) ? cp.y : chartArea.bottom,
            pp && Number.isFinite(pp.y) ? pp.y : chartArea.bottom
          );

          ctx.save();
          ctx.font = '900 15px Roboto, Arial, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          const textWidth = ctx.measureText(text).width;
          const paddedWidth = textWidth + 14;
          let y = clamp(anchorY - 20, chartArea.top + 15, chartArea.bottom - 12);

          // Prevent near-overlap when the chart is narrow or the x-axis has many labels.
          const collision = placedLabels.find(label => Math.abs(label.x - x) < (label.w + paddedWidth) / 2 + 12 && Math.abs(label.y - y) < 16);
          if (collision) y = clamp(y - 15, chartArea.top + 12, chartArea.bottom - 10);

          // Tiny white halo keeps the text readable without turning it into a pill.
          ctx.lineWidth = 4;
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.94)';
          ctx.strokeText(text, x, y);
          const highlightedV6407 = !hasMonthHighlightV6407 || selectedMonthIndexesV6407.has(index);
          ctx.fillStyle = highlightedV6407 ? (good ? '#047857' : '#b91c1c') : '#94a3b8';
          if (!highlightedV6407) ctx.globalAlpha = .78;
          ctx.fillText(text, x, y);
          placedLabels.push({ x, y, w: paddedWidth });
          ctx.restore();
        }

        ctx.save();

        // Executive read: show clean YoY percent deltas directly above the higher data point.
        // Exact dollars stay in the hover tooltip and KPI cards.
        const indexes = visibleTickIndexes();
        if (indexes.length) {
          const placedLabels = [];
          indexes.forEach(index => drawDeltaText(index, placedLabels));
        }

        // Keep the final data points visible. Exact values stay in the dark hover tooltip and KPI cards.
        const currentPoint = lastFinitePoint(current);
        const priorPoint = lastFinitePoint(prior);
        if (currentMeta && currentPoint && currentMeta.data[currentPoint.index]) {
          const p = currentMeta.data[currentPoint.index];
          dot(p.x, p.y, hasMonthHighlightV6407 && !selectedMonthIndexesV6407.has(currentPoint.index) ? '#94a3b8' : (colors[currentYear]?.border || '#2563eb'));
        }
        if (priorMeta && priorPoint && priorMeta.data[priorPoint.index]) {
          const p = priorMeta.data[priorPoint.index];
          dot(p.x, p.y, hasMonthHighlightV6407 && !selectedMonthIndexesV6407.has(priorPoint.index) ? '#cbd5e1' : (colors[priorYear]?.border || '#8da2bd'));
        }

        ctx.restore();
      }
    };

    Chart.register(executiveValueLabelPlugin, executiveTrendBackgroundPlugin, overviewLegendSpacingPlugin, revenueGapBandPlugin, revenueTrendCalloutsPlugin);

    Chart.defaults.font.family = 'Roboto, Arial, sans-serif';
    Chart.defaults.color = '#3c4043';

    const state = {
      activeTab: 'one',
      deptMode: 'MAIN',
      periodMode: 'YTD',
      selectedMonth: null,
      selectedMonths: new Set(),
      monthSelectionMode: 'none',
      lastSelectedMonth: null,
      selectedDepartments: new Set(),
      selectedProductKeys: new Set(),

      if (currentSnapshot === undoState.lastSnapshot) return;
      try {

        undoState.redoStack = [];

    function updateUndoButtonState() {

      const canUndo = undoState.stack.length > 0;
      const canRedo = undoState.redoStack && undoState.redoStack.length > 0;
      if (undoButton) {
        undoButton.disabled = !canUndo;
        undoButton.title = canUndo ? 'Undo last filter change (Ctrl/Cmd+Z)' : 'No filter changes to undo yet';
      }

    function pushRedoSnapshot(snapshot) {
      if (!undoState.redoStack) undoState.redoStack = [];
      undoState.redoStack.push(snapshot);
      if (undoState.redoStack.length > undoState.max) undoState.redoStack.shift();
    }

    function pushUndoSnapshot(snapshot) {

    function undoLastFilterChange() {
      if (!undoState.stack.length) return;
      const current = snapshotFilterState();
      const previous = undoState.stack.pop();
      pushRedoSnapshot(current);
      undoState.restoring = true;
      try {
        applyFilterSnapshot(previous);
        renderAll();
      } finally {
        undoState.restoring = false;
        undoState.lastSnapshot = serializeFilterSnapshot();
        updateUndoButtonState();
      }
    }

    function redoLastFilterChange() {
      if (!undoState.redoStack || !undoState.redoStack.length) return;
      const current = snapshotFilterState();
      const next = undoState.redoStack.pop();
      pushUndoSnapshot(current);
      undoState.restoring = true;
      try {

        undoState.lastSnapshot = serializeFilterSnapshot();

    function idbOpen() {
      return new Promise((resolve, reject) => {
        if (!window.indexedDB) {
          reject(new Error('IndexedDB unavailable'));
          return;
        }

        const request = indexedDB.open(fastCacheConfig.dbName, 1);
        request.onupgradeneeded = event => {
          const db = event.target.result;
          if (!db.objectStoreNames.contains(fastCacheConfig.storeName)) {
            db.createObjectStore(fastCacheConfig.storeName);
          }
        };
        request.onsuccess = event => resolve(event.target.result);
        request.onerror = event => reject(event.target.error || new Error('IndexedDB open failed'));
      });
    }

    function idbGet(key) {
      return idbOpen().then(db => new Promise((resolve, reject) => {
        const tx = db.transaction(fastCacheConfig.storeName, 'readonly');
        const store = tx.objectStore(fastCacheConfig.storeName);
        const request = store.get(key);
        request.onsuccess = event => resolve(event.target.result || null);
        request.onerror = event => reject(event.target.error || new Error('IndexedDB get failed'));
        tx.oncomplete = () => db.close();
        tx.onerror = () => db.close();
      }));
    }

    function idbSet(key, value) {
      return idbOpen().then(db => new Promise((resolve, reject) => {
        const tx = db.transaction(fastCacheConfig.storeName, 'readwrite');
        const store = tx.objectStore(fastCacheConfig.storeName);
        store.put(value, key);
        tx.oncomplete = () => { db.close(); resolve(true); };
        tx.onerror = event => { db.close(); reject(event.target.error || new Error('IndexedDB set failed')); };
      }));
    }

    function applyCustomerStatusSidecar(normalizedRows, statusRows) {
      if (!Array.isArray(statusRows) || !statusRows.length) return normalizedRows;

      const statusByCustomerId = new Map();
      statusRows.forEach(row => {
        const customerId = String(row.customerId || row.Customers_CustomerID || '').trim();
        if (!customerId) return;
        const rawActive = row.customerActive;
        const isActive = rawActive === false || rawActive === 'false' || rawActive === 0 || rawActive === '0' ? false : true;
        statusByCustomerId.set(customerId, isActive);
      });

      if (!statusByCustomerId.size) return normalizedRows;

      return normalizedRows.map(row => {
        const customerId = String(row.customerId || '').trim();
        if (!statusByCustomerId.has(customerId)) return row;
        return {
          ...row,
          customerActive: statusByCustomerId.get(customerId)
        };
      });
    }

    function applyMonthSelection(month, additive, range) {
      const value = Number(month);
      if (!value) return;
      if (!state.selectedMonths) state.selectedMonths = new Set();

      if (range && state.lastSelectedMonth) {
        const start = Math.min(Number(state.lastSelectedMonth), value);
        const end = Math.max(Number(state.lastSelectedMonth), value);
        const rangeValues = [];
        for (let monthNum = start; monthNum <= end; monthNum++) rangeValues.push(monthNum);

        if (additive) {
          rangeValues.forEach(monthNum => state.selectedMonths.add(monthNum));
        } else {
          state.selectedMonths = new Set(rangeValues);
        }
        state.monthSelectionMode = 'multi';
      } else if (additive) {
        if (state.selectedMonths.has(value)) state.selectedMonths.delete(value);
        else state.selectedMonths.add(value);
        state.monthSelectionMode = 'multi';
      } else {
        state.selectedMonths = new Set([value]);
        state.monthSelectionMode = 'drill';
      }

      state.lastSelectedMonth = value;
      if (!state.selectedMonths.size) {
        state.monthSelectionMode = 'none';
        state.lastSelectedMonth = null;

      state.periodMode = hasMonthFilter() ? 'MTD' : 'YTD';

      if (!state.excludedProductKeys) state.excludedProductKeys = new Set();
      productOptions.forEach(item => {

      if (!state.excludedCustomerIds) state.excludedCustomerIds = new Set();

      if (!state.excludedProductKeys) state.excludedProductKeys = new Set();

      state.selectedDepartments.add(department);

    function buildProductControls() {
      const products = new Map();

      facts.forEach(row => {
        if (!products.has(productKey(row))) {
          products.set(productKey(row), row);
        }
      });

      productOptions = [...products.entries()]
        .map(([key, row]) => ({
          key,
          label: row.productsDescription + ' — ' + row.productsDepartment,
          department: row.productsDepartment,
          productId: row.productId,
          searchText: (row.productsDescription + ' ' + row.productsDepartment + ' ' + row.productId).toLowerCase()
        }))
        .sort((a,b) => a.label.localeCompare(b.label));

      productLabelByKey = new Map(productOptions.map(item => [item.key, item.label + ' [' + item.productId + ']']));
    }


    function getDisplayedProductOptions() {

      if (!state.collapseSelectedProducts) return rows;

    }


    function buildCustomerControls() {
      const customers = new Map();

      facts.forEach(row => {
        if (!customers.has(row.customerId)) {
          customers.set(row.customerId, {
            name: row.customerName,
            active: row.customerActive !== false
          });
        } else if (row.customerActive === false) {
          customers.get(row.customerId).active = false;
        }
      });

      customerOptions = [...customers.entries()]
        .map(([idValue, info]) => {
          const name = info && info.name ? info.name : idValue;
          const inactiveText = info && info.active === false ? ' inactive' : '';
          return {
            idValue,
            label: String(name || idValue),
            active: !(info && info.active === false),
            searchText: (String(name || '') + ' ' + String(idValue || '') + inactiveText).toLowerCase()
          };
        })
        .sort((a,b) => a.label.localeCompare(b.label));

      customerLabelById = new Map(customerOptions.map(item => [item.idValue, item.label]));
    }

      // Keep Set-backed state safe without forcing sibling dropdowns to empty.
      // A cleared dashboard must be recoverable by checking one department,
      // product, or customer.
      if (!state.selectedDepartments) state.selectedDepartments = new Set();
      if (!state.selectedProductKeys) state.selectedProductKeys = new Set();

    function getFilteredFacts(ignore = {}) {
      return facts.filter(row => {
        if (!ignore.years && !state.years.has(row.year)) return false;
        if (!ignore.departments && !state.selectedDepartments.has(row.productsDepartment)) return false;
        if (!ignore.product && state.productFilterMode === 'CUSTOM' && !state.selectedProductKeys.has(productKey(row))) return false;
        if (!ignore.product && state.productFilterMode !== 'CUSTOM' && state.excludedProductKeys && state.excludedProductKeys.has(productKey(row))) return false;
        if (!ignore.customer && state.customerActiveOnly && row.customerActive === false) return false;
        if (!ignore.customer && state.customerFilterMode === 'CUSTOM' && !state.selectedCustomerIds.has(row.customerId)) return false;
        if (!ignore.customer && state.customerFilterMode !== 'CUSTOM' && state.excludedCustomerIds && state.excludedCustomerIds.has(row.customerId)) return false;
        if (!ignore.month && hasMonthFilter() && !state.selectedMonths.has(row.monthNum)) return false;
        return true;
      });

    function getDisplayYears() {

    function summarize(rows) {
      const { currentYear, priorYear } = getCurrentPriorYears();
      const currentRows = rows.filter(row => row.year === currentYear);
      const priorRows = rows.filter(row => row.year === priorYear);

      const revenue = sum(currentRows, 'netRevenue');
      const priorRevenue = sum(priorRows, 'netRevenue');
      const units = sum(currentRows, 'units');
      const priorUnits = sum(priorRows, 'units');
      const customers = distinctCount(currentRows, 'customerId');
      const priorCustomers = distinctCount(priorRows, 'customerId');
      const avgPrice = units ? revenue / units : 0;
      const priorAvgPrice = priorUnits ? priorRevenue / priorUnits : 0;
      const rpac = customers ? revenue / customers : 0;
      const priorRpac = priorCustomers ? priorRevenue / priorCustomers : 0;
      const gap = revenue - priorRevenue;

      return {
        revenue,
        priorRevenue,
        gap,
        gapPct: priorRevenue ? gap / Math.abs(priorRevenue) : null,
        units,
        priorUnits,
        customers,
        priorCustomers,
        rpac,
        priorRpac,
        avgPrice,
        priorAvgPrice
      };
    }

    }

    function hasCustomerDropdownRestriction() {
      if (state.customerFilterMode === 'CUSTOM') return true;
      return getExcludedCustomerIds().length > 0;
    }

    function hasLinkedDropdownRestriction() {
      return hasProductDropdownRestriction() || hasCustomerDropdownRestriction();
    }

    function isLinkedDropdownZeroState() {
      const departmentNone = !state.selectedDepartments || state.selectedDepartments.size === 0;
      const productNone = state.productFilterMode === 'CUSTOM' && getSelectedProductKeys().length === 0;
      const customerNone = state.customerFilterMode === 'CUSTOM' && getSelectedCustomerIds().length === 0;
      return departmentNone || productNone || customerNone;
    }

    function selectedDepartmentsEqual(departments) {
      return setsEqual(state.selectedDepartments || new Set(), new Set(departments || []));
    }


    function updateButtonStates() {
      setActive('btnMain', isQuickDepartmentState('MAIN'));
      setActive('btnAll', isQuickDepartmentState('ALL'));
      setActive('btnYtd', state.periodMode === 'YTD' && !hasMonthFilter());
      setActive('btnMtd', state.periodMode === 'MTD' || hasMonthFilter());

      ['productLossesBtn','customerLossesBtn'].forEach(id => setActive(id, (id.startsWith('product') ? state.productSort : state.customerSort) === 'losses'));
      ['productGainsBtn','customerGainsBtn'].forEach(id => setActive(id, (id.startsWith('product') ? state.productSort : state.customerSort) === 'gains'));
      ['productTopBtn','customerTopBtn'].forEach(id => setActive(id, (id.startsWith('product') ? state.productSort : state.customerSort) === 'top'));
      setActive('productUnitsBtn', state.productMetric === 'units');
      setActive('customerUnitsBtn', state.customerMetric === 'units');
    }

    function setActive(id, active) {
      const el = document.getElementById(id);
      if (el) el.classList.toggle('active', active);
    }

    function setHas(setValue, keyValue) {
      return !!(setValue && typeof setValue.has === 'function' && setValue.has(keyValue));
    }

    function dropdownCountText(selectedCount, totalCount, shownCount) {
      const total = Number(totalCount || 0);
      const selected = Number(selectedCount || 0);
      const shown = Number(shownCount || 0);
      if (!total) return '';
      return selected.toLocaleString() + ' of ' + total.toLocaleString() + ' selected • ' + shown.toLocaleString() + ' shown';
    }

    function setCollapseButton(id, collapsed) {
      // Kept as a compatibility no-op. v6.103 moved selected collapse from a
      // toolbar button into a caret row inside each dropdown list.
    }

    function selectedCollapseHeader(kind, collapsed, selectedCount, label) {
      if (!selectedCount) return '';
      const safeLabel = label || 'Selected';
      const title = collapsed ? 'Show selected options' : 'Hide selected options';
      return `
        <div class="optionCollapseHeader" onclick="toggleCollapseSelected('${kind}', event)" title="${title}">
          <span class="collapseCaret">${collapsed ? '▸' : '▾'}</span>
          <span>${escapeHtml(safeLabel)}</span>
          <span class="collapseCount">${Number(selectedCount || 0).toLocaleString()}</span>
        </div>`;
    }

    function toggleCollapseSelected(kind, event) {
      if (event) event.stopPropagation();
      if (kind === 'departments') {
        state.collapseSelectedDepartments = !state.collapseSelectedDepartments;
        renderDepartmentList();
      } else if (kind === 'products') {
        state.collapseSelectedProducts = !state.collapseSelectedProducts;
        renderProductList();
      } else if (kind === 'customers') {
        state.collapseSelectedCustomers = !state.collapseSelectedCustomers;
        renderCustomerList();
      } else if (kind === 'years') {
        state.collapseSelectedYears = !state.collapseSelectedYears;
        renderYearList();
      }
    }

    function shouldTreatEmptyEffectiveSetAsNone(kind, effectiveSet) {
      // When a linked filter has been cleared, getAvailable* can be empty while
      // the full dropdown inventory is still displayed. In that zero-result
      // state, the checklist should not visually claim every item is selected.
      if (!effectiveSet || effectiveSet.size) return false;
      if (kind === 'departments') {
        return isEmptyCustomProductFilter() || isEmptyCustomCustomerFilter();
      }
      if (kind === 'products') {
        return isEmptyDepartmentFilter() || isEmptyCustomCustomerFilter();
      }
      if (kind === 'customers') {
        return isEmptyDepartmentFilter() || isEmptyCustomProductFilter();
      }
      return false;
    }






    function isDefaultYearSelection() {
      const defaultYears = new Set(getDefaultYears());
      if (!state.years || state.years.size !== defaultYears.size) return false;
      return [...state.years].every(year => defaultYears.has(year));
    }

    function hasOptionAffinityContext(ignore = {}) {
      const hasProductFilter = !ignore.product && ((state.productFilterMode === 'CUSTOM' && getSelectedProductKeys().length > 0) || (state.productFilterMode !== 'CUSTOM' && getExcludedProductKeys().length > 0));
      const hasCustomerFilter = !ignore.customer && ((state.customerFilterMode === 'CUSTOM' && getSelectedCustomerIds().length > 0) || (state.customerFilterMode !== 'CUSTOM' && getExcludedCustomerIds().length > 0));
      const mainDeptSet = new Set(getMainDepartments());
      const selectedDeptSet = state.selectedDepartments || new Set();
      const hasCustomDepartmentFilter = selectedDeptSet.size > 0 && selectedDeptSet.size < getAllDepartments().length;
      const hasMainDepartmentContext = state.deptMode === 'MAIN' && mainDeptSet.size > 0 && setsEqual(selectedDeptSet, mainDeptSet);
      const hasDepartmentFilter = !ignore.departments && (hasCustomDepartmentFilter || hasMainDepartmentContext);
      const hasYearFilter = !ignore.years && state.years && state.years.size > 0 && !isDefaultYearSelection();
      const hasMonthContext = !ignore.month && hasMonthFilter();
      return !!(hasProductFilter || hasCustomerFilter || hasDepartmentFilter || hasYearFilter || hasMonthContext);
    }

    function buildOptionAffinitySet(ignore, keyFn) {
      if (!hasOptionAffinityContext(ignore)) return new Set();
      const result = new Set();
      getFilteredFacts(ignore).forEach(row => {
        const key = keyFn(row);
        if (key !== null && key !== undefined && key !== '') result.add(key);
      });
      return result;
    }

    function getDepartmentAffinitySet() {
      return buildOptionAffinitySet({ departments: true }, row => row.productsDepartment);
    }

    function hasDepartmentAffinityContext() {
      const selectedDeptSet = state.selectedDepartments || new Set();
      if (!selectedDeptSet.size) return false;
      if (state.deptMode === 'MAIN') return true;
      if (state.deptMode === 'CUSTOM') return true;
      const allDeptSet = new Set(getAllDepartments());
      return !setsEqual(selectedDeptSet, allDeptSet);
    }

    function rowMatchesDepartmentContext(row) {
      if (!hasDepartmentAffinityContext()) return false;
      return state.selectedDepartments && state.selectedDepartments.has(row.productsDepartment);
    }

    function rowMatchesYearMonthContext(row) {
      if (state.years && state.years.size && !state.years.has(row.year)) return false;
      if (hasMonthFilter() && !state.selectedMonths.has(row.monthNum)) return false;
      return true;
    }

    function getProductAffinitySet() {
      const result = new Set();

      // Department buttons are an active filter even when Products is still set to "All products".
      // Make those department-matching products visibly rise to the top of the Product dropdown.
      if (hasDepartmentAffinityContext()) {
        productOptions.forEach(item => {
          if (state.selectedDepartments && state.selectedDepartments.has(item.department)) result.add(item.key);
        });
      }

      // Also raise products touched by the current customer/year/month context.
      if (hasOptionAffinityContext({ product: true }) || result.size) {
        getFilteredFacts({ product: true }).forEach(row => {
          if (rowMatchesYearMonthContext(row)) result.add(productKey(row));
        });
      }

      return result;
    }

    function getCustomerAffinitySet() {
      const result = new Set();

      // Department buttons are an active filter even when Customers is still set to "All customers".
      if (hasDepartmentAffinityContext()) {
        facts.forEach(row => {
          if (rowMatchesDepartmentContext(row) && rowMatchesYearMonthContext(row)) result.add(row.customerId);
        });
      }

      // Also raise customers touched by current product/year/month context.
      if (hasOptionAffinityContext({ customer: true }) || result.size) {
        getFilteredFacts({ customer: true }).forEach(row => {
          if (rowMatchesYearMonthContext(row)) result.add(row.customerId);
        });
      }

      return result;
    }

    function getYearAffinitySet() {
      return buildOptionAffinitySet({ years: true }, row => row.year);
    }

    function compareOptionPriority(aKey, bKey, selectedSet, affinitySet) {
      const selectedDiff = (setHas(selectedSet, bKey) ? 1 : 0) - (setHas(selectedSet, aKey) ? 1 : 0);
      if (selectedDiff) return selectedDiff;

      const affinityDiff = (setHas(affinitySet, bKey) ? 1 : 0) - (setHas(affinitySet, aKey) ? 1 : 0);
      if (affinityDiff) return affinityDiff;

      return 0;
    }

    function renderAfterBulkDropdownSelection(panelId) {
      // Select all / Clear can touch hundreds of options at once. Render the
      // dashboard once, then explicitly refresh the open checklist so the
      // clicked button visibly changes the checkboxes immediately.
      const targetPanelId = panelId || (getOpenDropdownState().panelId || '');
      renderAll();
      if (targetPanelId) {
        const panel = document.getElementById(targetPanelId);
        if (panel) panel.classList.add('open');
        if (targetPanelId === 'departmentDropdownPanel') renderDepartmentList();
        if (targetPanelId === 'productDropdownPanel') renderProductList();
        if (targetPanelId === 'customerDropdownPanel') renderCustomerList();
        if (targetPanelId === 'yearDropdownPanel') renderYearList();
      }
    }


    function getDisplayedDepartmentRows() {
      const rows = getVisibleDepartmentRows();
      if (!state.collapseSelectedDepartments) return rows;
      const effectiveDepartments = getAvailableDepartmentSetForDropdown();
      return rows.filter(row => !isDepartmentCheckedForDropdown(row.department, effectiveDepartments));
    }


    function renderYearList() {
      const affinityYears = getYearAffinitySet();
      const rows = [2026, 2025, 2024].map(year => {
        // Keep the year control independent from product/customer/department filters so
        // managers can always see and re-select every year option.
        const yearRows = facts.filter(row => row.year === year);
        return { year, revenue: sum(yearRows, 'netRevenue') };
      }).sort((a, b) => {
        const priorityDiff = compareOptionPriority(a.year, b.year, state.years, affinityYears);
        if (priorityDiff) return priorityDiff;
        return b.year - a.year;
      });

      const checkedRows = rows.filter(row => state.years.has(row.year));
      const uncheckedRows = rows.filter(row => !state.years.has(row.year));
      const shownCount = state.collapseSelectedYears ? uncheckedRows.length : rows.length;
      const countEl = document.getElementById('yearVisibleCount');
      if (countEl) countEl.textContent = dropdownCountText(checkedRows.length, rows.length, shownCount);
      setCollapseButton('yearCollapseBtn', state.collapseSelectedYears);

      const rowHtml = row => `
        <div class="yearRow ${state.years.has(row.year) ? 'active' : ''}" onclick="toggleYear(${row.year}, event)">
          <div class="labelSide">
            <input type="checkbox" tabindex="-1" onclick="event.preventDefault()" ${state.years.has(row.year) ? 'checked' : ''}>
            <span>${row.year}</span>
          </div>
          <span class="rowTotal">${formatCompact(row.revenue)}</span>
        </div>`;

      const parts = [];
      parts.push(selectedCollapseHeader('years', state.collapseSelectedYears, checkedRows.length, 'Selected'));
      if (!state.collapseSelectedYears) parts.push(...checkedRows.map(rowHtml));
      parts.push(...uncheckedRows.map(rowHtml));

      document.getElementById('yearList').innerHTML = parts.join('') || '<div class="emptyFilterRow">No years match that view.</div>';
    }

    function getDefaultYears() {
      return [payload.config.currentYear, payload.config.priorYear].filter(Boolean);
    }

    function setsEqual(a, b) {
      if (!a || !b || a.size !== b.size) return false;
      for (const value of a) {
        if (!b.has(value)) return false;
      }
      return true;
    }

    function listForTooltip(items, emptyText) {
      const cleaned = (items || []).filter(item => item !== null && item !== undefined && String(item).trim() !== '').map(item => String(item));
      if (!cleaned.length) return emptyText || '';
      const maxItems = 60;
      const shown = cleaned.slice(0, maxItems);
      const extra = cleaned.length - shown.length;
      return shown.join('\n') + (extra > 0 ? '\n+' + extra + ' more' : '');
    }

    function getCustomerNameById(customerId) {
      if (customerLabelById && customerLabelById.has(customerId)) return customerLabelById.get(customerId);
      const row = facts.find(f => f.customerId === customerId);
      return row ? row.customerName : customerId;
    }


    function renderKpis() {
      const metrics = summarize(getFilteredFacts());
      const { priorYear } = getCurrentPriorYears();

      setComparisonKpi('miniRevenue', metrics.revenue, metrics.priorRevenue, formatCurrency, priorYear);
      setComparisonKpi('miniCustomers', metrics.customers, metrics.priorCustomers, formatNumber, priorYear);
      setComparisonKpi('miniUnits', metrics.units, metrics.priorUnits, formatNumber, priorYear);
      setComparisonKpi('miniAvg', metrics.avgPrice, metrics.priorAvgPrice, formatCurrency, priorYear);
      setComparisonKpi('miniRpac', metrics.rpac, metrics.priorRpac, formatCurrency, priorYear);

      setText('bigRevenue', formatCurrency(metrics.revenue));
      setText('bigPrior', formatCurrency(metrics.priorRevenue));
      setText('bigGap', formatCurrency(metrics.gap));
      setText('bigCustomers', formatNumber(metrics.customers));
      setText('bigAvg', formatCurrency(metrics.avgPrice));
    }

    function setComparisonKpi(baseId, currentValue, priorValue, formatter, priorYear) {
      const current = Number(currentValue || 0);
      const prior = Number(priorValue || 0);
      const gap = current - prior;
      const pct = prior ? gap / Math.abs(prior) : null;
      const deltaText = formatKpiDelta(gap, pct, formatter);

      setText(baseId, formatter(current));
      setText(baseId + 'Prior', priorYear + ': ' + formatter(prior));
      setText(baseId + 'Delta', deltaText);
      setTone(baseId + 'Delta', gap);
    }

    function formatKpiDelta(gap, pct, formatter) {
      const n = Number(gap || 0);
      const arrow = n > 0 ? '▲' : n < 0 ? '▼' : '•';
      const pctText = pct === null || pct === undefined || !isFinite(Number(pct)) ? '' : ' (' + formatSignedPercent(pct) + ')';
      return arrow + ' ' + formatter(n) + pctText;
    }

    function setTone(id, value) {
      const el = document.getElementById(id);
      if (!el) return;
      el.classList.remove('good', 'bad');
      el.classList.add(Number(value) >= 0 ? 'good' : 'bad');
    }

    function renderCharts() {

      const rows = getFilteredFacts({month:true});
      const months = getChartMonths(rows);
      const years = getDisplayYears();

      destroyChartsForTab('two');
      drawRevenueTrendChart('chartRevenue', rows, years);
      drawMetricChart('chartCustomers', 'bar', rows, months, years, 'customers', formatNumber);
      drawMetricChart('chartUnits', 'bar', rows, months, years, 'units', formatNumber);
      drawMetricChart('chartRpac', 'bar', rows, months, years, 'rpac', formatCurrency);
      drawMetricChart('chartAvg', 'bar', rows, months, years, 'avgPrice', formatCurrency);

      updateChartFocusStyles();
    }

    function getChartMonths(rows) {
      const selectedMonths = getSelectedMonths();
      if (selectedMonths.length && state.monthSelectionMode !== 'multi') return selectedMonths;

      const months = [...new Set(rows.map(row => row.monthNum))]
        .filter(Boolean)
        .sort((a,b) => a-b);

      return months.length ? months : [1,2,3,4,5,6];
    }

    function hasDailyRevenueRows(rows) {
      const selectedMonth = getSingleSelectedMonth();
      return !!selectedMonth && rows.some(row => row.invoiceDate && row.dayOfMonth && row.monthNum === selectedMonth);
    }

    function shouldUseDailyRevenueTrend(baseRows) {
      const selectedMonth = getSingleSelectedMonth();
      return !!selectedMonth && state.monthSelectionMode !== 'multi' && hasDailyRevenueRows(baseRows);
    }

    function getRevenueTrendRows(baseRows) {
      const selectedMonth = getSingleSelectedMonth();
      if (!shouldUseDailyRevenueTrend(baseRows)) {
        return {
          mode: 'monthly',
          rows: baseRows,
          labels: getChartMonths(baseRows).map(month => monthLabels[month - 1]),
          points: getChartMonths(baseRows)
        };
      }

      const monthRows = getFilteredFacts().filter(row => row.monthNum === selectedMonth);
      const maxDayFromData = Math.max(
        0,
        ...monthRows.map(row => Number(row.dayOfMonth || 0)).filter(Boolean)
      );
      const selectedYears = getDisplayYears();
      const fallbackMaxDay = selectedYears.length
        ? Math.min(...selectedYears.map(year => daysInMonth(year, selectedMonth)))
        : 31;
      const maxDay = Math.max(1, maxDayFromData || fallbackMaxDay);
      const points = Array.from({length: maxDay}, (_, index) => index + 1);

      return {
        mode: 'dailyCumulative',
        rows: monthRows,
        labels: points.map(day => String(day)),
        points
      };
    }

    function dailyCumulativeMetricFor(rows, year, day) {
      const scoped = rows.filter(row =>
        row.year === Number(year) &&
        row.monthNum === Number(getSingleSelectedMonth()) &&
        Number(row.dayOfMonth || 0) <= Number(day)
      );

      return {
        revenue: sum(scoped, 'netRevenue'),
        units: sum(scoped, 'units'),
        customers: distinctCount(scoped, 'customerId')
      };
    }

    function drawRevenueTrendChart(canvasId, baseRows, years) {
      const currentYear = Number(payload && payload.config ? payload.config.currentYear : 2026);
      const priorYear = Number(payload && payload.config ? payload.config.priorYear : 2025);
      const trend = getRevenueTrendRows(baseRows);
      const isDaily = trend.mode === 'dailyCumulative';
      const selectedMonths = getSelectedMonths();
      const highlightMonthlySelection = !isDaily && state.monthSelectionMode === 'multi' && selectedMonths.length > 0;

      const datasets = years.map(year => {
        const color = colors[year] || colors[priorYear] || colors[2025];
        const isCurrent = Number(year) === currentYear;
        const isPrior = Number(year) === priorYear;

        return {
          label: String(year),
          data: trend.points.map(point => {
            if (isDaily) {
              const value = dailyCumulativeMetricFor(trend.rows, year, point).revenue;
              // v6.91: for filtered customer/product views, no purchase should read as a true zero, not a missing point.
              // This keeps the line flat on the baseline instead of creating odd diagonal fills/gaps.
              return Number.isFinite(Number(value)) ? Number(value) : 0;
            }

            const value = metricFor(trend.rows, year, point).revenue;
            // v6.91: missing rows inside the selected reporting period mean zero sales for this filter selection.
            // Future/nonexistent periods are handled by getRevenueTrendRows/getChartMonths, so keep the plotted series continuous.
            return Number.isFinite(Number(value)) ? Number(value) : 0;
          }),
          borderColor: color.border,
          backgroundColor: isCurrent ? color.area : 'transparent',
          pointBackgroundColor: color.border,
          pointBorderColor: '#ffffff',
          pointBorderWidth: isCurrent ? 2 : 0,
          pointRadius: highlightMonthlySelection
            ? trend.points.map(point => selectedMonths.includes(Number(point)) ? (isCurrent ? 4 : 2.5) : (isCurrent ? 1.6 : 0))
            : (isCurrent ? (isDaily ? 1.8 : 2.8) : 0),
          pointHoverRadius: highlightMonthlySelection
            ? trend.points.map(point => selectedMonths.includes(Number(point)) ? 5 : 3)
            : (isCurrent ? 5 : 0),
          borderWidth: isCurrent ? 3.4 : isPrior ? 2.2 : 1.8,
          borderDash: isCurrent ? [] : isPrior ? [7, 5] : [2, 5],
          fill: isCurrent ? 'origin' : false,
          tension: isDaily ? 0.28 : 0.38,
          spanGaps: false
        };
      });

      drawChart(canvasId, {
        type: 'line',
        data: {
          labels: trend.labels,
          datasets
        },
        options: chartOptions(formatCurrency, 'revenue', 'line', {
          currentYear,
          priorYear,
          isRevenueTrend: true,
          trendMode: trend.mode,
          selectedMonth: getSingleSelectedMonth(),
          canvasId
        })
      });
    }

    function metricFor(rows, year, month) {
      const scoped = rows.filter(row => row.year === year && row.monthNum === month);
      const revenue = sum(scoped, 'netRevenue');
      const units = sum(scoped, 'units');
      const customers = distinctCount(scoped, 'customerId');

      return {
        revenue,
        units,
        customers,
        rpac: customers ? revenue / customers : 0,
        avgPrice: units ? revenue / units : 0
      };
    }

    function drawMetricChart(canvasId, type, rows, months, years, metricKey, formatter) {
      const currentYear = Number(payload && payload.config ? payload.config.currentYear : 2026);
      const priorYear = Number(payload && payload.config ? payload.config.priorYear : 2025);
      const isRevenueTrend = type === 'line' && metricKey === 'revenue';
      const selectedMonths = getSelectedMonths();
      const highlightMonthlySelection = state.monthSelectionMode === 'multi' && selectedMonths.length > 0;

      const datasets = years.map(year => {
        const color = colors[year] || colors[priorYear] || colors[2025];
        const isCurrent = Number(year) === currentYear;
        const isPrior = Number(year) === priorYear;

        return {
          label: String(year),
          data: months.map(month => {
            const value = metricFor(rows, year, month)[metricKey];
            if (type === 'line' && !hasMetricRows(rows, year, month)) return null;
            return value;
          }),
          borderColor: type === 'line'
            ? color.border
            : (highlightMonthlySelection
              ? months.map(month => selectedMonths.includes(Number(month)) ? color.barBorder : color.area)
              : color.barBorder),
          backgroundColor: type === 'line'
            ? (isRevenueTrend && isCurrent ? color.area : 'transparent')
            : (highlightMonthlySelection
              ? months.map(month => selectedMonths.includes(Number(month)) ? color.bar : color.area)
              : color.bar),
          hoverBackgroundColor: type === 'bar' ? color.bar : undefined,
          hoverBorderColor: type === 'bar' ? color.barBorder : undefined,
          pointBackgroundColor: type === 'line' ? color.border : color.bar,
          pointBorderColor: '#ffffff',
          pointBorderWidth: type === 'line' && isCurrent ? 2 : 0,
          pointRadius: type === 'line' ? (isRevenueTrend ? (isCurrent ? 2.8 : 0) : (isCurrent ? 3 : 2.5)) : 0,
          pointHoverRadius: type === 'line' ? (isRevenueTrend ? (isCurrent ? 5 : 0) : (isCurrent ? 4 : 3.5)) : 0,
          borderWidth: type === 'line' ? (isCurrent ? 3.4 : isPrior ? 2.2 : 1.8) : 1.2,
          borderDash: type === 'line' ? (isCurrent ? [] : isPrior ? [7, 5] : [2, 5]) : [],
          fill: isRevenueTrend && isCurrent ? 'origin' : false,
          tension: type === 'line' ? (isRevenueTrend ? 0.38 : 0.25) : 0,
          spanGaps: false,
          borderRadius: 0,
          borderSkipped: false,
          maxBarThickness: type === 'bar' ? 34 : undefined,
          categoryPercentage: type === 'bar' ? 0.72 : undefined,
          barPercentage: type === 'bar' ? 0.82 : undefined
        };
      });

      const currentDataset = datasets.find(dataset => Number(dataset.label) === currentYear);
      const currentValues = currentDataset ? currentDataset.data.filter(value => Number(value || 0) && isFinite(Number(value || 0))).map(Number) : [];
      const averageValue = currentValues.length ? currentValues.reduce((total, value) => total + value, 0) / currentValues.length : 0;

      drawChart(canvasId, {
        type,
        data: {
          labels: months.map(month => monthLabels[month - 1]),
          datasets
        },
        options: chartOptions(formatter, metricKey, type, {
          currentYear,
          priorYear,
          isRevenueTrend,
          averageValue,
          canvasId
        })
      });
    }

    function hasMetricRows(rows, year, month) {
      return rows.some(row => row.year === Number(year) && row.monthNum === Number(month));
    }

    function getMetricAxisTitle(metricKey) {
      switch (metricKey) {
        case 'revenue':
          return 'Revenue';
        case 'customers':
          return 'Customers';
        case 'units':
          return 'Units';
        case 'rpac':
          return 'Revenue / customer';
        case 'avgPrice':
          return 'Avg $ / unit';
        default:
          return '';
      }
    }

    function chartOptions(formatter, metricKey, chartType, optionMeta = {}) {
      const isRevenueTrend = !!optionMeta.isRevenueTrend;
      const isBarChart = chartType === 'bar';
      const currentYear = Number(optionMeta.currentYear || 2026);
      const priorYear = Number(optionMeta.priorYear || 2025);
      const axisTitle = getMetricAxisTitle(metricKey);
      const xAxisTitle = optionMeta.trendMode === 'dailyCumulative' ? 'Day of month' : 'Month';

      return {
        responsive: true,
        maintainAspectRatio: false,
        layout: {
          padding: {
            top: isRevenueTrend ? 14 : isBarChart ? 0 : 8,
            right: isRevenueTrend ? 6 : isBarChart ? 2 : 5,
            bottom: isRevenueTrend ? 0 : isBarChart ? 0 : 2,
            left: isRevenueTrend ? 2 : isBarChart ? 0 : 3
          }
        },
        interaction: { mode: 'index', intersect: false },
        plugins: {
          overviewLegendSpacing: {
            display: true,
            padding: isRevenueTrend ? 4 : isBarChart ? 3 : 28
          },
          executiveTrendBackground: {
            display: isRevenueTrend,
            averageValue: 0,
            trendMode: optionMeta.trendMode || 'monthly'
          },
          revenueTrendMeta: {
            trendMode: optionMeta.trendMode || 'monthly',
            selectedMonth: optionMeta.selectedMonth || null,
            currentYear,
            priorYear
          },
          revenueGapBand: {
            display: isRevenueTrend,
            currentYear,
            priorYear
          },

    function externalRevenueTooltip(context, currentYear, priorYear) {
      const {chart, tooltip} = context;
      const tooltipEl = getOrCreateRevenueTooltip(chart);

      if (!tooltip || tooltip.opacity === 0) {
        tooltipEl.style.opacity = 0;
        return;
      }

      const point = (tooltip.dataPoints || []).find(item => Number(item.dataset.label) === currentYear) || (tooltip.dataPoints || [])[0];
      if (!point) {
        tooltipEl.style.opacity = 0;
        return;
      }

      const data = buildRevenueTooltipData(chart, point.dataIndex, currentYear, priorYear);
      const deltaClass = data.delta >= 0 ? 'deltaGood' : 'deltaBad';
      const arrow = data.delta >= 0 ? '▲' : '▼';
      const pct = data.deltaPct === null ? '' : ' (' + formatSignedPercent(data.deltaPct) + ')';

      const olderYearRow = data.olderYear
        ? `<div class="revenueTooltipRow comparison comparisonOlder"><span>${escapeHtml(String(data.olderYear))}</span><b>${escapeHtml(formatCurrency(data.older))}</b></div>`
        : '';

      tooltipEl.innerHTML = `
        <div class="revenueTooltipTitle">${escapeHtml(data.title)}</div>
        <div class="revenueTooltipRow current"><span>${escapeHtml(String(currentYear))}</span><b>${escapeHtml(formatCurrency(data.sales))}</b></div>
        <div class="revenueTooltipRow comparison"><span>${escapeHtml(String(priorYear))}</span><b>${escapeHtml(formatCurrency(data.prior))}</b></div>
        ${olderYearRow}
        <div class="revenueTooltipRow ${deltaClass}"><span>Δ vs ${escapeHtml(String(priorYear))}</span><b>${arrow} ${escapeHtml(formatCurrency(Math.abs(data.delta)))}${escapeHtml(pct)}</b></div>
      `;

      const canvasRect = chart.canvas.getBoundingClientRect();
      const parentRect = chart.canvas.parentNode.getBoundingClientRect();
      const leftBase = canvasRect.left - parentRect.left + tooltip.caretX;
      const topBase = canvasRect.top - parentRect.top + tooltip.caretY;

      tooltipEl.style.opacity = 1;
      tooltipEl.style.left = leftBase + 'px';
      tooltipEl.style.top = topBase + 'px';

      const width = tooltipEl.offsetWidth || 166;
      const parentWidth = chart.canvas.parentNode.clientWidth || 0;
      if (parentWidth && leftBase + width + 24 > parentWidth) {
        tooltipEl.style.transform = 'translate(calc(-100% - 10px), -50%)';
      } else {
        tooltipEl.style.transform = 'translate(10px, -50%)';
      }
    }

    function getOrCreateRevenueTooltip(chart) {
      let tooltipEl = chart.canvas.parentNode.querySelector('.revenueTooltip');
      if (!tooltipEl) {
        tooltipEl = document.createElement('div');
        tooltipEl.className = 'revenueTooltip';
        chart.canvas.parentNode.appendChild(tooltipEl);
      }
      return tooltipEl;
    }

    function buildRevenueTooltipData(chart, dataIndex, currentYear, priorYear) {
      const datasets = chart.data && chart.data.datasets ? chart.data.datasets : [];
      const currentDataset = datasets.find(dataset => Number(dataset.label) === currentYear);
      const priorDataset = datasets.find(dataset => Number(dataset.label) === priorYear);
      const olderDataset = datasets
        .filter(dataset => Number(dataset.label) !== currentYear && Number(dataset.label) !== priorYear)
        .sort((a, b) => Number(b.label) - Number(a.label))[0];

      const sales = Number(currentDataset && currentDataset.data ? currentDataset.data[dataIndex] || 0 : 0);
      const prior = Number(priorDataset && priorDataset.data ? priorDataset.data[dataIndex] || 0 : 0);
      const older = Number(olderDataset && olderDataset.data ? olderDataset.data[dataIndex] || 0 : 0);
      const olderYear = olderDataset ? Number(olderDataset.label) : null;
      const delta = sales - prior;
      const deltaPct = prior ? delta / Math.abs(prior) : null;
      const trendMeta = chart.options && chart.options.plugins ? chart.options.plugins.revenueTrendMeta || {} : {};
      const label = chart.data.labels[dataIndex] || '';
      const title = trendMeta.trendMode === 'dailyCumulative' && trendMeta.selectedMonth
        ? monthLabels[Number(trendMeta.selectedMonth) - 1] + ' ' + label + " '" + String(currentYear).slice(-2)
        : label + " '" + String(currentYear).slice(-2);

      return {
        title,
        sales,
        prior,
        older,
        olderYear,
        delta,
        deltaPct
      };
    }

    function updateChartFocusStyles() {
      const activeIds = new Set(visibleChartIdsByTab[state.activeTab] || []);
      const focusId = activeIds.has(state.focusChartId) ? state.focusChartId : null;

      // When a click applies a real data-point filter (month/product/customer), every chart is
      // now showing that selected slice. Do not dim peer charts in that state; otherwise the
      // selected month bars/points look washed out even though they are part of the selection.
      const hasAppliedDataPointFilter = hasMonthFilter() || getSelectedProductKeys().length > 0 || getSelectedCustomerIds().length > 0;

      Object.values(visibleChartIdsByTab).flat().forEach(canvasId => {
        const canvas = document.getElementById(canvasId);
        const card = canvas ? canvas.closest('.card') : null;
        if (!card) return;

        card.classList.add('chartFocusCard');
        const isVisibleChart = activeIds.has(canvasId);
        const isActive = !!focusId && canvasId === focusId;
        const shouldDim = !!focusId && isVisibleChart && canvasId !== focusId && !hasAppliedDataPointFilter;

        card.classList.toggle('chartFocusActive', isActive);
        card.classList.toggle('chartFocusDim', shouldDim);
      });
    }

    function openComponentMenu(event, componentId) {
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }

      const config = componentMenuConfigs[componentId];
      if (!config) return;

      const menu = document.getElementById('componentMenu');
      const isTable = config.type === 'table';
      const hasCanvas = !!config.canvasId;

      menu.className = 'componentMenu open' + (isTable ? ' tableMenu' : '');
      menu.innerHTML = buildComponentMenuHtml(componentId, config, hasCanvas, isTable);

      document.querySelectorAll('.componentMenuBtn.active').forEach(btn => btn.classList.remove('active'));
      if (event && event.currentTarget) event.currentTarget.classList.add('active');

      const rect = event && event.currentTarget ? event.currentTarget.getBoundingClientRect() : { left: 16, bottom: 16 };
      menu.style.display = 'block';
      const menuWidth = menu.offsetWidth || 230;
      const left = Math.max(8, Math.min(rect.right - menuWidth, window.innerWidth - menuWidth - 8));
      const top = Math.max(8, Math.min(rect.bottom + 6, window.innerHeight - (menu.offsetHeight || 260) - 8));
      menu.style.left = left + 'px';
      menu.style.top = top + 'px';
    }

    function buildComponentMenuHtml(componentId, config, hasCanvas, isTable) {
      const sortBlock = isTable ? `

      return `

    function exportComponentData(componentId) {
      const config = componentMenuConfigs[componentId];
      if (!config) return;

      const rows = config.type === 'chart'
        ? getChartExportRows(config.canvasId)
        : getTableExportRows(config.tableSelector);

      if (!rows.length) {
        showStatus('No visible data to export for ' + config.title + '.', 'warn');
        return;
      }

      downloadTextFile(slugify(config.title) + '.csv', rowsToCsv(rows), 'text/csv;charset=utf-8');
      closeComponentMenu();
    }

    function getChartExportRows(canvasId) {
      const chart = charts[canvasId];
      if (!chart || !chart.data) return [];
      const datasets = chart.data.datasets || [];
      const header = ['Label'].concat(datasets.map(dataset => String(dataset.label || 'Value')));
      const rows = [header];
      (chart.data.labels || []).forEach((label, index) => {
        rows.push([String(label)].concat(datasets.map(dataset => dataset.data && dataset.data[index] !== undefined && dataset.data[index] !== null ? dataset.data[index] : '')));
      });
      return rows;
    }

    function getTableExportRows(tableSelector) {
      const tbody = document.querySelector(tableSelector);
      const table = tbody ? tbody.closest('table') : null;
      if (!table) return [];
      const header = [...table.querySelectorAll('thead th')].map(th => cleanCellText(th.textContent));
      const rows = [header];
      [...table.querySelectorAll('tbody tr')].forEach(tr => {
        rows.push([...tr.querySelectorAll('td')].map(td => cleanCellText(td.textContent)));
      });
      return rows;
    }

    function cleanCellText(value) {
      return String(value || '').replace(/▲|▼/g, '').replace(/\s+/g, ' ').trim();
    }

    function rowsToCsv(rows) {
      return rows.map(row => row.map(cell => {
        const text = String(cell === null || cell === undefined ? '' : cell);
        return '"' + text.replace(/"/g, '""') + '"';
      }).join(',')).join('\r\n');
    }

    function downloadTextFile(fileName, text, mimeType) {
      const blob = new Blob([text], { type: mimeType || 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    async function renderComponentToPngBlob(componentId) {
      const config = componentMenuConfigs[componentId];
      if (!config) return null;

      const card = getComponentCard(componentId);
      if (card && window.html2canvas) {
        const activeMenuButtons = [...card.querySelectorAll('.componentMenuBtn.active')];
        activeMenuButtons.forEach(button => button.classList.remove('active'));
        const canvas = await html2canvas(card, {
          backgroundColor: '#ffffff',
          scale: Math.min(2, window.devicePixelRatio || 1.5),
          useCORS: true,
          logging: false,
          scrollX: 0,
          scrollY: 0
        });
        activeMenuButtons.forEach(button => button.classList.add('active'));
        return new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
      }

      const canvas = config.canvasId ? document.getElementById(config.canvasId) : null;
      if (canvas && canvas.toBlob) {
        return new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
      }

      return null;
    }

    function blobToObjectUrl(blob) {
      return URL.createObjectURL(blob);
    }

    async function saveComponentPng(componentId) {
      const config = componentMenuConfigs[componentId];
      if (!config) return;
      closeComponentMenu();

      try {
        showStatus('Preparing ' + config.title + ' PNG...');
        const blob = await renderComponentToPngBlob(componentId);
        if (!blob) {
          showStatus('Could not create PNG for ' + config.title + '.', 'warn');
          return;
        }
        const url = blobToObjectUrl(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = slugify(config.title) + '.png';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1200);
        showStatus('Downloaded ' + config.title + ' PNG.', 'good');
      } catch (error) {
        showStatus('Could not create PNG for ' + config.title + '. Try Export data instead.', 'warn');
      }
    }

    async function copyComponentImage(componentId) {
      const config = componentMenuConfigs[componentId];
      if (!config) return;
      closeComponentMenu();

      if (!navigator.clipboard || !window.ClipboardItem) {
        await saveComponentPng(componentId);
        showStatus('Image copy is not available in this browser, so the PNG was downloaded instead.', 'warn');
        return;
      }

      try {
        const blob = await renderComponentToPngBlob(componentId);
        if (!blob) {
          showStatus('Could not create image for ' + config.title + '.', 'warn');
          return;
        }
        await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
        showStatus('Copied ' + config.title + ' image to clipboard.', 'good');
      } catch (error) {
        await saveComponentPng(componentId);
        showStatus('Clipboard copy was blocked, so the PNG was downloaded instead.', 'warn');
      }
    }

          .catch(() => showStatus('Component link: ' + url, 'warn'));

    function destroyChartsForTab(tabKey) {

    function bumpSelectedRowsToTop(rows, keyFn, selectedSet) {
      if (!selectedSet || !selectedSet.size || !Array.isArray(rows)) return rows;
      rows.forEach((row, index) => { row.__selectedSortIndex = index; });
      rows.sort((a, b) => {
        const aSelected = selectedSet.has(keyFn(a)) ? 1 : 0;
        const bSelected = selectedSet.has(keyFn(b)) ? 1 : 0;
        const selectedDiff = bSelected - aSelected;
        if (selectedDiff) return selectedDiff;
        return (a.__selectedSortIndex || 0) - (b.__selectedSortIndex || 0);
      });
      rows.forEach(row => { delete row.__selectedSortIndex; });
      return rows;
    }

    function renderTables() {
      renderCustomerTable();
      renderProductTable();

    function renderCustomerTable() {
      // Keep the Customer Movers inventory visible when customers are selected.
      // Selected customers are bumped to the top, while product/department/year/month filters
      // still cross-filter this table.
      const rows = groupBy(getFilteredFacts({ customer: true }), row => row.customerId, row => ({
        customerId: row.customerId,
        customerName: row.customerName,
        customerActive: true,
        currentRevenue: 0,
        priorRevenue: 0,
        currentUnits: 0,
        priorUnits: 0
      }), (acc, row) => {
        if (row.customerActive === false) acc.customerActive = false;
        if (row.year === (payload.config.currentYear || 2026)) {
          acc.currentRevenue += row.netRevenue;
          acc.currentUnits += row.units;
        }
        if (row.year === (payload.config.priorYear || 2025)) {
          acc.priorRevenue += row.netRevenue;
          acc.priorUnits += row.units;
        }
      }).map(row => ({
        ...row,
        gap: row.currentRevenue - row.priorRevenue,
        unitGap: row.currentUnits - row.priorUnits
      }));

      updateMoverMetricHeaders('customer');
      sortCustomerRows(rows);
      bumpSelectedRowsToTop(rows, row => row.customerId, state.tableSelectedCustomerIds);

      const visibleRows = rows.slice(0, 500);
