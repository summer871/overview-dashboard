name: Fix dashboard script boundary

on:
  push:
    branches:
      - agent/v6.544-shared-table-platform-5118
    paths:
      - .github/scripts/fix-dashboard-script-boundary.cjs
      - .github/workflows/fix-dashboard-script-boundary.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
        with:
          ref: agent/v6.544-shared-table-platform-5118
          fetch-depth: 0

      - name: Repair and validate script boundary
        run: node .github/scripts/fix-dashboard-script-boundary.cjs

      - name: Commit repaired dashboard source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          target="$(cat .github/dashboard-script-boundary-target.txt)"
          test -n "$target"
          git add -- "$target" SharedFooter.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix dashboard popup script boundary"
          git push origin HEAD:agent/v6.544-shared-table-platform-5118

# Path-limited: the generated dashboard/footer commit does not retrigger this workflow.
