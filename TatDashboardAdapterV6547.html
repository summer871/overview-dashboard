Version: v6.558
Date: 2026-07-30
Purpose: TAT bridge from shared dashboard capabilities to the existing controller, including detached live cards.

<script id="cdaTatDashboardAdapterControllerV6547">
(function installTatDashboardAdapterV6547(){
  'use strict';

  if (window.cdaTatDashboardAdapterV6547 &&
      window.cdaTatDashboardAdapterV6547.version === 'v6.558') return;

  const TABLE_KEYS_V6547 = ['tatDepartment','tatLate','tatCustomer','tatQuality'];

  function stateV6547(){ return window.cdaTatStateV6509 || null; }

  function chartV6547(component){
    const current = stateV6547();
    return current && current.charts && component.chartKey
      ? current.charts[component.chartKey] || null
      : null;
  }

  function getChartV6547(context){
    return context && context.component ? chartV6547(context.component) : null;
  }

  function openChartColumnsV6547(context){
    const chartInstance = chartV6547(context.component);
    if (!chartInstance || !chartInstance.data ||
        !Array.isArray(chartInstance.data.datasets) || !context.popover) return false;
    if (context.popover.isOpenFor(context.button)) {
      context.popover.close();
      return true;
    }
    const popover = context.popover.open(context.button,{label:'Visible chart series',title:'Series'});
    if (!popover) return false;
    const doc = popover.ownerDocument || context.document || document;
    chartInstance.data.datasets.forEach(function(dataset,index){
      const label = doc.createElement('label');
      const input = doc.createElement('input');
      const text = doc.createElement('span');
      input.type = 'checkbox';
      input.checked = typeof chartInstance.isDatasetVisible === 'function'
        ? chartInstance.isDatasetVisible(index)
        : !dataset.hidden;
      input.addEventListener('change',function(){
        if (typeof chartInstance.setDatasetVisibility === 'function') {
          chartInstance.setDatasetVisibility(index,input.checked);
        } else {
          dataset.hidden = !input.checked;
        }
        chartInstance.update();
      });
      text.textContent = dataset.label || 'Series ' + (index + 1);
      label.append(input,text);
      popover.appendChild(label);
    });
    context.popover.position();
    return true;
  }

  function openColumnsV6547(context){
    if (context.component.kind === 'chart') return openChartColumnsV6547(context);
    return !!(window.cdaDashboardColumnsV6548 && window.cdaDashboardColumnsV6548.open(context));
  }

  function csvCellV6547(value){
    const text = String(value == null ? '' : value);
    return /[",\n\r]/.test(text) ? '"' + text.replace(/"/g,'""') + '"' : text;
  }

  function exportChartCurrentV6547(component){
    const chartInstance = chartV6547(component);
    if (!chartInstance || !chartInstance.data) return false;
    const datasets = (chartInstance.data.datasets || []).filter(function(dataset,index){
      return typeof chartInstance.isDatasetVisible === 'function'
        ? chartInstance.isDatasetVisible(index)
        : !dataset.hidden;
    });
    const rows = [['Label'].concat(datasets.map(function(dataset){ return dataset.label || 'Series'; }))];
    (chartInstance.data.labels || []).forEach(function(label,index){
      rows.push([label].concat(datasets.map(function(dataset){
        const value = (dataset.data || [])[index];
        return value && value.y != null ? value.y : value;
      })));
    });
    const csv = rows.map(function(row){ return row.map(csvCellV6547).join(','); }).join('\r\n');
    const url = URL.createObjectURL(new Blob(['\uFEFF' + csv],{type:'text/csv;charset=utf-8'}));
    const link = document.createElement('a');
    link.href = url;
    link.download = 'tat_' + component.key + '_current.csv';
    document.body.appendChild(link);
    link.click();
    link.remove();
    window.setTimeout(function(){ URL.revokeObjectURL(url); },500);
    return true;
  }

  function exportCurrentV6547(context){
    if (context.component.kind === 'chart' && exportChartCurrentV6547(context.component)) return true;
    if (context.component.tableKey && window.cdaTable && typeof window.cdaTable.exportCsv === 'function') {
      window.cdaTable.exportCsv(context.component.tableKey,'tat_' + context.component.key + '_current.csv');
      return true;
    }
    if (typeof window.exportTatComponentV6509 === 'function') {
      window.exportTatComponentV6509(context.component.key);
      return true;
    }
    return false;
  }

  function exportAllV6547(context){
    if (typeof window.exportTatAllDataV6509 !== 'function') return false;
    window.exportTatAllDataV6509(context.component.key);
    return true;
  }

  function popoutV6547(context){
    return !!(window.cdaDashboardPopoutV6548 && window.cdaDashboardPopoutV6548.open(context));
  }

  function resetV6547(context){
    const component = context.component;
    if (component.kind === 'table') {
      if (window.cdaDashboardColumnsV6548) window.cdaDashboardColumnsV6548.reset(context);
      if (component.tableKey && window.cdaTable && typeof window.cdaTable.clearSelection === 'function') {
        window.cdaTable.clearSelection(component.tableKey);
      }
    }
    if (component.kind === 'chart') {
      const chartInstance = chartV6547(component);
      if (chartInstance) {
        (chartInstance.data.datasets || []).forEach(function(dataset,index){
          if (typeof chartInstance.setDatasetVisibility === 'function') chartInstance.setDatasetVisibility(index,true);
          else dataset.hidden = false;
        });
        chartInstance.update('none');
      }
    }
    if (typeof window.clearTatComponentV6509 === 'function') window.clearTatComponentV6509(component.key);
    return true;
  }

  function isCollapsedV6547(context){
    const current = stateV6547();
    const section = context && context.component && context.component.collapseSection;
    return !!(current && current.collapsed && section && current.collapsed[section]);
  }

  function applyDetachedCollapseV6547(context){
    const card = context && context.card;
    const current = stateV6547();
    const section = context && context.component && context.component.collapseSection;
    if (!card || !current || !current.collapsed || !section) return;
    const collapsed = !!current.collapsed[section];
    card.classList.toggle('collapsed',collapsed);
    const legacyButton = card.querySelector('.tatCollapseButtonV6509');
    if (legacyButton) {
      legacyButton.textContent = collapsed ? '▸' : '▾';
      legacyButton.setAttribute('aria-expanded',collapsed ? 'false' : 'true');
    }
    const titleButton = card.querySelector('[data-cda-dashboard-title-toggle="true"]');
    if (titleButton && window.cdaDashboardTitleToggleV6555) {
      window.cdaDashboardTitleToggleV6555.sync(context,titleButton);
    }
  }

  function collapseV6547(context){
    if (!context.component.collapseSection || typeof window.toggleTatSectionV6509 !== 'function') return false;
    window.toggleTatSectionV6509(context.component.collapseSection);
    applyDetachedCollapseV6547(context);
    return true;
  }

  function beforeReplaceV6547(){
    if (window.cdaDashboardPopoverV6547) window.cdaDashboardPopoverV6547.close();
    if (window.cdaTable && typeof window.cdaTable.closeChooser === 'function') window.cdaTable.closeChooser();
    const current = stateV6547();
    if (current && current.charts) {
      Object.keys(current.charts).forEach(function(key){
        const instance = current.charts[key];
        if (instance && typeof instance.destroy === 'function') {
          try { instance.destroy(); } catch (error) {}
        }
      });
      current.charts = {};
    }
    if (window.cdaTable && typeof window.cdaTable.config === 'function') {
      TABLE_KEYS_V6547.forEach(function(key){
        const config = window.cdaTable.config(key);
        if (!config) return;
        config.$table = null;
        config.$frameV6543 = null;
        config.$toolsV6543 = null;
        config.bound = false;
        config.autoTools = false;
      });
    }
  }

  function afterReplaceV6547(){
    window.requestAnimationFrame(function(){
      if (typeof window.setTatDistributionModeV6509 === 'function') window.setTatDistributionModeV6509();
      if (window.cdaDashboardTitleToggleV6555) window.cdaDashboardTitleToggleV6555.syncAll('tat');
      window.dispatchEvent(new Event('resize'));
    });
  }

  window.cdaTatDashboardAdapterV6547 = Object.freeze({
    version:'v6.558',
    getChart:getChartV6547,
    openColumns:openColumnsV6547,
    popout:popoutV6547,
    reset:resetV6547,
    isCollapsed:isCollapsedV6547,
    collapse:collapseV6547,
    exportCurrent:exportCurrentV6547,
    exportAll:exportAllV6547,
    beforeReplace:beforeReplaceV6547,
    afterReplace:afterReplaceV6547,
    applyDetachedCollapse:applyDetachedCollapseV6547
  });
})();
</script>
