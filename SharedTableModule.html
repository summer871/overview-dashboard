<!-- SharedTableModule.html v6.540

THE TAB TEMPLATE. Read this before building any new dashboard tab.

This module owns table rendering for every tab. A tab declares its columns and
hands over rows. The module builds the header, the body, sorting, column
visibility, row-click cross-filtering, selected-row pinning, child detail rows,
totals and CSV export.

A new tab does NOT write table HTML. It calls cdaTable.register() once per
table and cdaTable.setRows() whenever its data changes.

This file is also the single home for table header alignment and the sort
glyph. Those rules used to live inside an Index.html runtime injector scoped to
#remakeFactorPage, which is why TAT could never match Remake no matter what a
shared stylesheet said. They are now declared once here for BOTH pages.

Include order: after SharedTableStyles. SharedTableEngine is DELETED as of
v6.540; this module replaces it.
-->
<style id="cdaSharedTableModuleStylesV6540">
  /* ==================================================================
     CANONICAL HEADER ALIGNMENT - one rule, both tabs.

     Remake's original lived at Index.html ~line 1321 as
       #remakeFactorPage.cleanRemakeV6230 .remakeTable thead th...
     specificity (1 id, 3 class, 2 element). These selectors carry
     (1 id, 3 class, 4 element), so they win on element count while
     producing byte-identical values for Remake. Remake does not move.
     TAT finally inherits the same treatment.
     ================================================================== */
  html body #remakeFactorPage.cleanRemakeV6230 table.remakeTable thead th:first-child,
  html body #tatDashboardPageV6509.cleanRemakeV6230 table.remakeTable thead th:first-child {
    text-align: left !important;
    padding-left: 5px !important;
    padding-right: 18px !important;
  }
  html body #remakeFactorPage.cleanRemakeV6230 table.remakeTable thead th:not(:first-child),
  html body #tatDashboardPageV6509.cleanRemakeV6230 table.remakeTable thead th:not(:first-child) {
    text-align: center !important;
    padding-left: 16px !important;
    padding-right: 16px !important;
  }
  html body #remakeFactorPage.cleanRemakeV6230 table.remakeTable tbody td:not(:first-child),
  html body #tatDashboardPageV6509.cleanRemakeV6230 table.remakeTable tbody td:not(:first-child) {
    text-align: right !important;
  }

  /* CANONICAL SORT GLYPH. Absolutely positioned so the label never shifts
     when a column becomes active. Full strength, no opacity fade: the
     v6.538 engine dimmed it to .95 and that was the colour difference. */
  html body #remakeFactorPage.cleanRemakeV6230 table.remakeTable thead .sortGlyphV6230,
  html body #tatDashboardPageV6509.cleanRemakeV6230 table.remakeTable thead .sortGlyphV6230 {
    position: absolute !important;
    right: 4px !important;
    top: 50% !important;
    transform: translateY(-50%) !important;
    display: block !important;
    width: auto !important;
    min-width: 0 !important;
    margin: 0 !important;
    opacity: 1 !important;
    line-height: 1 !important;
  }
  html body #remakeFactorPage.cleanRemakeV6230 table.remakeTable thead th.sortableV6230,
  html body #tatDashboardPageV6509.cleanRemakeV6230 table.remakeTable thead th.sortableV6230 {
    position: sticky !important;
    cursor: pointer !important;
    user-select: none !important;
  }

  /* Child detail rows (TAT department -> product breakdown). Same indent
     treatment the tab already used, now owned by the module. */
  html body table[data-cda-managed] tbody tr.cdaChildRowV6540 > td:first-child {
    padding-left: 18px !important;
  }
  html body table[data-cda-managed] tbody tr.cdaChildRowV6540 {
    cursor: default;
  }
  html body table[data-cda-managed] tbody td.cdaEmptyV6540 {
    text-align: center !important;
    opacity: .7;
  }
</style>
<script id="cdaSharedTableModuleControllerV6540">
(function installCdaSharedTableModuleV6540(){
  'use strict';

  var MODULE_VERSION_V6540 = '6.540';

  var SORT_STORE_V6540 = 'cdaTableSortsV6539';
  var COLS_STORE_V6540 = 'cdaTableHiddenColumnsV6539';

  var registryV6540 = {};
  var sortsV6540 = readJsonV6540(SORT_STORE_V6540, {});
  var hiddenV6540 = readJsonV6540(COLS_STORE_V6540, {});

  function readJsonV6540(key, fallback){
    try {
      var raw = window.localStorage.getItem(key);
      if (!raw) return fallback;
      var parsed = JSON.parse(raw);
      return parsed && typeof parsed === 'object' ? parsed : fallback;
    } catch (error) { return fallback; }
  }

  function writeJsonV6540(key, value){
    try { window.localStorage.setItem(key, JSON.stringify(value)); } catch (error) {}
  }

  function escV6540(value){
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function numV6540(value){
    var n = Number(value);
    return isFinite(n) ? n : 0;
  }

  function fixedV6540(value, decimals){
    var d = decimals == null ? 0 : Number(decimals);
    return numV6540(value).toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d });
  }

  var FORMATTERS_V6540 = {
    text: function(value){ return value == null ? '' : String(value); },
    count: function(value){ return fixedV6540(value, 0); },
    number: function(value, row, column){ return fixedV6540(value, column && column.decimals != null ? column.decimals : 0); },
    decimal: function(value, row, column){ return fixedV6540(value, column && column.decimals != null ? column.decimals : 1); },
    days: function(value, row, column){ return fixedV6540(value, column && column.decimals != null ? column.decimals : 1); },
    percent: function(value, row, column){
      var d = column && column.decimals != null ? column.decimals : 1;
      return fixedV6540(numV6540(value) * 100, d) + '%';
    },
    percent100: function(value, row, column){
      var d = column && column.decimals != null ? column.decimals : 1;
      return fixedV6540(value, d) + '%';
    },
    currency: function(value, row, column){
      var d = column && column.decimals != null ? column.decimals : 0;
      var n = numV6540(value);
      return (n < 0 ? '-$' : '$') + fixedV6540(Math.abs(n), d);
    }
  };

  var NUMERIC_TYPES_V6540 = {
    count: true, number: true, decimal: true, days: true,
    percent: true, percent100: true, currency: true
  };

  function columnTypeV6540(column){ return column && column.type ? String(column.type) : 'text'; }

  function isNumericV6540(column){
    if (column && column.numeric != null) return !!column.numeric;
    return !!NUMERIC_TYPES_V6540[columnTypeV6540(column)];
  }

  function rawValueV6540(row, column){
    if (!column || !row) return '';
    if (typeof column.value === 'function') return column.value(row, column);
    return row[column.field];
  }

  function formatCellV6540(row, column){
    var value = rawValueV6540(row, column);
    if (typeof column.format === 'function') return column.format(value, row, column);
    var formatter = FORMATTERS_V6540[columnTypeV6540(column)] || FORMATTERS_V6540.text;
    return formatter(value, row, column);
  }

  function normalizeColumnV6540(column, index){
    var copy = Object.assign({}, column);
    copy.field = String(copy.field != null ? copy.field : ('col' + index));
    copy.label = copy.label != null ? copy.label : copy.field;
    copy.title = copy.title || copy.label;
    copy.sortable = copy.sortable !== false;
    copy.hideable = index > 0 && copy.hideable !== false;
    copy.numeric = isNumericV6540(copy);
    return copy;
  }

  function normalizeConfigV6540(config){
    var cfg = Object.assign({}, config);
    cfg.key = String(cfg.key);
    cfg.tableId = String(cfg.tableId || '');
    cfg.columns = (cfg.columns || []).map(normalizeColumnV6540);
    cfg.limit = cfg.limit == null ? 500 : Number(cfg.limit);
    cfg.emptyText = cfg.emptyText || 'No matching rows.';
    cfg.rowKey = typeof cfg.rowKey === 'function' ? cfg.rowKey : function(row){
      return row && row.key != null ? row.key : (row && row.label);
    };
    cfg.selectable = cfg.selectable !== false;
    cfg.multiSelect = cfg.multiSelect !== false;
    /* manageSelection false means the TAB owns selection state and pushes it
       in with setSelection(). The module still paints it identically. */
    cfg.manageSelection = cfg.manageSelection !== false;
    cfg.totalsRow = cfg.totalsRow === true;
    cfg.totalsLabel = cfg.totalsLabel || 'Total';
    cfg.rows = cfg.rows || [];
    cfg.viewRows = [];
    cfg.selection = new Set();
    cfg.bound = false;
    if (cfg.defaultSort && !sortsV6540[cfg.key]) {
      sortsV6540[cfg.key] = { field: cfg.defaultSort.field, dir: cfg.defaultSort.dir || 'desc' };
    }
    return cfg;
  }

  /* A tab may point at the <table> OR at its <tbody> (TAT puts the id on the
     tbody). Either resolves. The element is cached because the module
     replaces innerHTML, which destroys the original tbody node. The generated
     tbody is re-stamped with the same id so nothing else in the tab breaks. */
  function resolveTableV6540(cfg){
    if (!cfg) return null;
    if (cfg.$table && cfg.$table.isConnected) return cfg.$table;
    if (!cfg.tableId) return null;
    var node = document.getElementById(cfg.tableId);
    if (!node) return null;
    if (node.tagName === 'TABLE') { cfg.$table = node; cfg.bodyIdV6540 = ''; return node; }
    var table = node.closest ? node.closest('table') : null;
    if (!table) return null;
    cfg.$table = table;
    cfg.bodyIdV6540 = node.id || '';
    return table;
  }

  function activeSortV6540(cfg){
    var stored = sortsV6540[cfg.key];
    if (stored && stored.field) return stored;
    if (cfg.defaultSort) return cfg.defaultSort;
    var first = cfg.columns.filter(function(column){ return column.sortable; })[0];
    return first ? { field: first.field, dir: first.numeric ? 'desc' : 'asc' } : null;
  }

  function columnByFieldV6540(cfg, field){
    for (var i = 0; i < cfg.columns.length; i += 1) {
      if (cfg.columns[i].field === field) return cfg.columns[i];
    }
    return null;
  }

  function sortValueV6540(row, column){
    if (!column) return '';
    if (typeof column.sortValue === 'function') return column.sortValue(row, column);
    var value = rawValueV6540(row, column);
    if (column.numeric) return numV6540(value);
    return String(value == null ? '' : value).toLowerCase();
  }

  function labelValueV6540(cfg, row){
    var first = cfg.columns[0];
    var value = first ? rawValueV6540(row, first) : '';
    return String(value == null ? cfg.rowKey(row) : value);
  }

  function sortRowsV6540(cfg, rows){
    var sort = activeSortV6540(cfg);
    if (!sort) return (rows || []).slice();
    var column = columnByFieldV6540(cfg, sort.field);
    if (!column) return (rows || []).slice();
    var dir = sort.dir === 'asc' ? 1 : -1;
    return (rows || []).slice().sort(function(a, b){
      var av = sortValueV6540(a, column);
      var bv = sortValueV6540(b, column);
      if (typeof av === 'string' || typeof bv === 'string') {
        return String(av).localeCompare(String(bv), undefined, { numeric: true, sensitivity: 'base' }) * dir;
      }
      if (av !== bv) return (av - bv) * dir;
      return labelValueV6540(cfg, a).localeCompare(labelValueV6540(cfg, b), undefined, { numeric: true, sensitivity: 'base' });
    });
  }

  function pinSelectedFirstV6540(cfg, rows){
    var source = (rows || []).slice();
    var order = Array.from(cfg.selection).map(String);
    var limit = cfg.limit || source.length;
    if (!order.length) return source.slice(0, limit);
    var rank = new Map(order.map(function(value, index){ return [value, index]; }));
    var pinned = [];
    var rest = [];
    source.forEach(function(row){
      if (rank.has(String(cfg.rowKey(row)))) pinned.push(row);
      else rest.push(row);
    });
    pinned.sort(function(a, b){
      return Number(rank.get(String(cfg.rowKey(a)))) - Number(rank.get(String(cfg.rowKey(b))));
    });
    return pinned.concat(rest).slice(0, Math.max(limit, pinned.length));
  }

  function applyPinningV6540(table){
    if (!table) return;
    var selectedRows = Array.prototype.slice.call(table.querySelectorAll('tbody tr.selectedV6230'));
    selectedRows.forEach(function(row){ row.classList.add('selectedPinnedV6311'); });
    if (!selectedRows.length) return;
    var measure = function(){
      var header = table.querySelector('thead');
      var top = header ? Math.max(0, header.getBoundingClientRect().height) : 34;
      selectedRows.forEach(function(row){
        row.style.setProperty('--remake-selected-pin-top-v6311', top + 'px');
        top += Math.max(1, row.getBoundingClientRect().height);
      });
    };
    if (window.requestAnimationFrame) window.requestAnimationFrame(measure);
    else measure();
  }

  function hiddenSetV6540(cfg){
    var list = hiddenV6540[cfg.key] || [];
    return new Set(list.map(String));
  }

  function visibleColumnsV6540(cfg){
    var hidden = hiddenSetV6540(cfg);
    return cfg.columns.filter(function(column, index){
      if (index === 0) return true;
      if (!column.hideable) return true;
      return !hidden.has(column.field);
    });
  }

  function headerHtmlV6540(cfg, columns){
    var sort = activeSortV6540(cfg) || {};
    var cells = columns.map(function(column){
      var classes = [];
      if (column.sortable) classes.push('sortableV6230');
      if (column.numeric) classes.push('num');
      if (column.headerClass) classes.push(column.headerClass);
      var style = column.width ? ' style="width:' + escV6540(column.width) + '"' : '';
      var glyph = '';
      if (column.sortable && sort.field === column.field) {
        glyph = sort.dir === 'asc' ? '&#9650;' : '&#9660;';
      }
      var click = column.sortable
        ? ' onclick="cdaTableSortV6540(&quot;' + escV6540(cfg.key) + '&quot;,&quot;' + escV6540(column.field) + '&quot;)"'
        : '';
      var title = column.sortable ? 'Sort by ' + column.title : column.title;
      return '<th class="' + escV6540(classes.join(' ')) + '"'
        + ' data-cda-field="' + escV6540(column.field) + '"'
        + ' title="' + escV6540(title) + '"'
        + ' aria-label="' + escV6540(title) + '"'
        + style + click + '>'
        + escV6540(column.label)
        + (column.sortable ? '<span class="sortGlyphV6230">' + glyph + '</span>' : '')
        + '</th>';
    });
    return '<thead><tr>' + cells.join('') + '</tr></thead>';
  }

  function cellHtmlV6540(row, column){
    var classes = [];
    if (column.numeric) classes.push('num');
    if (column.cellClass) classes.push(column.cellClass);
    var attr = classes.length ? ' class="' + escV6540(classes.join(' ')) + '"' : '';
    var content = typeof column.html === 'function'
      ? column.html(rawValueV6540(row, column), row, column)
      : escV6540(formatCellV6540(row, column));
    return '<td' + attr + '>' + content + '</td>';
  }

  function bodyHtmlV6540(cfg, columns, rows){
    if (!rows.length) {
      return '<tbody><tr><td class="cdaEmptyV6540" colspan="' + columns.length + '">'
        + escV6540(cfg.emptyText) + '</td></tr></tbody>';
    }
    var anySelected = cfg.selection.size > 0;
    var out = [];
    rows.forEach(function(row){
      var key = String(cfg.rowKey(row));
      var selected = cfg.selection.has(key);
      var classes = [];
      if (cfg.selectable) classes.push('clickable');
      if (selected) classes.push('selected', 'selectedV6230');
      if (anySelected && !selected) classes.push('dimmedV6266');
      if (typeof cfg.rowClass === 'function') {
        var extra = cfg.rowClass(row);
        if (extra) classes.push(extra);
      }
      out.push('<tr class="' + escV6540(classes.join(' ')) + '" data-cda-key="' + escV6540(key) + '">'
        + columns.map(function(column){ return cellHtmlV6540(row, column); }).join('')
        + '</tr>');

      /* Child rows travel with their parent and are never sorted apart
         from it. This is how TAT's department -> product breakdown works. */
      if (typeof cfg.childRows === 'function') {
        var children = cfg.childRows(row, selected) || [];
        children.forEach(function(child){
          out.push('<tr class="cdaChildRowV6540 ' + escV6540(cfg.childRowClass || '') + '">'
            + columns.map(function(column){ return cellHtmlV6540(child, column); }).join('')
            + '</tr>');
        });
      }
    });
    return '<tbody>' + out.join('') + '</tbody>';
  }

  function totalValueV6540(cfg, column, rows){
    var rule = column.total;
    if (!rule) return null;
    if (typeof rule === 'function') return rule(rows, column, cfg);
    var values = rows.map(function(row){ return numV6540(rawValueV6540(row, column)); });
    if (rule === 'sum') return values.reduce(function(a, b){ return a + b; }, 0);
    if (rule === 'avg') return values.length ? values.reduce(function(a, b){ return a + b; }, 0) / values.length : 0;
    if (rule === 'weightedAvg') {
      var top = 0, bottom = 0;
      rows.forEach(function(row){
        var weight = column.weightBy ? numV6540(row[column.weightBy]) : 1;
        top += numV6540(rawValueV6540(row, column)) * weight;
        bottom += weight;
      });
      return bottom ? top / bottom : 0;
    }
    if (rule === 'ratio') {
      var n = 0, d = 0;
      rows.forEach(function(row){
        n += numV6540(row[column.ratioNumerator]);
        d += numV6540(row[column.ratioDenominator]);
      });
      return d ? n / d : 0;
    }
    return null;
  }

  function footHtmlV6540(cfg, columns, rows){
    if (!cfg.totalsRow || !rows.length) return '';
    var cells = columns.map(function(column, index){
      var classes = [];
      if (column.numeric) classes.push('num');
      var attr = classes.length ? ' class="' + escV6540(classes.join(' ')) + '"' : '';
      if (index === 0) return '<td' + attr + '>' + escV6540(cfg.totalsLabel) + '</td>';
      var value = totalValueV6540(cfg, column, rows);
      if (value == null) return '<td' + attr + '></td>';
      var formatter = FORMATTERS_V6540[columnTypeV6540(column)] || FORMATTERS_V6540.text;
      var text = typeof column.format === 'function'
        ? column.format(value, null, column)
        : formatter(value, null, column);
      return '<td' + attr + '>' + escV6540(text) + '</td>';
    });
    return '<tfoot data-cda-totals="1"><tr>' + cells.join('') + '</tr></tfoot>';
  }

  function bindV6540(cfg, table){
    if (cfg.bound || !table) return;
    cfg.bound = true;
    table.addEventListener('click', function(event){
      var tr = event.target && event.target.closest ? event.target.closest('tbody tr') : null;
      if (!tr || !tr.hasAttribute('data-cda-key')) return;
      handleRowClickV6540(cfg, tr.getAttribute('data-cda-key'), event);
    });
  }

  function handleRowClickV6540(cfg, key, event){
    var row = null;
    for (var i = 0; i < cfg.viewRows.length; i += 1) {
      if (String(cfg.rowKey(cfg.viewRows[i])) === String(key)) { row = cfg.viewRows[i]; break; }
    }
    var additive = cfg.multiSelect && !!(event && (event.metaKey || event.ctrlKey || event.shiftKey));

    if (typeof cfg.onRowClick === 'function') {
      if (cfg.onRowClick(row, key, event, additive) === false) return;
    }
    if (!cfg.selectable || !cfg.manageSelection) return;

    if (additive) {
      if (cfg.selection.has(key)) cfg.selection.delete(key);
      else cfg.selection.add(key);
    } else if (cfg.selection.size === 1 && cfg.selection.has(key)) {
      cfg.selection.clear();
    } else {
      cfg.selection.clear();
      cfg.selection.add(key);
    }

    renderV6540(cfg.key);
    if (typeof cfg.onSelectionChange === 'function') {
      cfg.onSelectionChange(Array.from(cfg.selection), cfg.filterKind || cfg.key, cfg);
    }
    emitV6540('cdaTableSelectionChanged', { key: cfg.key, selected: Array.from(cfg.selection) });
  }

  function emitV6540(name, detail){
    try { document.dispatchEvent(new CustomEvent(name, { detail: detail })); } catch (error) {}
  }

  function renderV6540(key){
    var cfg = registryV6540[key];
    if (!cfg) return;
    var table = resolveTableV6540(cfg);
    if (!table) return;

    table.setAttribute('data-cda-managed', 'v6540');

    var columns = visibleColumnsV6540(cfg);
    var rows = pinSelectedFirstV6540(cfg, sortRowsV6540(cfg, cfg.rows));

    if (typeof cfg.beforeRender === 'function') {
      var context = { cfg: cfg, rows: rows, columns: columns };
      cfg.beforeRender(context);
      rows = context.rows || rows;
      columns = context.columns || columns;
    }
    cfg.viewRows = rows;

    table.innerHTML = headerHtmlV6540(cfg, columns)
      + bodyHtmlV6540(cfg, columns, rows)
      + footHtmlV6540(cfg, columns, rows);
    if (cfg.bodyIdV6540) {
      var newBody = table.tBodies && table.tBodies[0];
      if (newBody) newBody.id = cfg.bodyIdV6540;
    }
    bindV6540(cfg, table);
    applyPinningV6540(table);

    if (typeof cfg.afterRender === 'function') cfg.afterRender(table, cfg);
    emitV6540('cdaTableRendered', { key: cfg.key, tableId: cfg.tableId, rows: rows.length });
  }

  function csvCellV6540(value){
    var text = String(value == null ? '' : value);
    var needsQuotes = text.indexOf('"') >= 0 || text.indexOf(',') >= 0 || text.indexOf('\n') >= 0 || text.indexOf('\r') >= 0;
    if (!needsQuotes) return text;
    return '"' + text.split('"').join('""') + '"';
  }

  function exportCsvV6540(key, filename){
    var cfg = registryV6540[key];
    if (!cfg) return '';
    var columns = visibleColumnsV6540(cfg);
    var lines = [columns.map(function(column){ return csvCellV6540(column.title || column.label); }).join(',')];
    cfg.viewRows.forEach(function(row){
      lines.push(columns.map(function(column){ return csvCellV6540(formatCellV6540(row, column)); }).join(','));
    });
    var csv = lines.join('\r\n');
    try {
      var blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
      var url = URL.createObjectURL(blob);
      var link = document.createElement('a');
      link.href = url;
      link.download = filename || (cfg.key + '.csv');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      window.setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    } catch (error) {}
    return csv;
  }

  var api = {
    version: MODULE_VERSION_V6540,

    register: function(config){
      if (!config || !config.key) return null;
      var cfg = normalizeConfigV6540(config);
      registryV6540[cfg.key] = cfg;
      if (cfg.rows && cfg.rows.length) renderV6540(cfg.key);
      return cfg.key;
    },

    registered: function(key){ return !!registryV6540[key]; },

    setRows: function(key, rows, options){
      var cfg = registryV6540[key];
      if (!cfg) return;
      cfg.rows = rows || [];
      if (options && options.clearSelection) cfg.selection.clear();
      if (!options || options.render !== false) renderV6540(key);
    },

    getRows: function(key){ var cfg = registryV6540[key]; return cfg ? cfg.rows.slice() : []; },
    getViewRows: function(key){ var cfg = registryV6540[key]; return cfg ? cfg.viewRows.slice() : []; },
    render: renderV6540,
    renderAll: function(){ Object.keys(registryV6540).forEach(renderV6540); },

    setSort: function(key, field, dir){
      if (!registryV6540[key]) return;
      sortsV6540[key] = { field: field, dir: dir === 'asc' ? 'asc' : 'desc' };
      writeJsonV6540(SORT_STORE_V6540, sortsV6540);
      renderV6540(key);
    },

    toggleSort: function(key, field){
      var cfg = registryV6540[key];
      if (!cfg) return;
      var column = columnByFieldV6540(cfg, field);
      var current = activeSortV6540(cfg) || {};
