<!-- SharedTableModule.html v6.539

THE TAB TEMPLATE. Read this before building any new dashboard tab.

This module owns table rendering for every tab. A tab declares its columns and
hands over rows. The module builds the header, the body, sorting, column
visibility, row-click cross-filtering, selected-row pinning and CSV export.

A new tab does NOT write table HTML. It calls cdaTable.register() once per
table and cdaTable.setRows() whenever its data changes. Everything else is
inherited.

Markup contract produced here is byte-for-byte the same shape Remake produces
(sortableV6230 headers, sortGlyphV6230 glyphs, clickable / selectedV6230 /
dimmedV6266 rows, num cells), so every existing stylesheet rule applies with no
new CSS and a converted tab looks identical to Remake rather than merely
similar.

Include order matters. Must load after SharedTableStyles and after
SharedTableEngine.

v6.539 is ADDITIVE. No table is registered yet, so this release cannot change
anything on screen except the footer stamp. v6.540 converts TAT onto it.
-->
