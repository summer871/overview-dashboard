<!-- SharedTableModule.html v6.541

THE TAB TEMPLATE. Read this before building any new dashboard tab.

This module owns table rendering for every tab. A tab declares its columns and
hands over rows. The module builds the header, the body, sorting, column
visibility, the column chooser, row-click cross-filtering, selected-row pinning,
child detail rows, totals and CSV export.

A new tab does NOT write table HTML. It calls cdaTable.register() once per
table and cdaTable.setRows() whenever its data changes.

The column chooser is auto-rendered by the module for any table with hideable
columns. No tab-specific wiring needed. Persistence is keyed by cfg.key (not
table id), which fixes the TAT collision where four tbody-id tables all mapped
to the same localStorage slot.

Include order: after SharedTableStyles. SharedTableEngine is DELETED as of
v6.540; this module replaces it.
-->
