<!-- SharedTableConfigV6544.html
Defines the repository-aware configuration contract for shared table definitions.
Static definitions identify existing dashboard DOM and may provide a resolver that
builds the renderer's runtime configuration after dynamic markup exists.
-->
<script id="cdaSharedTableConfigV6544">
(function installSharedTableConfigV6544(){
  'use strict';

  var existingConfigV6544 = window.cdaSharedTableConfigV6544;
  if (
    existingConfigV6544 &&
    typeof existingConfigV6544.normalize === 'function' &&
    typeof existingConfigV6544.validate === 'function'
  ) return;

  var VERSION_V6544 = 'v6.544';
  var SUPPORTED_PAGES_V6544 = Object.freeze({ tat:true, remake:true });
  var CORE_FEATURES_V6544 = Object.freeze({
    sorting:true,
    columnChooser:true,
    totals:true,
    selection:true,
    childRows:true,
    csv:true
  });
  var DEFAULT_FEATURES_V6544 = Object.freeze({
    sorting:false,
    columnChooser:false,
    exportCurrent:false,
    exportAll:false,
    popout:false,
    collapse:false,
    totals:false,
    selection:false,
    childRows:false,
    conditionalFormatting:false,
    cumulative:false,
    miniChart:false,
    search:false,
    filtering:false,
    reset:false,
    csv:false,
    copy:false,
    print:false,
    heatMap:false,
    trendLine:false
  });

  function isPlainObjectV6544(value){
    return !!value && typeof value === 'object' && !Array.isArray(value);
  }

  function cloneV6544(value){
    if (Array.isArray(value)) return value.map(cloneV6544);
    if (!isPlainObjectV6544(value)) return value;
    var output = {};
    Object.keys(value).forEach(function(key){ output[key] = cloneV6544(value[key]); });
    return output;
  }

  function requireTextV6544(config, field){
    var value = String(config[field] == null ? '' : config[field]).trim();
    if (!value) throw new Error('Shared table config requires "' + field + '".');
    return value;
  }

  function normalizePageV6544(value){
    var page = String(value == null ? '' : value).trim().toLowerCase();
    if (!SUPPORTED_PAGES_V6544[page]) {
      throw new Error('Shared table config page must be "tat" or "remake".');
    }
    return page;
  }

  function normalizeFeaturesV6544(features){
    var normalized = cloneV6544(DEFAULT_FEATURES_V6544);
    Object.keys(features || {}).forEach(function(name){
      normalized[name] = features[name] === true;
    });
    return normalized;
  }

  function normalizeFeatureOptionsV6544(options){
    if (options == null) return {};
    if (!isPlainObjectV6544(options)) {
      throw new Error('Shared table featureOptions must be an object.');
    }
    return cloneV6544(options);
  }

  function normalizeV6544(input){
    if (!isPlainObjectV6544(input)) {
      throw new Error('Shared table config must be an object.');
    }

    var config = cloneV6544(input);
    config.key = requireTextV6544(config, 'key');
    config.title = requireTextV6544(config, 'title');
    config.page = normalizePageV6544(config.page);
    config.size = String(config.size || 'standard').trim();
    config.features = normalizeFeaturesV6544(config.features);
    config.featureOptions = normalizeFeatureOptionsV6544(config.featureOptions);
    config.columns = Array.isArray(config.columns) ? config.columns.map(cloneV6544) : [];
    config.metadata = isPlainObjectV6544(config.metadata) ? cloneV6544(config.metadata) : {};
    config.version = VERSION_V6544;

    if (config.resolve != null && typeof config.resolve !== 'function') {
      throw new Error('Shared table config "' + config.key + '" resolve must be a function.');
    }
    if (config.renderer != null && typeof config.renderer !== 'function') {
      throw new Error('Shared table config "' + config.key + '" renderer must be a function.');
    }
    if (config.unmount != null && typeof config.unmount !== 'function') {
      throw new Error('Shared table config "' + config.key + '" unmount must be a function.');
    }

    var hasExistingTableTarget = !!String(config.tableId || config.bodyId || '').trim();
    if (!hasExistingTableTarget && typeof config.resolve !== 'function') {
      throw new Error('Shared table config "' + config.key + '" requires tableId, bodyId, or resolve.');
    }

    Object.keys(config.featureOptions).forEach(function(name){
      if (!config.features[name]) {
        throw new Error('Shared table featureOptions."' + name + '" requires features."' + name + '" to be true.');
      }
    });

    return config;
  }

  function validateV6544(input){
    try {
      return { valid:true, config:normalizeV6544(input), errors:[] };
    } catch (error) {
      return { valid:false, config:null, errors:[String(error && error.message || error)] };
    }
  }

  window.cdaSharedTableConfigV6544 = Object.freeze({
    version:VERSION_V6544,
    supportedPages:Object.freeze(Object.keys(SUPPORTED_PAGES_V6544)),
    coreFeatures:CORE_FEATURES_V6544,
    defaultFeatures:DEFAULT_FEATURES_V6544,
    normalize:normalizeV6544,
    validate:validateV6544
  });
})();
</script>
