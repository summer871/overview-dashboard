<!-- SharedTableConfigV6544.html
Defines the repository-aware configuration contract for shared table definitions.
Static definitions identify existing dashboard DOM and may provide a resolver that
builds the renderer's runtime configuration after dynamic markup exists.
-->
<script id="cdaSharedTableConfigV6544">
(function installSharedTableConfigV6544(){
  'use strict';

  if (window.cdaSharedTableConfigV6544) return;

  var VERSION_V6544 = 'v6.544';
  var DEFAULT_FEATURES_V6544 = Object.freeze({
    sorting:false,
    columnChooser:false,
    exportCurrent:false,
    exportAll:false,
    popout:false,
    collapse:false,
    totals:false,
    selection:false,
    childRows:false,
    conditionalFormatting:false,
    cumulative:false,
    miniChart:false,
    search:false,
    filtering:false,
    reset:false
  });

  function copyObjectV6544(source){
    var output = {};
    Object.keys(source || {}).forEach(function(key){ output[key] = source[key]; });
    return output;
  }

  function requireTextV6544(config, field){
    var value = String(config[field] == null ? '' : config[field]).trim();
    if (!value) throw new Error('Shared table config requires "' + field + '".');
    return value;
  }

  function normalizeFeaturesV6544(features){
    var normalized = copyObjectV6544(DEFAULT_FEATURES_V6544);
    Object.keys(features || {}).forEach(function(name){
      normalized[name] = features[name] === true;
    });
    return normalized;
  }

  function normalizeV6544(input){
    if (!input || typeof input !== 'object') {
      throw new Error('Shared table config must be an object.');
    }

    var config = copyObjectV6544(input);
    config.key = requireTextV6544(config, 'key');
    config.title = requireTextV6544(config, 'title');
    config.page = requireTextV6544(config, 'page');
    config.size = String(config.size || 'standard').trim();
    config.features = normalizeFeaturesV6544(config.features);
    config.columns = Array.isArray(config.columns) ? config.columns.slice() : [];
    config.metadata = copyObjectV6544(config.metadata);
    config.version = VERSION_V6544;

    if (config.resolve != null && typeof config.resolve !== 'function') {
      throw new Error('Shared table config "' + config.key + '" resolve must be a function.');
    }
    if (config.renderer != null && typeof config.renderer !== 'function') {
      throw new Error('Shared table config "' + config.key + '" renderer must be a function.');
    }

    var hasExistingTableTarget = !!String(config.tableId || config.bodyId || '').trim();
    if (!hasExistingTableTarget && typeof config.resolve !== 'function') {
      throw new Error('Shared table config "' + config.key + '" requires tableId, bodyId, or resolve.');
    }

    return config;
  }

  function validateV6544(input){
    try {
      return { valid:true, config:normalizeV6544(input), errors:[] };
    } catch (error) {
      return { valid:false, config:null, errors:[String(error && error.message || error)] };
    }
  }

  window.cdaSharedTableConfigV6544 = Object.freeze({
    version:VERSION_V6544,
    defaultFeatures:DEFAULT_FEATURES_V6544,
    normalize:normalizeV6544,
    validate:validateV6544
  });
})();
</script>
